name: Build article reading site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-site.txt
      - run: PYTHONPATH=tools python -m unittest discover -s tools -p test_exploration_scope.py -v
      - run: python tools/validate_content.py
      - run: python tools/build_site.py
      - run: python -m pip install playwright==1.55.0 Pillow==12.3.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-site-qa
          path: qa-artifacts
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  verify-deployed:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0 Pillow==12.3.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/browser_check.py
        env:
          ARTICLE_SITE_BASE_URL: https://zyuanming.github.io/tech-articles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-reading-site-qa
          path: qa-artifacts
