name: Isolated original image decode probe
on:
  push:
    branches: [diag/article-original-decode-20261014]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python tools/probe_original_decode.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-original-decode
          path: qa-original-probe
