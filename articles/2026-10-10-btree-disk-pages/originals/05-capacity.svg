<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1267" viewBox="0 0 960 760" role="img"><title>三层为什么可能容纳四百万条？</title><rect width="960" height="760" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">三层为什么可能容纳四百万条？</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">只作容量估算：内部扇出 200，叶页 100 条</text>
<rect x="70" y="180" width="300" height="95" rx="8" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="220.0" y="241.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="700" fill="#5276bf" text-anchor="middle">1</text>
<text x="430" y="234" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#5276bf" text-anchor="start">根页</text>
<text x="430" y="279" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">每页指向 200 个子页</text>
<line x1="220" y1="282" x2="220" y2="338" stroke="#5276bf" stroke-width="4"/>
<polygon points="220,338 212.6055859201091,322.6923992600045 227.3944140798909,322.6923992600045" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
<rect x="70" y="350" width="300" height="95" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="220.0" y="411.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="700" fill="#087f8c" text-anchor="middle">200</text>
<text x="430" y="404" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#087f8c" text-anchor="start">第二层索引页</text>
<text x="430" y="449" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">每页指向 200 个子页</text>
<line x1="220" y1="452" x2="220" y2="508" stroke="#087f8c" stroke-width="4"/>
<polygon points="220,508 212.6055859201091,492.6923992600045 227.3944140798909,492.6923992600045" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<rect x="70" y="520" width="300" height="95" rx="8" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="220.0" y="581.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="700" fill="#e57735" text-anchor="middle">40,000</text>
<text x="430" y="574" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#e57735" text-anchor="start">叶页</text>
<text x="430" y="619" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">每页放 100 条记录</text>
<text x="42" y="722" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">200 × 200 × 100 = 4,000,000；不是保证填满，也不是性能实测。</text></svg>