<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>第 4 条记录来了：分裂叶页</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">第 4 条记录来了：分裂叶页</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">约定每个叶页最多 3 条，分隔键取右叶最小值</text>
<rect x="125" y="175" width="710" height="85" rx="8" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="480.0" y="230.1" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#e57735" text-anchor="middle">10     20     30     40</text>
<line x1="360" y1="274" x2="245" y2="505" stroke="#087f8c" stroke-width="4"/>
<polygon points="245,505 245.2025418521425,488.0012066075815 258.44151432976304,494.5920370618082" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<line x1="595" y1="274" x2="715" y2="505" stroke="#087f8c" stroke-width="4"/>
<polygon points="715,505 701.3815086369674,494.82470182279627 714.5051948916182,488.00720246973094" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<rect x="375" y="330" width="210" height="70" rx="8" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="480.0" y="377.6" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#5276bf" text-anchor="middle">30</text>
<line x1="405" y1="405" x2="255" y2="500" stroke="#5276bf" stroke-width="4"/>
<line x1="558" y1="405" x2="705" y2="500" stroke="#5276bf" stroke-width="4"/>
<rect x="60" y="510" width="360" height="90" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="240.0" y="567.6" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#087f8c" text-anchor="middle">10     20</text>
<rect x="540" y="510" width="360" height="90" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="720.0" y="567.6" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#087f8c" text-anchor="middle">30     40</text>
<line x1="424" y1="555" x2="534" y2="555" stroke="#e57735" stroke-width="4"/>
<polygon points="534,555 518.6923992600045,562.3944140798909 518.6923992600045,547.6055859201091" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="480" y="685" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#183747" text-anchor="middle">30 仍留在叶子；父页中的 30 只作导航。</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">这是本文 B+ 树模型；不要套用成所有 B 树的中位数搬移。</text></svg>