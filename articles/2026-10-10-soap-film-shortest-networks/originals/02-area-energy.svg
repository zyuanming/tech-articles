<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">把一层膜拉大，需要做功</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">在表面张力近似均匀、忽略重力等影响时，表面能随总面积增加。</text><rect x="250" y="275" width="530" height="425" rx="0" fill="#c6e8e6" stroke="none" stroke-width="3"/><path d="M920 275 L250 275 L250 700 L920 700" fill="none" stroke="#516d7d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><line x1="780" y1="260" x2="780" y2="715" stroke="#ef9754" stroke-width="17"/><line x1="790" y1="490" x2="1120" y2="490" stroke="#c4565a" stroke-width="6" marker-end="url(#arr)"/><text x="960" y="440" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">向右拉动边杆</text><line x1="740" y1="430" x2="565" y2="430" stroke="#277fc5" stroke-width="5" marker-end="url(#arr)"/><line x1="740" y1="560" x2="565" y2="560" stroke="#277fc5" stroke-width="5" marker-end="url(#arr)"/><text x="480" y="370" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">膜把边杆往回拉</text><text x="150" y="795" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">肥皂膜有两个液体—空气表面，面积都要计入。</text><text x="150" y="839" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">缩小可减小表面能；边框、空气体积等约束决定它不能随意缩到零。</text></svg>