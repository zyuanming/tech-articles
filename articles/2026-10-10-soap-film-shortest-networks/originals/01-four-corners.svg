<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">四个角都要连通，总长度越短越好</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">同一个单位正方形；允许途中增加交叉点。比的是全部线段之和。</text><text x="245" y="240" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">沿着三条边</text><rect x="100" y="350" width="290" height="290" rx="0" fill="none" stroke="#b6c9ce" stroke-width="3"/><path d="M100 350 L390 350 L390 640 L100 640" fill="none" stroke="#277fc5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="350" r="12" fill="#173449" stroke="none" stroke-width="3"/><circle cx="390" cy="350" r="12" fill="#173449" stroke="none" stroke-width="3"/><circle cx="100" cy="640" r="12" fill="#173449" stroke="none" stroke-width="3"/><circle cx="390" cy="640" r="12" fill="#173449" stroke="none" stroke-width="3"/><text x="245" y="740" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">总长 3</text><text x="705" y="240" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">画两条对角线</text><rect x="560" y="350" width="290" height="290" rx="0" fill="none" stroke="#b6c9ce" stroke-width="3"/><line x1="560" y1="350" x2="850" y2="640" stroke="#ef9754" stroke-width="7"/><line x1="850" y1="350" x2="560" y2="640" stroke="#ef9754" stroke-width="7"/><circle cx="560" cy="350" r="12" fill="#173449" stroke="none" stroke-width="3"/><circle cx="850" cy="350" r="12" fill="#173449" stroke="none" stroke-width="3"/><circle cx="560" cy="640" r="12" fill="#173449" stroke="none" stroke-width="3"/><circle cx="850" cy="640" r="12" fill="#173449" stroke="none" stroke-width="3"/><text x="705" y="740" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">总长 2√2 ≈ 2.828</text><text x="1165" y="240" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">增加两个交会点</text><rect x="1020" y="350" width="290" height="290" rx="0" fill="none" stroke="#b6c9ce" stroke-width="3"/><line x1="1020" y1="350" x2="1103.7157890324956" y2="495.0" stroke="#579677" stroke-width="7"/><line x1="1020" y1="640" x2="1103.7157890324956" y2="495.0" stroke="#579677" stroke-width="7"/><line x1="1310" y1="350" x2="1226.2842109675044" y2="495.0" stroke="#579677" stroke-width="7"/><line x1="1310" y1="640" x2="1226.2842109675044" y2="495.0" stroke="#579677" stroke-width="7"/><line x1="1103.7157890324956" y1="495.0" x2="1226.2842109675044" y2="495.0" stroke="#579677" stroke-width="7"/><circle cx="1103.7157890324956" cy="495.0" r="10" fill="#ef9754" stroke="none" stroke-width="3"/><circle cx="1226.2842109675044" cy="495.0" r="10" fill="#ef9754" stroke="none" stroke-width="3"/><circle cx="1020" cy="350" r="12" fill="#173449" stroke="none" stroke-width="3"/><circle cx="1310" cy="350" r="12" fill="#173449" stroke="none" stroke-width="3"/><circle cx="1020" cy="640" r="12" fill="#173449" stroke="none" stroke-width="3"/><circle cx="1310" cy="640" r="12" fill="#173449" stroke="none" stroke-width="3"/><text x="1165" y="740" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">总长 1+√3 ≈ 2.732</text><text x="720" y="840" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="34" font-weight="normal" fill="#173449">多了两个路口，反而少用了路。</text></svg>