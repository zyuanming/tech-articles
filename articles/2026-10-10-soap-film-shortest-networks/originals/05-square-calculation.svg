<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">把最短网络拆开，亲手算出2.732</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">正方形边长为1；两个新增交会点都在水平中线上。</text><rect x="150" y="245" width="440" height="440" rx="0" fill="none" stroke="#b6c9ce" stroke-width="3"/><line x1="150" y1="245" x2="277.01705922171766" y2="465.0" stroke="#579677" stroke-width="6"/><circle cx="150" cy="245" r="10" fill="#173449" stroke="none" stroke-width="3"/><line x1="150" y1="685" x2="277.01705922171766" y2="465.0" stroke="#579677" stroke-width="6"/><circle cx="150" cy="685" r="10" fill="#173449" stroke="none" stroke-width="3"/><line x1="590" y1="245" x2="462.98294077828234" y2="465.0" stroke="#579677" stroke-width="6"/><circle cx="590" cy="245" r="10" fill="#173449" stroke="none" stroke-width="3"/><line x1="590" y1="685" x2="462.98294077828234" y2="465.0" stroke="#579677" stroke-width="6"/><circle cx="590" cy="685" r="10" fill="#173449" stroke="none" stroke-width="3"/><line x1="277.01705922171766" y1="465.0" x2="462.98294077828234" y2="465.0" stroke="#579677" stroke-width="6"/><line x1="150" y1="465.0" x2="277.01705922171766" y2="465.0" stroke="#ef9754" stroke-width="3"/><text x="95" y="365.0" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">1/2</text><text x="213.50852961085883" y="505.0" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">x</text><text x="237.01705922171766" y="435.0" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#173449">60°</text><text x="800" y="290" text-anchor="start" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">x = 1 / (2√3)</text><text x="800" y="365" text-anchor="start" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">每条斜边 = 1 / √3</text><text x="800" y="440" text-anchor="start" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">中间短边 = 1 − 1 / √3</text><text x="735" y="650" text-anchor="start" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">四条斜边 + 中间短边</text><text x="735" y="715" text-anchor="start" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">= 4 / √3 + 1 − 1 / √3</text><text x="735" y="780" text-anchor="start" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">= 1 + √3 ≈ 2.732</text><text x="370" y="790" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">左边的小直角三角形</text></svg>