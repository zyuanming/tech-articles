<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">停下来，可能只是落进了一个“小山谷”</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">横轴只是形状变化的抽象方向；曲线不是某次肥皂膜实验的真实能量。</text><line x1="140" y1="750" x2="1320" y2="750" stroke="#516d7d" stroke-width="3" marker-end="url(#arr)"/><line x1="140" y1="750" x2="140" y2="210" stroke="#516d7d" stroke-width="3" marker-end="url(#arr)"/><text x="180" y="205" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">能量</text><path d="M190 320 C260 220 280 640 430 590 C560 560 565 260 720 300 C850 330 860 710 1050 680 C1190 660 1210 320 1290 310" fill="none" stroke="#277fc5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="590" r="16" fill="#ef9754" stroke="none" stroke-width="3"/><circle cx="1050" cy="680" r="16" fill="#579677" stroke="none" stroke-width="3"/><text x="390" y="660" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">局部低点</text><text x="1090" y="615" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">更低的状态</text><text x="720" y="850" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" fill="#173449">“附近怎么挪都更高” ≠ “所有可能形状里最低”。</text></svg>