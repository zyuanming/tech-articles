<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">两块平行板，把面积问题压成长度问题</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">薄膜近似竖直跨过间隙，板间距h固定，忽略边缘与液体厚度效应。</text><polygon points="170,660 900,660 1170,380 440,380" fill="#dfe9ed" stroke="#b6c9ce" stroke-width="3"/><polygon points="170,440 900,440 1170,160 440,160" fill="#edf4f7" stroke="#b6c9ce" stroke-width="3"/><polygon points="400,500 850,500 850,280 400,280" fill="#9bd4d1" stroke="#45bac6" stroke-width="4"/><line x1="400" y1="280" x2="400" y2="690" stroke="#173449" stroke-width="8"/><line x1="850" y1="280" x2="850" y2="690" stroke="#173449" stroke-width="8"/><line x1="400" y1="735" x2="850" y2="735" stroke="#ef9754" stroke-width="4"/><text x="625" y="780" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">俯视线段长度 L</text><line x1="125" y1="440" x2="125" y2="660" stroke="#277fc5" stroke-width="4"/><text x="70" y="565" text-anchor="start" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">h</text><text x="1060" y="510" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">一小片膜的面积</text><text x="1060" y="575" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="36" font-weight="normal" fill="#277fc5">约为 L × h</text><text x="720" y="870" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">间距相同：线越长，竖直膜面积就越大。两个表面只带来同样的倍数。</text></svg>