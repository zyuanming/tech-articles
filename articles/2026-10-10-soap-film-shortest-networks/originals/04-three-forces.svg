<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">为什么一个自由交会点，常常连着三条120°的边？</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">理想模型：三片膜的张力相等、交会点可移动，没有额外外力。</text><line x1="530" y1="485" x2="820.0" y2="485.0" stroke="#277fc5" stroke-width="8" marker-end="url(#arr)"/><line x1="530" y1="485" x2="385.00000000000006" y2="233.85263290251277" stroke="#ef9754" stroke-width="8" marker-end="url(#arr)"/><line x1="530" y1="485" x2="384.9999999999999" y2="736.1473670974872" stroke="#579677" stroke-width="8" marker-end="url(#arr)"/><circle cx="530" cy="485" r="14" fill="#173449" stroke="none" stroke-width="3"/><text x="590" y="350" text-anchor="start" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">120°</text><text x="320" y="500" text-anchor="start" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">120°</text><text x="590" y="655" text-anchor="start" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">120°</text><text x="960" y="370" text-anchor="start" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" fill="#173449">三份同样大的拉力</text><text x="960" y="414" text-anchor="start" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" fill="#173449">方向均匀分开</text><text x="960" y="458" text-anchor="start" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" fill="#173449">矢量和才为零</text><text x="130" y="815" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">120°是自由内部交会点的条件，不是所有边界钉子处都必须满足。</text><text x="130" y="859" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">固定点、不同表面张力或封闭气泡的压差，会改变具体问题。</text></svg>