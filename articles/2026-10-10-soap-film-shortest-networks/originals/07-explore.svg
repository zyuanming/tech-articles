<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">先固定规则，再比较答案</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">这是课堂探索方案。器材由老师准备；先用纸笔与线绳，湿实验不是必需。</text><rect x="70" y="250" width="380" height="475" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="260" y="335" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">① 画同样的四个点</text><text x="105" y="445" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">画出三种连接法</text><text x="105" y="530" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">逐段量长度后相加</text><text x="105" y="615" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">不能只比最长的一条</text><rect x="535" y="250" width="380" height="475" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="725" y="335" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">② 比较重复实验</text><text x="570" y="445" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">固定板距、钉子位置</text><text x="570" y="530" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">改变取出方向或初态</text><text x="570" y="615" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">记录每次形成的网络</text><rect x="1000" y="250" width="380" height="475" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="1190" y="335" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">③ 检查偏差来源</text><text x="1035" y="445" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">板子是否平行？</text><text x="1035" y="530" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">钉子是否有粗细？</text><text x="1035" y="615" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">膜是否夹住了气泡？</text><text x="100" y="815" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">使用预制透明塑料板、钝头连接件与少量肥皂水，远离插座；不自行切玻璃。</text><text x="100" y="859" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">只拍照、测量和比较，不把一次成功或失败当成数学证明。</text></svg>