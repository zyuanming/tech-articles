<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1083" viewBox="0 0 960 650" role="img"><title>便宜的桥，也可能要跳过</title><rect width="960" height="650" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">便宜的桥，也可能要跳过</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">按费用依次考虑；已经同组的两端不再连接</text>
<line x1="200" y1="230" x2="750" y2="230" stroke="#087f8c" stroke-width="6"/>
<rect x="457.0" y="206.0" width="36" height="38" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="475.0" y="235.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<line x1="750" y1="230" x2="200" y2="490" stroke="#087f8c" stroke-width="6"/>
<rect x="362.0" y="381.0" width="36" height="38" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="380.0" y="410.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">2</text>
<line x1="200" y1="230" x2="200" y2="490" stroke="#c54c53" stroke-width="6" stroke-dasharray="12 10"/>
<rect x="182.0" y="336.0" width="36" height="38" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="200.0" y="365.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#c54c53" text-anchor="middle">3</text>
<line x1="200" y1="490" x2="750" y2="490" stroke="#087f8c" stroke-width="6"/>
<rect x="457.0" y="466.0" width="36" height="38" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="475.0" y="495.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">4</text>
<line x1="200" y1="230" x2="750" y2="490" stroke="#d2dbd8" stroke-width="6" stroke-dasharray="12 10"/>
<rect x="552.0" y="381.0" width="36" height="38" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
<text x="570.0" y="410.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#d2dbd8" text-anchor="middle">5</text>
<circle cx="200" cy="230" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="200" y="240" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">A</text>
<circle cx="750" cy="230" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="750" y="240" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">B</text>
<circle cx="200" cy="490" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="200" y="500" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">C</text>
<circle cx="750" cy="490" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="750" y="500" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">D</text>
<text x="42" y="612" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">1、2、4加入；3会形成环而跳过。灰边5也无需加入。</text></svg>