<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1083" viewBox="0 0 960 650" role="img"><title>相同的分组，不同的删边后果</title><rect width="960" height="650" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">相同的分组，不同的删边后果</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">删边前，两张图都把0、1、2归为同一组</text>
<line x1="120" y1="280" x2="390" y2="280" stroke="#c54c53" stroke-width="5" stroke-dasharray="12 9"/>
<line x1="390" y1="280" x2="260" y2="455" stroke="#087f8c" stroke-width="5"/>
<circle cx="120" cy="280" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="120" y="290" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">0</text>
<circle cx="390" cy="280" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="390" y="290" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<circle cx="260" cy="455" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="260" y="465" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">2</text>
<text x="260" y="545" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#c54c53" text-anchor="middle">删红边：0被隔开</text>
<line x1="590" y1="280" x2="860" y2="280" stroke="#c54c53" stroke-width="5" stroke-dasharray="12 9"/>
<line x1="860" y1="280" x2="730" y2="455" stroke="#087f8c" stroke-width="5"/>
<line x1="590" y1="280" x2="730" y2="455" stroke="#087f8c" stroke-width="5"/>
<circle cx="590" cy="280" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="590" y="290" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">0</text>
<circle cx="860" cy="280" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="860" y="290" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<circle cx="730" cy="455" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="730" y="465" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">2</text>
<text x="730" y="545" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#087f8c" text-anchor="middle">删红边：仍连通</text>
<text x="42" y="612" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">普通并查集没有保存足够的边信息，不能直接支持任意删边。</text></svg>