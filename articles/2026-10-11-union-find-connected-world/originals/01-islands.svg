<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1017" viewBox="0 0 960 610" role="img"><title>桥在增加，连通组在合并</title><rect width="960" height="610" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">桥在增加，连通组在合并</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">实际桥的连接关系，与数据结构里的父指针分开看</text>
<rect x="40" y="170" width="290" height="330" rx="12" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<line x1="100" y1="265" x2="265" y2="265" stroke="#087f8c" stroke-width="6"/>
<circle cx="100" cy="265" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="100" y="275" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">0</text>
<circle cx="265" cy="265" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="265" y="275" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<circle cx="100" cy="410" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="100" y="420" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">2</text>
<circle cx="265" cy="410" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="265" y="420" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">3</text>
<text x="185" y="210" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">加桥0—1</text>
<rect x="355" y="170" width="290" height="330" rx="12" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<line x1="415" y1="265" x2="580" y2="265" stroke="#087f8c" stroke-width="6"/>
<line x1="415" y1="410" x2="580" y2="410" stroke="#087f8c" stroke-width="6"/>
<circle cx="415" cy="265" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="415" y="275" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">0</text>
<circle cx="580" cy="265" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="580" y="275" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<circle cx="415" cy="410" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="415" y="420" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">2</text>
<circle cx="580" cy="410" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="580" y="420" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">3</text>
<text x="500" y="210" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">再加2—3</text>
<rect x="670" y="170" width="290" height="330" rx="12" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<line x1="730" y1="265" x2="895" y2="265" stroke="#087f8c" stroke-width="6"/>
<line x1="730" y1="410" x2="895" y2="410" stroke="#087f8c" stroke-width="6"/>
<line x1="895" y1="265" x2="895" y2="410" stroke="#087f8c" stroke-width="6"/>
<circle cx="730" cy="265" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="730" y="275" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">0</text>
<circle cx="895" cy="265" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="895" y="275" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<circle cx="730" cy="410" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="730" y="420" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">2</text>
<circle cx="895" cy="410" r="29" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="895" y="420" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#087f8c" text-anchor="middle">3</text>
<text x="815" y="210" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">再加1—3</text>
<text x="42" y="572" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">最后所有岛都在同一个连通组，即使0与2没有直接桥。</text></svg>