<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>过去和未来，分别放在两叠卡片里</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">过去和未来，分别放在两叠卡片里</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">卡片越靠上，越先被取出；当前文字单独保存</text>
<text x="190" y="220" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#087f8c" text-anchor="middle">撤销栈</text>
<line x1="75" y1="540" x2="320" y2="540" stroke="#183747" stroke-width="4"/>
<text x="750" y="220" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#e57735" text-anchor="middle">重做栈</text>
<line x1="635" y1="540" x2="880" y2="540" stroke="#183747" stroke-width="4"/>
<rect x="80" y="430" width="220" height="85" rx="10" fill="#cde4df" stroke="#087f8c" stroke-width="2"/>
<text x="190" y="485" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#087f8c" text-anchor="middle">猫</text>
<rect x="80" y="325" width="220" height="85" rx="10" fill="#cde4df" stroke="#087f8c" stroke-width="2"/>
<text x="190" y="380" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#087f8c" text-anchor="middle">猫跑</text>
<rect x="355" y="330" width="250" height="120" rx="10" fill="#ffffff" stroke="#183747" stroke-width="2"/>
<text x="480" y="405" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="39" font-weight="400" fill="#183747" text-anchor="middle">猫跑了</text>
<text x="480" y="280" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="middle">当前</text>
<text x="740" y="475" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#57727c" text-anchor="middle">空</text>
<line x1="580" y1="575" x2="745" y2="575" stroke="#e57735" stroke-width="4"/>
<polygon points="745,575 729.6923992600045,582.3944140798909 729.6923992600045,567.6055859201091" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="70" y="670" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">撤销：先把当前存入未来，再取回过去。</text></svg>