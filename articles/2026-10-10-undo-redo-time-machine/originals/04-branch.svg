<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>撤销之后再编辑，会出现新的未来</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">撤销之后再编辑，会出现新的未来</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">最常见的线性历史：旧重做分支被丢弃</text>
<line x1="200" y1="360" x2="380" y2="360" stroke="#087f8c" stroke-width="5"/>
<polygon points="380,360 364.6923992600045,367.3944140798909 364.6923992600045,352.6055859201091" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<line x1="515" y1="340" x2="695" y2="265" stroke="#57727c" stroke-width="4" stroke-dasharray="10 8"/>
<line x1="520" y1="390" x2="695" y2="510" stroke="#e57735" stroke-width="5"/>
<polygon points="695,510 678.1936291823191,507.44150436025313 686.5571308520547,495.2447310918888" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<rect x="55" y="310" width="190" height="100" rx="10" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<text x="150" y="373" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="middle">猫</text>
<rect x="350" y="310" width="190" height="100" rx="10" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<text x="445" y="373" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="middle">猫跑</text>
<rect x="670" y="190" width="190" height="100" rx="10" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<text x="765" y="253" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="middle">猫跑了</text>
<rect x="670" y="480" width="190" height="100" rx="10" fill="#ffffff" stroke="#e57735" stroke-width="2"/>
<text x="765" y="543" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="middle">猫跑快</text>
<line x1="670" y1="170" x2="865" y2="305" stroke="#c54c53" stroke-width="5"/>
<line x1="865" y1="170" x2="670" y2="305" stroke="#c54c53" stroke-width="5"/>
<text x="45" y="655" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#183747" text-anchor="start">从“猫跑了”撤回“猫跑”，然后输入“快”。</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">保留分支也能设计，但界面和历史语义会更复杂。</text></svg>