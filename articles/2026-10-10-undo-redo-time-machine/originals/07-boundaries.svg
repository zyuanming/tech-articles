<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>撤销是状态设计，也有明确边界</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">撤销是状态设计，也有明确边界</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">本地文档历史，不会自动倒转外部世界</text>
<text x="60" y="190" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#087f8c" text-anchor="start">本地文字与图形</text>
<text x="60" y="238" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="start">可恢复旧内容、位置与属性</text>
<text x="60" y="327" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#5276bf" text-anchor="start">已保存的文件</text>
<text x="60" y="375" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="start">需定义保存标记与历史是否持久化</text>
<text x="60" y="464" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#e57735" text-anchor="start">已发出的消息或请求</text>
<text x="60" y="512" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="start">对方可能已收到，不能当作没发生</text>
<text x="60" y="601" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#c54c53" text-anchor="start">多人正在一起改</text>
<text x="60" y="649" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="start">需区分自己的操作与他人的操作</text></svg>