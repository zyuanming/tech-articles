<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>从 4 个桶变成 8 个桶，要重新决定位置</title><rect width="960" height="780" fill="#f7f4ed"/>
