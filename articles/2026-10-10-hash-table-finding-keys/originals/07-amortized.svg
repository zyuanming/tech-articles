<text x="110" y="185" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#e57735" text-anchor="start">橙柱：插入成本 + 搬迁成本</text>
<text x="110" y="246" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#183747" text-anchor="start">搬迁总数 = 1+2+4+8+16 = 31</text>
<text x="110" y="310" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#183747" text-anchor="start">32 次插入 + 31 次搬迁 = 63 单位</text>
<text x="710" y="688" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#57727c" text-anchor="start">第几次插入</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">这是计数模型，不是运行时间；哈希和比较成本另有假设。</text></svg>