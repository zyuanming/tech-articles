<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">永久失联不能传播；收敛也不等于保住所有业务约束。</text></svg>