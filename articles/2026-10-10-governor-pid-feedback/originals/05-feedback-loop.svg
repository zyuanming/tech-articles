<text x="705.0" y="260" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#183747" text-anchor="middle">控制器</text>
<text x="705.0" y="296" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="middle">把 e 变成 u</text>
<rect x="535" y="485" width="340" height="95" rx="14" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="705.0" y="525" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#183747" text-anchor="middle">水泵与水箱</text>
<text x="705.0" y="561" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="middle">输入改变水位</text>
