<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1517" viewBox="0 0 960 910" role="img"><title>结果回到起点，形成闭环</title><rect width="960" height="910" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">结果回到起点，形成闭环</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">r：目标　y：测量　e：误差　u：控制命令</text>
