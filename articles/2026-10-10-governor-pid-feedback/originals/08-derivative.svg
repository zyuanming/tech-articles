<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>相同水位，不同上升趋势</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">相同水位，不同上升趋势</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">D 看变化率；不是预知未来</text>
<line x1="75" y1="280" x2="435" y2="280" stroke="#c54c53" stroke-width="3" stroke-dasharray="12 9"/>
<text x="75" y="242" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#c54c53" text-anchor="start">目标</text>
<line x1="75" y1="590" x2="435" y2="590" stroke="#d2dbd8" stroke-width="3"/>
<path d="M 75 390 L 225 360 L 415 335" fill="none" stroke="#087f8c" stroke-width="5" stroke-linejoin="round"/>
<circle cx="225" cy="360" r="10" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="225" y="420" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#183747" text-anchor="middle">现在：9 cm</text>
<text x="245" y="655" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#087f8c" text-anchor="middle">缓慢靠近</text>
<line x1="535" y1="280" x2="895" y2="280" stroke="#c54c53" stroke-width="3" stroke-dasharray="12 9"/>
<text x="535" y="242" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#c54c53" text-anchor="start">目标</text>
<line x1="535" y1="590" x2="895" y2="590" stroke="#d2dbd8" stroke-width="3"/>
<path d="M 535 530 L 685 360 L 875 145" fill="none" stroke="#e57735" stroke-width="5" stroke-linejoin="round"/>
<circle cx="685" cy="360" r="10" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="685" y="420" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#183747" text-anchor="middle">现在：9 cm</text>
<text x="705" y="655" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#e57735" text-anchor="middle">快速冲向目标</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">目标固定时，水位上升越快，误差减小越快。</text></svg>