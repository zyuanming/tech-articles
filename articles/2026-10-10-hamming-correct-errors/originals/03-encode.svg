<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1233" viewBox="0 0 960 740" role="img"><title>把 1011 放进七个位置</title><rect width="960" height="740" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">把 1011 放进七个位置</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">校验位放 1、2、4，数据位放 3、5、6、7</text>
<text x="100" y="221" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="middle">1</text>
<rect x="52" y="260" width="96" height="88" rx="8" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="100.0" y="318.7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#e57735" text-anchor="middle">0</text>
<text x="100" y="401" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#e57735" text-anchor="middle">p₁</text>
<text x="226" y="221" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="middle">2</text>
<rect x="178" y="260" width="96" height="88" rx="8" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="226.0" y="318.7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#e57735" text-anchor="middle">1</text>
<text x="226" y="401" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#e57735" text-anchor="middle">p₂</text>
<text x="352" y="221" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="middle">3</text>
<rect x="304" y="260" width="96" height="88" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="352.0" y="318.7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<text x="352" y="401" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#087f8c" text-anchor="middle">d₁</text>
<text x="478" y="221" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="middle">4</text>
<rect x="430" y="260" width="96" height="88" rx="8" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="478.0" y="318.7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#e57735" text-anchor="middle">0</text>
<text x="478" y="401" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#e57735" text-anchor="middle">p₄</text>
<text x="604" y="221" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="middle">5</text>
<rect x="556" y="260" width="96" height="88" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="604.0" y="318.7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#087f8c" text-anchor="middle">0</text>
<text x="604" y="401" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#087f8c" text-anchor="middle">d₂</text>
<text x="730" y="221" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="middle">6</text>
<rect x="682" y="260" width="96" height="88" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="730.0" y="318.7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<text x="730" y="401" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#087f8c" text-anchor="middle">d₃</text>
<text x="856" y="221" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="middle">7</text>
<rect x="808" y="260" width="96" height="88" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="856.0" y="318.7" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<text x="856" y="401" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#087f8c" text-anchor="middle">d₄</text>
<text x="480" y="488" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#183747" text-anchor="middle">p₁ = 1 ⊕ 0 ⊕ 1 = 0</text>
<text x="480" y="556" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#183747" text-anchor="middle">p₂ = 1 ⊕ 1 ⊕ 1 = 1</text>
<text x="480" y="624" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#183747" text-anchor="middle">p₄ = 0 ⊕ 1 ⊕ 1 = 0</text>
<text x="42" y="702" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">每组 1 的个数为偶数；⊕ 是不进位的模 2 加法。</text></svg>