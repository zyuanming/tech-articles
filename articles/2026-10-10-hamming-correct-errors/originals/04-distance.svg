<text x="235" y="470" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#087f8c" text-anchor="middle">100</text>
<circle cx="725" cy="355" r="175" fill="none" stroke="#5276bf" stroke-width="4"/>
<rect x="650" y="310" width="150" height="85" rx="8" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="725.0" y="364.4" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#5276bf" text-anchor="middle">111</text>
<text x="633" y="262" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#5276bf" text-anchor="middle">110</text>
<text x="820" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#5276bf" text-anchor="middle">101</text>
<text x="725" y="470" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#5276bf" text-anchor="middle">011</text>
<text x="480" y="596" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#183747" text-anchor="middle">相距 3：各改一位的邻域不会重叠。</text></svg>