<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1267" viewBox="0 0 960 760" role="img"><title>显示在两个已知状态之间</title><rect width="960" height="760" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">显示在两个已知状态之间</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">h=20 ms，剩余5 ms，所以 α=0.25</text>
<line x1="100" y1="335" x2="860" y2="335" stroke="#183747" stroke-width="4"/>
<circle cx="160" cy="335" r="16" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
<text x="160" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#5276bf" text-anchor="middle">上一步：x=8</text>
<circle cx="315" cy="335" r="16" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="315" y="425" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#e57735" text-anchor="middle">显示：x=8.5</text>
<circle cx="780" cy="335" r="16" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="780" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#087f8c" text-anchor="middle">当前：x=10</text>
<text x="130" y="545" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#183747" text-anchor="start">x显示 = 0.75×8 + 0.25×10 = 8.5</text>
<text x="130" y="630" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#183747" text-anchor="start">平滑的代价：显示时间比现实目标滞后一步</text></svg>