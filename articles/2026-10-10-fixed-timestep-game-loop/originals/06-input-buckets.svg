<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1267" viewBox="0 0 960 760" role="img"><title>输入也需要属于某个模拟时刻</title><rect width="960" height="760" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">输入也需要属于某个模拟时刻</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">时间戳把按键放进对应的逻辑步，避免一帧重复触发</text>
<rect x="95" y="305" width="190" height="170" rx="0" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="190" y="560" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#183747" text-anchor="middle">0–20 ms</text>
<rect x="300" y="305" width="190" height="170" rx="0" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="395" y="560" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#183747" text-anchor="middle">20–40 ms</text>
<rect x="505" y="305" width="190" height="170" rx="0" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="600" y="560" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#183747" text-anchor="middle">40–60 ms</text>
<rect x="710" y="305" width="190" height="170" rx="0" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="805" y="560" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#183747" text-anchor="middle">60–80 ms</text>
<line x1="362" y1="185" x2="362" y2="345" stroke="#e57735" stroke-width="6"/>
<polygon points="362,345 354.6055859201091,329.6923992600045 369.3944140798909,329.6923992600045" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="270" y="155" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#e57735" text-anchor="start">27 ms：按下</text>
<text x="95" y="665" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#183747" text-anchor="start">按下事件只消费一次；持续按住是另一种状态。</text></svg>