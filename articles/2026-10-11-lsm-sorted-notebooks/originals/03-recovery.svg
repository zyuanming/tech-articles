<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>还没写出的内存变化，从哪里找回来？</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">还没写出的内存变化，从哪里找回来？</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">先明确所需的持久性，再谈恢复</text>
<rect x="70" y="195" width="330" height="125" rx="16" fill="#ffffff" stroke="#c54c53" stroke-width="3"/>
<text x="235.0" y="244" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#c54c53" text-anchor="middle">内存表</text>
<text x="235.0" y="289" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">断电可能丢失</text>
<rect x="560" y="195" width="330" height="125" rx="16" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="725.0" y="244" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#087f8c" text-anchor="middle">已持久化 WAL</text>
<text x="725.0" y="289" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">保留恢复信息</text>
<line x1="85" y1="210" x2="382" y2="305" stroke="#c54c53" stroke-width="6"/>
<line x1="720" y1="344" x2="720" y2="470" stroke="#183747" stroke-width="4"/>
<polygon points="720,470 712.6055859201091,454.6923992600045 727.3944140798909,454.6923992600045" fill="#183747" stroke="#183747" stroke-width="3"/>
<rect x="560" y="500" width="330" height="125" rx="16" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="725.0" y="549" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#5276bf" text-anchor="middle">重启后重放</text>
<text x="725.0" y="594" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">重建待写出的状态</text>
<line x1="535" y1="562" x2="430" y2="562" stroke="#183747" stroke-width="4"/>
<polygon points="430,562 445.3076007399955,554.6055859201091 445.3076007399955,569.3944140798909" fill="#183747" stroke="#183747" stroke-width="3"/>
<rect x="70" y="500" width="330" height="125" rx="16" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="235.0" y="549" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#087f8c" text-anchor="middle">恢复出的内存表</text>
<text x="235.0" y="594" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">再继续服务</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">只进缓存不等于断电安全；日志回收也要满足安全条件。</text></svg>