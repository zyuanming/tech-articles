<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>新值与墓碑，都能挡住旧记录</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">新值与墓碑，都能挡住旧记录</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">最小模型：从新到旧寻找可见版本</text>
<text x="245" y="180" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#087f8c" text-anchor="middle">查 A</text>
<rect x="60" y="220" width="370" height="100" rx="16" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="245.0" y="269" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#087f8c" text-anchor="middle">A:15 @4</text>
<rect x="60" y="455" width="370" height="100" rx="16" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="245.0" y="504" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#5276bf" text-anchor="middle">A:10 @1</text>
<line x1="245" y1="339" x2="245" y2="432" stroke="#d2dbd8" stroke-width="4" stroke-dasharray="10 10"/>
<line x1="200" y1="385" x2="290" y2="385" stroke="#c54c53" stroke-width="6"/>
<text x="245" y="650" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#087f8c" text-anchor="middle">返回 15</text>
<text x="710" y="180" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="700" fill="#c54c53" text-anchor="middle">查 C</text>
<rect x="525" y="220" width="370" height="100" rx="16" fill="#ffffff" stroke="#c54c53" stroke-width="3"/>
<text x="710.0" y="269" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#c54c53" text-anchor="middle">C:删除 @5</text>
<rect x="525" y="455" width="370" height="100" rx="16" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="710.0" y="504" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#5276bf" text-anchor="middle">C:30 @2</text>
<line x1="710" y1="339" x2="710" y2="432" stroke="#d2dbd8" stroke-width="4" stroke-dasharray="10 10"/>
<line x1="665" y1="385" x2="755" y2="385" stroke="#c54c53" stroke-width="6"/>
<text x="710" y="650" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#c54c53" text-anchor="middle">返回不存在</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">如果把删除标记擦掉，旧 C 就可能再次被读出来。</text></svg>