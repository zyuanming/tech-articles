<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chebyshev 实算报告</title><style>
*{box-sizing:border-box}body{margin:0;padding:46px;background:#f8fafc;color:#142d42;font:40px/1.55 'Noto Sans CJK SC',sans-serif}h1{font-size:48px;margin:0 0 20px}h2{font-size:44px;margin:36px 0 16px}p{margin:15px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:18px 8px;border-bottom:2px solid #93a7b9;font-weight:400}.blue{color:#176297}.green{color:#166c57}small{font-size:40px;display:block} @media(max-width:600px){body{padding:20px;font-size:17px}h1{font-size:24px}h2{font-size:21px}small{font-size:17px}th,td{padding:10px 3px}}
</style><body><h1>Chebyshev 实算报告</h1><p>本篇 Python 输出的只读查看页</p><p>输入：x⁴，区间 [−1, 1]<br>允许次数 ≤ 3</p><h2>交换迭代</h2><table><thead><tr><th>轮次</th><th>参考幅度</th><th>最大绝对误差</th></tr></thead><tbody id="rounds"></tbody></table><p>最大绝对误差：检查端点与全部驻点。</p><h2>精确代数复核</h2><p id="certificate" class="green"></p><p id="recurrences"></p><h2>同一问题，两种目标</h2><p id="ls"></p><p id="mm" class="blue"></p><small id="versions"></small><p>这是教学程序的本地运行页面，<br>不是 Chebfun 或 SciPy 的软件界面。</p><script>
fetch('results.json').then(r=>r.json()).then(d=>{document.querySelector('#rounds').innerHTML=d.exchange.map(t=>`<tr><td>${t.round+1}</td><td>${t.E.toFixed(5)}</td><td>${t.max_error.toFixed(5)}</td></tr>`).join('');document.querySelector('#certificate').textContent=d.verification.symbolic_identity?'误差恒等式与五个交错峰：通过':'失败';document.querySelector('#recurrences').textContent=`T₀ 至 T₁₂：${d.verification.exact_recurrences} 项独立核对通过`;document.querySelector('#ls').textContent=`平方平均优先：最大误差 ${d.least_squares.max_exact}`;document.querySelector('#mm').textContent=`最坏误差优先：最大误差 ${d.main.E}`;document.querySelector('#versions').innerHTML=Object.entries(d.versions).map(([k,v])=>`${k} ${v}`).join('<br>');document.body.dataset.ready='true'});
</script></body></html>
