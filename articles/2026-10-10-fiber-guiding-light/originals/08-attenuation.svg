<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">玻璃再透明，也不是“永不掉血”的通道</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">90%只是便于计算的假设，不是某根真实光纤的指标</text><rect x="80" y="250" width="1440" height="505" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="130" y="320" font-size="36" fill="#18354a" text-anchor="start" font-weight="bold">假设每走一段，保留原来功率的 90%</text><rect x="160" y="430" width="210" height="150" rx="15" fill="#167aaf" stroke="none" stroke-width="3"/><text x="160" y="650" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">出发 100%</text><line x1="385" y1="500" x2="510" y2="500" stroke="#506979" stroke-width="4"/><polygon points="510,500 493.1470964671936,508.77380433528816 493.1470964671936,491.22619566471184" fill="#506979" stroke="#506979" stroke-width="4"/><rect x="585" y="430" width="189" height="150" rx="15" fill="#008576" stroke="none" stroke-width="3"/><text x="585" y="650" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">一段后 90%</text><line x1="789" y1="500" x2="935" y2="500" stroke="#506979" stroke-width="4"/><polygon points="935,500 918.1470964671936,508.77380433528816 918.1470964671936,491.22619566471184" fill="#506979" stroke="#506979" stroke-width="4"/><rect x="1020" y="430" width="170" height="150" rx="15" fill="#d6a038" stroke="none" stroke-width="3"/><text x="1020" y="650" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">两段后 81%</text><text x="135" y="825" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">90% × 90% = 81%   ·   同比例损失不断累积，衰减通常按 dB/km 记录</text></g></svg>