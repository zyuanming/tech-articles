<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">光从一种材料走到另一种，会改变方向</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">角度从垂直界面的法线量起，图中光路不按数值比例</text><rect x="80" y="250" width="1440" height="520" rx="15" fill="#ddecf1" stroke="none" stroke-width="3"/><rect x="80" y="250" width="1440" height="260" rx="15" fill="#fff" stroke="none" stroke-width="3"/><line x1="80" y1="510" x2="1520" y2="510" stroke="#167aaf" stroke-width="4"/><line x1="700" y1="285" x2="700" y2="740" stroke="#506979" stroke-width="3" stroke-dasharray="9 12"/><line x1="415" y1="735" x2="700" y2="510" stroke="#d95d39" stroke-width="7"/><polygon points="700,510 692.209084213374,527.3292132310069 681.3358087224317,513.5563976091465" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="700" y1="510" x2="1230" y2="355" stroke="#167aaf" stroke-width="7"/><polygon points="1230,355 1216.2874009166885,368.1516016659708 1211.3618691703055,351.3094608557574" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><line x1="700" y1="510" x2="985" y2="735" stroke="#adbdc7" stroke-width="4"/><polygon points="985,735 966.3358087224317,731.4436023908535 977.209084213374,717.6707867689931" fill="#adbdc7" stroke="#adbdc7" stroke-width="4"/><text x="120" y="315" font-size="33" fill="#167aaf" text-anchor="start" font-weight="normal">较低折射率一侧</text><text x="120" y="700" font-size="33" fill="#18354a" text-anchor="start" font-weight="normal">较高折射率一侧</text><text x="710" y="300" font-size="28" fill="#506979" text-anchor="start" font-weight="normal">法线</text><text x="860" y="375" font-size="30" fill="#167aaf" text-anchor="start" font-weight="normal">折射：向界面方向偏折</text><text x="950" y="680" font-size="27" fill="#506979" text-anchor="start" font-weight="normal">同时有部分反射</text></g></svg>