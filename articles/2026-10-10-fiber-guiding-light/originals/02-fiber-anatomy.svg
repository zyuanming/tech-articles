<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">把光纤横切开：里面不是一根空心管</text><circle cx="390" cy="505" r="250" fill="#9daebb" stroke="none" stroke-width="3"/><circle cx="390" cy="505" r="192" fill="#b7dce4" stroke="none" stroke-width="3"/><circle cx="390" cy="505" r="65" fill="#e8af4f" stroke="none" stroke-width="3"/><text x="790" y="300" font-size="33" fill="#18354a" text-anchor="start" font-weight="normal">外层保护：防潮、抗机械损伤</text><text x="790" y="470" font-size="33" fill="#167aaf" text-anchor="start" font-weight="normal">包层：折射率较低的光学材料</text><text x="790" y="640" font-size="33" fill="#d6a038" text-anchor="start" font-weight="normal">纤芯：折射率略高，承担导光</text><line x1="615" y1="375" x2="750" y2="295" stroke="#18354a" stroke-width="5"/><polygon points="750,295 739.9744961957429,311.13968009196043 731.0286833514035,296.043620917138" fill="#18354a" stroke="#18354a" stroke-width="4"/><line x1="565" y1="490" x2="750" y2="465" stroke="#167aaf" stroke-width="5"/><polygon points="750,465 734.4738695850632,475.95167906479975 732.1239307520437,458.56213170045606" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><line x1="420" y1="550" x2="750" y2="630" stroke="#d6a038" stroke-width="5"/><polygon points="750,630 731.5543953942886,634.556278166416 735.6886124466726,617.5026328253323" fill="#d6a038" stroke="#d6a038" stroke-width="4"/><text x="100" y="825" font-size="32" fill="#18354a" text-anchor="start" font-weight="normal">“包层”不是外面的彩色塑料皮；它也是光学结构的一部分。</text></g></svg>