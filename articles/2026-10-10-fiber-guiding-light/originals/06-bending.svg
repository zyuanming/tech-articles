<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">光能拐弯，不代表光纤可以随便打结</text><rect x="75" y="235" width="690" height="555" rx="15" fill="#fff" stroke="none" stroke-width="3"/><rect x="835" y="235" width="690" height="555" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="110" y="305" font-size="39" fill="#008576" text-anchor="start" font-weight="bold">缓缓弯过去</text><path d="M 130,600 C 340,600 340,410 690,410" stroke="#9bcedb" stroke-width="72" fill="none"/><path d="M 130,600 C 340,600 340,410 690,410" stroke="#d6a038" stroke-width="9" fill="none"/><text x="110" y="710" font-size="26" fill="#18354a" text-anchor="start" font-weight="normal">弯曲半径足够大：导光条件较易保持</text><text x="870" y="305" font-size="39" fill="#d95d39" text-anchor="start" font-weight="bold">突然折一个急弯</text><path d="M 930,615 L 1170,615 Q 1210,615 1210,575 L 1210,395" stroke="#9bcedb" stroke-width="72" fill="none"/><path d="M 930,615 L 1170,615 Q 1210,615 1210,575 L 1210,395" stroke="#d6a038" stroke-width="9" fill="none"/><line x1="1180" y1="620" x2="1400" y2="680" stroke="#d95d39" stroke-width="5"/><polygon points="1400,680 1381.4323877531103,684.0303567396882 1386.0494690243675,667.1010587450785" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="885" y="750" font-size="29" fill="#18354a" text-anchor="start" font-weight="normal">弯曲损耗与机械损伤都要考虑</text></g></svg>