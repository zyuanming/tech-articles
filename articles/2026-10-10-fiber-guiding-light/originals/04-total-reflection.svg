<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">“玻璃透明”不等于光从任何角度都能出去</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">从高折射率到低折射率；三图入射角为夸张概念图，不供量角</text><rect x="60" y="235" width="485" height="545" rx="15" fill="#fff" stroke="none" stroke-width="3"/><rect x="70" y="470" width="465" height="210" rx="15" fill="#ddecf1" stroke="none" stroke-width="3"/><line x1="80" y1="470" x2="525" y2="470" stroke="#167aaf" stroke-width="4"/><line x1="295" y1="335" x2="295" y2="655" stroke="#506979" stroke-width="2" stroke-dasharray="7 9"/><line x1="208.00689317775397" y1="650.0894204705354" x2="295" y2="470" stroke="#d95d39" stroke-width="5"/><polygon points="295,470 295.56991450384743,488.99145064123076 279.76922112320824,481.3588456634587" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="295" y1="470" x2="381.99310682224603" y2="650.0894204705354" stroke="#d95d39" stroke-width="5"/><polygon points="381.99310682224603,650.0894204705354 366.7623279454543,638.7305748070768 382.56302132609346,631.0979698293046" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="295" y1="470" x2="460" y2="315" stroke="#167aaf" stroke-width="5"/><polygon points="460,315 453.7240022847416,332.93353988140854 441.70958521711464,320.14399913199924" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="85" y="300" font-size="31" fill="#18354a" text-anchor="start" font-weight="bold">还会漏出去</text><text x="85" y="735" font-size="25" fill="#18354a" text-anchor="start" font-weight="normal">折射光进入外侧</text><rect x="575" y="235" width="485" height="545" rx="15" fill="#fff" stroke="none" stroke-width="3"/><rect x="585" y="470" width="465" height="210" rx="15" fill="#ddecf1" stroke="none" stroke-width="3"/><line x1="595" y1="470" x2="1040" y2="470" stroke="#167aaf" stroke-width="4"/><line x1="810" y1="335" x2="810" y2="655" stroke="#506979" stroke-width="2" stroke-dasharray="7 9"/><line x1="673.6722479953332" y1="616.3377737747642" x2="810" y2="470" stroke="#d95d39" stroke-width="5"/><polygon points="810,470 804.9321027029122,488.3116470309519 792.0927127632978,476.35051681536555" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="810" y1="470" x2="946.3277520046668" y2="616.3377737747642" stroke="#d95d39" stroke-width="5"/><polygon points="946.3277520046668,616.3377737747642 928.4204647679645,609.9872569593986 941.2598547075789,598.0261267438123" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="810" y1="470" x2="1025" y2="470" stroke="#167aaf" stroke-width="5"/><polygon points="1025,470 1008.1470964671936,478.77380433528816 1008.1470964671936,461.22619566471184" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="600" y="300" font-size="31" fill="#18354a" text-anchor="start" font-weight="bold">临界角附近</text><text x="600" y="735" font-size="25" fill="#18354a" text-anchor="start" font-weight="normal">折射光趋近沿界面</text><rect x="1090" y="235" width="485" height="545" rx="15" fill="#fff" stroke="none" stroke-width="3"/><rect x="1100" y="470" width="465" height="210" rx="15" fill="#ddecf1" stroke="none" stroke-width="3"/><line x1="1110" y1="470" x2="1555" y2="470" stroke="#167aaf" stroke-width="4"/><line x1="1325" y1="335" x2="1325" y2="655" stroke="#506979" stroke-width="2" stroke-dasharray="7 9"/><line x1="1151.5153548811966" y1="569.5142095783453" x2="1325" y2="470" stroke="#d95d39" stroke-width="5"/><polygon points="1325,470 1314.7469910740547,485.9961185280831 1306.015809039842,470.77491521359025" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="1325" y1="470" x2="1498.4846451188034" y2="569.5142095783453" stroke="#d95d39" stroke-width="5"/><polygon points="1498.4846451188034,569.5142095783453 1479.5004541586454,568.7392943647551 1488.231636192858,553.5180910502622" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="1115" y="300" font-size="31" fill="#18354a" text-anchor="start" font-weight="bold">超过临界角</text><text x="1115" y="735" font-size="25" fill="#18354a" text-anchor="start" font-weight="normal">理想界面发生全内反射</text></g></svg>