<text x="730.0" y="240.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#5276bf" text-anchor="middle">parent 父提交</text>
<line x1="358" y1="230" x2="564" y2="230" stroke="#5276bf" stroke-width="4"/>
<polygon points="564,230 548.6923992600045,237.3944140798909 548.6923992600045,222.6055859201091" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
