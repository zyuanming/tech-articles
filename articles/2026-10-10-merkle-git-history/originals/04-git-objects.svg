<line x1="360" y1="455" x2="513" y2="604" stroke="#087f8c" stroke-width="4"/>
<polygon points="513,604 496.8745536047823,598.6176233358337 507.19242225671087,588.0227649214373" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="92" y="550" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#183747" text-anchor="start">记录名字、模式、对象ID</text>
<text x="555" y="520" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#e57735" text-anchor="start">内容，不含文件名</text>
<text x="42" y="762" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">合并提交可以有多个父提交；共享对象使整体成为 DAG。</text></svg>