<text x="705.0" y="438.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#e57735" text-anchor="middle">blob：hello\n</text>
<rect x="520" y="565" width="370" height="85" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="705.0" y="618.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#087f8c" text-anchor="middle">tree：src 目录</text>
<line x1="360" y1="423" x2="513" y2="423" stroke="#087f8c" stroke-width="4"/>
