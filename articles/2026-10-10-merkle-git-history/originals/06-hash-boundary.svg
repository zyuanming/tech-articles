<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 960 630" role="img"><title>同样的字节，会算出同样的 ID</title><rect width="960" height="630" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">同样的字节，会算出同样的 ID</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">用 hello 加换行构造一个传统 SHA-1 blob</text>
<rect x="45" y="235" width="305" height="100" rx="8" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="197.5" y="295.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#5276bf" text-anchor="middle">blob 6 + NUL</text>
<rect x="395" y="235" width="245" height="100" rx="8" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="517.5" y="295.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#087f8c" text-anchor="middle">hello + 换行</text>
<text x="367" y="299" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="39" font-weight="400" fill="#183747" text-anchor="middle">+</text>
<line x1="650" y1="285" x2="703" y2="285" stroke="#e57735" stroke-width="4"/>
<polygon points="703,285 687.6923992600045,292.3944140798909 687.6923992600045,277.6055859201091" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<rect x="720" y="235" width="195" height="100" rx="8" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="817.5" y="295.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#e57735" text-anchor="middle">SHA-1</text>
<text x="480" y="429" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#183747" text-anchor="middle">类型、字节长度、NUL、内容，一起参与散列。</text>
<text x="480" y="505" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#57727c" text-anchor="middle">ce013625… 是内容身份，不是作者的签名。</text></svg>