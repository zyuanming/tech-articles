<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ee"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#21333a"><text x="70" y="90" font-size="48" font-weight="700">「很冷」仍然可以向「更冷」传热</text><text x="72" y="144" font-size="27" fill="#60747b">两侧各自顺着温差传热 · 温度均为教学示意，不是某产品运行参数</text><rect x="95" y="220" width="665" height="465" rx="18" fill="#e3eef3"/><rect x="840" y="220" width="665" height="465" rx="18" fill="#f3e0d6"/><text x="427" y="285" font-size="38" fill="#2679a0" font-weight="700" text-anchor="middle">室外换热器</text><text x="1172" y="285" font-size="38" fill="#cf633a" font-weight="700" text-anchor="middle">室内换热器</text><text x="165" y="393" font-size="35" fill="#2679a0" font-weight="400" text-anchor="start">空气 −5°C</text><text x="445" y="580" font-size="35" fill="#2679a0" font-weight="400" text-anchor="start">冷媒 −15°C</text><path d="M280,432 L527,521" stroke="#2679a0" stroke-width="8" fill="none" marker-end="url(#arr)"/><text x="340" y="437" font-size="30" fill="#2679a0" font-weight="400" text-anchor="start">热</text><text x="910" y="393" font-size="35" fill="#cf633a" font-weight="400" text-anchor="start">冷媒 40°C</text><text x="1210" y="580" font-size="35" fill="#cf633a" font-weight="400" text-anchor="start">空气 20°C</text><path d="M1030,432 L1310,521" stroke="#cf633a" stroke-width="8" fill="none" marker-end="url(#arr)"/><text x="1110" y="437" font-size="30" fill="#cf633a" font-weight="400" text-anchor="start">热</text><text x="800" y="772" font-size="32" fill="#21333a" font-weight="400" text-anchor="middle">压缩机与节流过程，让同一种冷媒在两侧拥有不同的温度和压力。</text><text x="800" y="835" font-size="32" fill="#21333a" font-weight="700" text-anchor="middle">关键不是外面够不够「暖」，而是吸热端能否比外界更冷。</text></g></svg>