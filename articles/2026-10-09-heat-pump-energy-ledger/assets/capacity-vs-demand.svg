<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ee"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#21333a"><text x="70" y="90" font-size="48" font-weight="700">省电和够暖，是两个不同问题</text><text x="72" y="144" font-size="27" fill="#60747b">概念曲线，只说明一种可能的关系；没有产品测量数据与数值刻度</text><path d="M200,720 L1440,720" stroke="#21333a" stroke-width="4" fill="none" marker-end="url(#arr)"/><path d="M200,720 L200,240" stroke="#21333a" stroke-width="4" fill="none" marker-end="url(#arr)"/><text x="170" y="220" font-size="28" fill="#21333a" font-weight="400" text-anchor="middle">热功率</text><text x="270" y="780" font-size="30" fill="#21333a" font-weight="400" text-anchor="start">较温和</text><text x="1385" y="780" font-size="30" fill="#21333a" font-weight="400" text-anchor="middle">更寒冷</text><text x="825" y="845" font-size="30" fill="#21333a" font-weight="400" text-anchor="middle">室外温度下降 →</text><path d="M250,660 C600,605 925,440 1390,285" stroke="#cf633a" stroke-width="10" fill="none"/><path d="M250,345 C650,350 950,430 1390,580" stroke="#2679a0" stroke-width="10" fill="none"/><text x="320" y="295" font-size="31" fill="#2679a0" font-weight="400" text-anchor="start">某台热泵能提供的最大热量</text><text x="330" y="520" font-size="31" fill="#cf633a" font-weight="400" text-anchor="start">房屋维持温度所需的热量</text><path d="M1220,343.594 L1220,523.403" stroke="#327569" stroke-width="5" fill="none"/><path d="M1195,343.594 L1245,343.594" stroke="#327569" stroke-width="5" fill="none"/><path d="M1195,523.403 L1245,523.403" stroke="#327569" stroke-width="5" fill="none"/><text x="1140" y="652" font-size="27" fill="#327569" font-weight="400" text-anchor="middle">差额要靠补热或降低热损失解决</text></g></svg>