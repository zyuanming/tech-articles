<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ee"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#21333a"><text x="70" y="90" font-size="48" font-weight="700">一度电没有凭空变成三度热</text><text x="72" y="144" font-size="27" fill="#60747b">供暖能量账本 · COP = 3 的教学假设，忽略储能变化</text><rect x="85" y="250" width="420" height="190" rx="18" fill="#ddeaf0"/><text x="295" y="315" font-size="34" fill="#2679a0" font-weight="400" text-anchor="middle">室外提供</text><text x="295" y="391" font-size="54" fill="#2679a0" font-weight="700" text-anchor="middle">2 kWh 热</text><rect x="85" y="540" width="420" height="190" rx="18" fill="#f0e6bf"/><text x="295" y="605" font-size="34" fill="#c39c2d" font-weight="400" text-anchor="middle">电网提供</text><text x="295" y="680" font-size="54" fill="#c39c2d" font-weight="700" text-anchor="middle">1 kWh 电</text><path d="M520,350 L770,350" stroke="#2679a0" stroke-width="18" fill="none" marker-end="url(#arr)"/><path d="M520,630 L770,630" stroke="#c39c2d" stroke-width="12" fill="none" marker-end="url(#arr)"/><rect x="810" y="250" width="690" height="480" rx="18" fill="#f2ded2"/><text x="1155" y="330" font-size="38" fill="#cf633a" font-weight="400" text-anchor="middle">送到室内的热</text><text x="1155" y="428" font-size="86" fill="#cf633a" font-weight="700" text-anchor="middle">3 kWh</text><rect x="900" y="500" width="340" height="55" rx="0" fill="#2679a0"/><rect x="1240" y="500" width="170" height="55" rx="0" fill="#c39c2d"/><text x="1060" y="605" font-size="29" fill="#2679a0" font-weight="400" text-anchor="middle">来自环境</text><text x="1320" y="650" font-size="29" fill="#c39c2d" font-weight="400" text-anchor="middle">电能做功</text><text x="85" y="825" font-size="30" fill="#21333a" font-weight="400" text-anchor="start">COP 看的是「送进室内的热 ÷ 消耗的电」，不是把电变成热的百分比。</text></g></svg>