<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><rect width="100%" height="100%" fill="#f6f4ee"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#21333a"><text x="70" y="90" font-size="48" font-weight="700">冷媒走一圈，热被搬进屋</text><text x="72" y="144" font-size="27" fill="#60747b">典型蒸气压缩循环 · 供暖模式 · 箭头表示冷媒流向</text><rect x="80" y="210" width="430" height="560" rx="18" fill="#e3eef3"/><rect x="1090" y="210" width="430" height="560" rx="18" fill="#f3e0d6"/><text x="295" y="270" font-size="38" fill="#2679a0" font-weight="700" text-anchor="middle">室外：吸热</text><text x="1305" y="270" font-size="38" fill="#cf633a" font-weight="700" text-anchor="middle">室内：放热</text><rect x="590" y="220" width="420" height="125" rx="18" fill="#e1e5e4"/><text x="800" y="273" font-size="34" fill="#21333a" font-weight="700" text-anchor="middle">② 压缩机</text><text x="800" y="315" font-size="26" fill="#21333a" font-weight="400" text-anchor="middle">输入电功 → 升压、升温</text><rect x="590" y="650" width="420" height="115" rx="18" fill="#e1e5e4"/><text x="800" y="697" font-size="34" fill="#21333a" font-weight="700" text-anchor="middle">④ 膨胀阀</text><text x="800" y="740" font-size="26" fill="#21333a" font-weight="400" text-anchor="middle">节流降压 → 气液混合物</text><text x="295" y="430" font-size="38" fill="#2679a0" font-weight="700" text-anchor="middle">① 蒸发器</text><text x="295" y="487" font-size="29" fill="#2679a0" font-weight="400" text-anchor="middle">低压冷媒吸热</text><text x="295" y="535" font-size="29" fill="#2679a0" font-weight="400" text-anchor="middle">液体继续汽化</text><text x="1305" y="430" font-size="38" fill="#cf633a" font-weight="700" text-anchor="middle">③ 冷凝器</text><text x="1305" y="487" font-size="29" fill="#cf633a" font-weight="400" text-anchor="middle">高压冷媒放热</text><text x="1305" y="535" font-size="29" fill="#cf633a" font-weight="400" text-anchor="middle">气体凝结为液体</text><path d="M315,350 L570,285" stroke="#2679a0" stroke-width="6" fill="none" marker-end="url(#arr)"/><path d="M1030,285 L1260,350" stroke="#cf633a" stroke-width="6" fill="none" marker-end="url(#arr)"/><path d="M1260,610 L1030,705" stroke="#cf633a" stroke-width="6" fill="none" marker-end="url(#arr)"/><path d="M570,705 L315,610" stroke="#2679a0" stroke-width="6" fill="none" marker-end="url(#arr)"/><text x="460" y="224" font-size="24" fill="#2679a0" font-weight="400" text-anchor="start">低压气体</text><text x="1050" y="224" font-size="24" fill="#cf633a" font-weight="400" text-anchor="start">高压热气体</text><text x="1050" y="800" font-size="24" fill="#cf633a" font-weight="400" text-anchor="start">高压液体</text><text x="330" y="800" font-size="24" fill="#2679a0" font-weight="400" text-anchor="start">低压气液混合物</text><text x="80" y="857" font-size="27" fill="#21333a" font-weight="400" text-anchor="start">冷媒在封闭管路里循环；室外空气并没有被这条管路直接吹进屋里。</text></g></svg>