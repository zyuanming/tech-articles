<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">一片会反射蓝光的结构，遇到红光会怎样？</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">反射式结构色通常是在已有光中做选择，并没有凭空生产别的颜色。</text><rect x="70" y="190" width="580" height="535" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="360" y="260" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">照白光</text><rect x="320" y="400" width="175" height="22" rx="0" fill="#99b9c7" stroke="none" stroke-width="3"/><rect x="320" y="442" width="175" height="22" rx="0" fill="#99b9c7" stroke="none" stroke-width="3"/><rect x="320" y="484" width="175" height="22" rx="0" fill="#99b9c7" stroke="none" stroke-width="3"/><rect x="320" y="526" width="175" height="22" rx="0" fill="#99b9c7" stroke="none" stroke-width="3"/><line x1="100" y1="325" x2="325" y2="400" stroke="#c4565a" stroke-width="5" marker-end="url(#arr)"/><line x1="100" y1="360" x2="325" y2="420" stroke="#579677" stroke-width="5" marker-end="url(#arr)"/><line x1="100" y1="395" x2="325" y2="440" stroke="#277fc5" stroke-width="5" marker-end="url(#arr)"/><line x1="495" y1="425" x2="605" y2="310" stroke="#277fc5" stroke-width="8" marker-end="url(#arr)"/><text x="360" y="665" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">可以有强蓝色反射</text><rect x="770" y="190" width="580" height="535" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="1060" y="260" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">只照红光</text><rect x="1020" y="400" width="175" height="22" rx="0" fill="#99b9c7" stroke="none" stroke-width="3"/><rect x="1020" y="442" width="175" height="22" rx="0" fill="#99b9c7" stroke="none" stroke-width="3"/><rect x="1020" y="484" width="175" height="22" rx="0" fill="#99b9c7" stroke="none" stroke-width="3"/><rect x="1020" y="526" width="175" height="22" rx="0" fill="#99b9c7" stroke="none" stroke-width="3"/><line x1="800" y1="340" x2="1025" y2="400" stroke="#c4565a" stroke-width="7" marker-end="url(#arr)"/><line x1="1195" y1="425" x2="1305" y2="340" stroke="#b6b6b6" stroke-width="2" marker-end="url(#arr)"/><text x="1060" y="665" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">通常不会仍然鲜亮地显蓝</text><text x="100" y="800" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">“结构长得对”，还要“光源里有对应波长”。</text><text x="100" y="844" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">本图是反射机制推理，不是某一只蝴蝶的定量实验或发光实验。</text></svg>