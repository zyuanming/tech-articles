<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">不用碰蝴蝶，也能观察几何怎样改变颜色</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">用肥皂膜做一个相关现象观察；它不是蝴蝶鳞片的完整复制。</text><rect x="110" y="270" width="300" height="400" rx="12" fill="none" stroke="#516d7d" stroke-width="3"/><rect x="119" y="280" width="282" height="92" rx="0" fill="#277fc5" stroke="none" stroke-width="3"/><rect x="119" y="375" width="282" height="92" rx="0" fill="#45bac6" stroke="none" stroke-width="3"/><rect x="119" y="470" width="282" height="92" rx="0" fill="#ef9754" stroke="none" stroke-width="3"/><rect x="119" y="565" width="282" height="92" rx="0" fill="#8a76bd" stroke="none" stroke-width="3"/><text x="260" y="740" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">刚拉出的膜</text><rect x="560" y="270" width="300" height="400" rx="12" fill="none" stroke="#516d7d" stroke-width="3"/><rect x="569" y="280" width="282" height="92" rx="0" fill="#8a76bd" stroke="none" stroke-width="3"/><rect x="569" y="375" width="282" height="92" rx="0" fill="#45bac6" stroke="none" stroke-width="3"/><rect x="569" y="470" width="282" height="92" rx="0" fill="#ef9754" stroke="none" stroke-width="3"/><rect x="569" y="565" width="282" height="92" rx="0" fill="#8a76bd" stroke="none" stroke-width="3"/><text x="710" y="740" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">过一会儿</text><rect x="1010" y="270" width="300" height="400" rx="12" fill="none" stroke="#516d7d" stroke-width="3"/><rect x="1019" y="280" width="282" height="92" rx="0" fill="#ef9754" stroke="none" stroke-width="3"/><rect x="1019" y="375" width="282" height="92" rx="0" fill="#45bac6" stroke="none" stroke-width="3"/><rect x="1019" y="470" width="282" height="92" rx="0" fill="#ef9754" stroke="none" stroke-width="3"/><rect x="1019" y="565" width="282" height="92" rx="0" fill="#8a76bd" stroke="none" stroke-width="3"/><text x="1160" y="740" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">换个角度</text><text x="100" y="815" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">在漫射白光下观察，记录时间与角度。别吹向眼睛，不用激光或直视太阳。</text><text x="100" y="859" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">膜厚随排水、蒸发而变；改变观看角度，光在膜中的路径关系也会变。</text></svg>