<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">整齐与“不完全整齐”，可能各有用处</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">下面是方向分布的概念对照；真实鳞片的反射还包含多种波动效应。</text><text x="360" y="240" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">过于整齐：光集中在少数方向</text><line x1="170" y1="420" x2="170" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="140" y1="440" x2="200" y2="440" stroke="#45bac6" stroke-width="10"/><line x1="140" y1="483" x2="200" y2="483" stroke="#45bac6" stroke-width="10"/><line x1="140" y1="526" x2="200" y2="526" stroke="#45bac6" stroke-width="10"/><line x1="140" y1="569" x2="200" y2="569" stroke="#45bac6" stroke-width="10"/><line x1="260" y1="420" x2="260" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="230" y1="440" x2="290" y2="440" stroke="#45bac6" stroke-width="10"/><line x1="230" y1="483" x2="290" y2="483" stroke="#45bac6" stroke-width="10"/><line x1="230" y1="526" x2="290" y2="526" stroke="#45bac6" stroke-width="10"/><line x1="230" y1="569" x2="290" y2="569" stroke="#45bac6" stroke-width="10"/><line x1="350" y1="420" x2="350" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="320" y1="440" x2="380" y2="440" stroke="#45bac6" stroke-width="10"/><line x1="320" y1="483" x2="380" y2="483" stroke="#45bac6" stroke-width="10"/><line x1="320" y1="526" x2="380" y2="526" stroke="#45bac6" stroke-width="10"/><line x1="320" y1="569" x2="380" y2="569" stroke="#45bac6" stroke-width="10"/><line x1="440" y1="420" x2="440" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="410" y1="440" x2="470" y2="440" stroke="#45bac6" stroke-width="10"/><line x1="410" y1="483" x2="470" y2="483" stroke="#45bac6" stroke-width="10"/><line x1="410" y1="526" x2="470" y2="526" stroke="#45bac6" stroke-width="10"/><line x1="410" y1="569" x2="470" y2="569" stroke="#45bac6" stroke-width="10"/><line x1="530" y1="420" x2="530" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="500" y1="440" x2="560" y2="440" stroke="#45bac6" stroke-width="10"/><line x1="500" y1="483" x2="560" y2="483" stroke="#45bac6" stroke-width="10"/><line x1="500" y1="526" x2="560" y2="526" stroke="#45bac6" stroke-width="10"/><line x1="500" y1="569" x2="560" y2="569" stroke="#45bac6" stroke-width="10"/><line x1="170" y1="420" x2="170" y2="300" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="260" y1="420" x2="260" y2="280" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="350" y1="420" x2="350" y2="300" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="440" y1="420" x2="440" y2="280" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="530" y1="420" x2="530" y2="300" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><text x="1040" y="240" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">一定差异：反射可以更分散</text><line x1="850" y1="420" x2="850" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="820" y1="440" x2="880" y2="440" stroke="#45bac6" stroke-width="10"/><line x1="820" y1="483" x2="880" y2="483" stroke="#45bac6" stroke-width="10"/><line x1="820" y1="526" x2="880" y2="526" stroke="#45bac6" stroke-width="10"/><line x1="820" y1="569" x2="880" y2="569" stroke="#45bac6" stroke-width="10"/><line x1="940" y1="442" x2="940" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="910" y1="462" x2="970" y2="462" stroke="#45bac6" stroke-width="10"/><line x1="910" y1="505" x2="970" y2="505" stroke="#45bac6" stroke-width="10"/><line x1="910" y1="548" x2="970" y2="548" stroke="#45bac6" stroke-width="10"/><line x1="910" y1="591" x2="970" y2="591" stroke="#45bac6" stroke-width="10"/><line x1="1030" y1="464" x2="1030" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="1000" y1="484" x2="1060" y2="484" stroke="#45bac6" stroke-width="10"/><line x1="1000" y1="527" x2="1060" y2="527" stroke="#45bac6" stroke-width="10"/><line x1="1000" y1="570" x2="1060" y2="570" stroke="#45bac6" stroke-width="10"/><line x1="1000" y1="613" x2="1060" y2="613" stroke="#45bac6" stroke-width="10"/><line x1="1120" y1="420" x2="1120" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="1090" y1="440" x2="1150" y2="440" stroke="#45bac6" stroke-width="10"/><line x1="1090" y1="483" x2="1150" y2="483" stroke="#45bac6" stroke-width="10"/><line x1="1090" y1="526" x2="1150" y2="526" stroke="#45bac6" stroke-width="10"/><line x1="1090" y1="569" x2="1150" y2="569" stroke="#45bac6" stroke-width="10"/><line x1="1210" y1="442" x2="1210" y2="650" stroke="#516d7d" stroke-width="6"/><line x1="1180" y1="462" x2="1240" y2="462" stroke="#45bac6" stroke-width="10"/><line x1="1180" y1="505" x2="1240" y2="505" stroke="#45bac6" stroke-width="10"/><line x1="1180" y1="548" x2="1240" y2="548" stroke="#45bac6" stroke-width="10"/><line x1="1180" y1="591" x2="1240" y2="591" stroke="#45bac6" stroke-width="10"/><line x1="850" y1="420" x2="770" y2="300" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="940" y1="420" x2="900" y2="280" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="1030" y1="420" x2="1030" y2="300" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="1120" y1="420" x2="1160" y2="280" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="1210" y1="420" x2="1290" y2="300" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><text x="100" y="785" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">规律的层次帮助选择波长；不同脊、鳞片间的差异影响光往哪里散开。</text><text x="100" y="829" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">自然结构不是把一个完美单元，毫无偏差地复制无数遍。</text></svg>