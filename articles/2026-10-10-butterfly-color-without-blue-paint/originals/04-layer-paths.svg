<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">同一束光，从不同层反射后会重新相遇</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">多走的光程与界面反射带来的相位变化，共同决定能否加强。</text><rect x="480" y="480" width="610" height="22" rx="0" fill="#a8c5ce" stroke="none" stroke-width="3"/><rect x="480" y="565" width="610" height="22" rx="0" fill="#a8c5ce" stroke="none" stroke-width="3"/><rect x="480" y="650" width="610" height="22" rx="0" fill="#a8c5ce" stroke="none" stroke-width="3"/><line x1="380" y1="270" x2="770" y2="660" stroke="#ef9754" stroke-width="4" marker-end="url(#arr)"/><line x1="590" y1="480" x2="880" y2="190" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="675" y1="565" x2="965" y2="275" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><line x1="760" y1="650" x2="1050" y2="360" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><text x="1080" y="170" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">同一观察方向</text><text x="1080" y="220" text-anchor="start" font-family="Noto Sans CJK SC" font-size="20" font-weight="normal" fill="#516d7d">这里只画三条反射路径</text><text x="480" y="755" text-anchor="start" font-family="Noto Sans CJK SC" font-size="23" font-weight="normal" fill="#516d7d">为突出路径差，省略了透射、折射角和后续多次反射。</text><text x="100" y="805" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">某些波长、方向的反射更容易同拍加强，另一些不那么容易。</text><text x="100" y="849" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">层距不是唯一参数：材料的折射率、形状、角度也参与决定结果。</text></svg>