<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">白光里有许多颜色，表面决定哪些更容易回来</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">这里只比较两种主要机制；同一片翅膀上，色素与结构可以共同起作用。</text><rect x="70" y="185" width="580" height="565" rx="20" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="350" y="245" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">色素：不同波长被吸收得不同</text><line x1="110" y1="345" x2="325" y2="345" stroke="#c4565a" stroke-width="6" marker-end="url(#arr)"/><line x1="110" y1="405" x2="325" y2="405" stroke="#579677" stroke-width="6" marker-end="url(#arr)"/><line x1="110" y1="465" x2="325" y2="465" stroke="#277fc5" stroke-width="6" marker-end="url(#arr)"/><rect x="340" y="310" width="140" height="250" rx="20" fill="#7b7472" stroke="none" stroke-width="3"/><circle cx="380" cy="405" r="14" fill="#d0b5a5" stroke="none" stroke-width="3"/><circle cx="413" cy="465" r="14" fill="#d0b5a5" stroke="none" stroke-width="3"/><circle cx="446" cy="405" r="14" fill="#d0b5a5" stroke="none" stroke-width="3"/><line x1="480" y1="520" x2="590" y2="335" stroke="#277fc5" stroke-width="7" marker-end="url(#arr)"/><text x="115" y="650" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">蓝色较多地进入眼睛</text><text x="115" y="694" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">“显蓝”不等于自己制造蓝光</text><rect x="755" y="185" width="580" height="565" rx="20" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="1035" y="245" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">结构：不同反射彼此叠加</text><line x1="795" y1="345" x2="1010" y2="345" stroke="#c4565a" stroke-width="6" marker-end="url(#arr)"/><line x1="795" y1="405" x2="1010" y2="405" stroke="#579677" stroke-width="6" marker-end="url(#arr)"/><line x1="795" y1="465" x2="1010" y2="465" stroke="#277fc5" stroke-width="6" marker-end="url(#arr)"/><rect x="1025" y="315" width="140" height="25" rx="0" fill="#c0d0db" stroke="none" stroke-width="3"/><rect x="1025" y="375" width="140" height="25" rx="0" fill="#c0d0db" stroke="none" stroke-width="3"/><rect x="1025" y="435" width="140" height="25" rx="0" fill="#c0d0db" stroke="none" stroke-width="3"/><rect x="1025" y="495" width="140" height="25" rx="0" fill="#c0d0db" stroke="none" stroke-width="3"/><line x1="1165" y1="520" x2="1275" y2="335" stroke="#277fc5" stroke-width="7" marker-end="url(#arr)"/><text x="800" y="650" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">蓝色较多地进入眼睛</text><text x="800" y="694" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">“显蓝”不等于自己制造蓝光</text><text x="720" y="830" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">观察到的颜色，需要把光源、物体和观察方向放在一起考虑。</text></svg>