="1119" y2="447" stroke="#45bac6" stroke-width="16"/><line x1="1052" y1="494" x2="1128" y2="494" stroke="#45bac6" stroke-width="16"/><line x1="1043" y1="541" x2="1137" y2="541" stroke="#45bac6" stroke-width="16"/><line x1="1034" y1="588" x2="1146" y2="588" stroke="#45bac6" stroke-width="16"/><line x1="1235" y1="370" x2="1235" y2="630" stroke="#516d7d" stroke-width="10"/><line x1="1215" y1="400" x2="1255" y2="400" stroke="#45bac6" stroke-width="16"/><line x1="1206" y1="447" x2="1264" y2="447" stroke="#45bac6" stroke-width="16"/><line x1="1197" y1="494" x2="1273" y2="494" stroke="#45bac6" stroke-width="16"/><line x1="1188" y1="541" x2="1282" y2="541" stroke="#45bac6" stroke-width="16"/><line x1="1179" y1="588" x2="1291" y2="588" stroke="#45bac6" stroke-width="16"/><line x1="460" y1="470" x2="500" y2="470" stroke="#173449" stroke-width="5" marker-end="url(#arr)"/><line x1="925" y1="470" x2="965" y2="470" stroke="#173449" stroke-width="5" marker-end="url(#arr)"/><text x="80" y="790" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">人眼看见整片蓝色；显微镜把同一片结构拆成不同尺度。</text><text x="80" y="834" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">“树枝”是形状类比，不是长在翅膀里的小植物。</text></svg>