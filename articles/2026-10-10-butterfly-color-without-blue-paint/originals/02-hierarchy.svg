<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">从翅膀一路放大：蓝色藏在层层结构里</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">示意对应一种典型Morpho鳞片构造，不代表所有蝴蝶都长这样。</text><rect x="60" y="210" width="390" height="510" rx="20" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="255" y="275" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">鳞片：像小瓦片</text><rect x="525" y="210" width="390" height="510" rx="20" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="720" y="275" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">脊：像一排排屋梁</text><rect x="990" y="210" width="390" height="510" rx="20" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="1185" y="275" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">截面：像层叠树枝</text><path d="M95 370 Q127 350 155 370 L149 445 Q125 475 101 445 Z" fill="#277fc5" stroke="#45bac6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M175 370 Q207 350 235 370 L229 445 Q205 475 181 445 Z" fill="#277fc5" stroke="#45bac6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M255 370 Q287 350 315 370 L309 445 Q285 475 261 445 Z" fill="#277fc5" stroke="#45bac6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M335 370 Q367 350 395 370 L389 445 Q365 475 341 445 Z" fill="#277fc5" stroke="#45bac6" stroke-