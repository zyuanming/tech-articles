<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>影响每代最多传一格</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">影响每代最多传一格</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">第t代：只可能影响切比雪夫距离≤t的格子</text>
<rect x="190" y="170" width="455" height="455" rx="0" fill="#d2dbd8" stroke="#ffffff" stroke-width="3"/>
<rect x="255" y="235" width="325" height="325" rx="0" fill="#5276bf" stroke="#ffffff" stroke-width="3"/>
<rect x="320" y="300" width="195" height="195" rx="0" fill="#087f8c" stroke="#ffffff" stroke-width="3"/>
<rect x="385" y="365" width="65" height="65" rx="0" fill="#e57735" stroke="#ffffff" stroke-width="3"/>
<text x="730" y="260" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">t = 3</text>
<text x="730" y="330" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">t = 2</text>
<text x="730" y="400" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">t = 1</text>
<text x="730" y="470" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">起点</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">局部规则可以产生复杂图案，但不能瞬间影响远处。</text></svg>