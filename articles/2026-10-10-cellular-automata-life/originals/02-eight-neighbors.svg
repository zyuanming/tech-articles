<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>一个格子的世界，有八位邻居</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">一个格子的世界，有八位邻居</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">斜角也算；中心格本身不计入邻居</text>
<rect x="240" y="185" width="150" height="150" rx="0" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<rect x="390" y="185" width="150" height="150" rx="0" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<rect x="540" y="185" width="150" height="150" rx="0" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<rect x="240" y="335" width="150" height="150" rx="0" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<rect x="390" y="335" width="150" height="150" rx="0" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<rect x="540" y="335" width="150" height="150" rx="0" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<rect x="240" y="485" width="150" height="150" rx="0" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<rect x="390" y="485" width="150" height="150" rx="0" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<rect x="540" y="485" width="150" height="150" rx="0" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<rect x="390" y="335" width="150" height="150" rx="0" fill="#e57735" stroke="#d2dbd8" stroke-width="2"/>
<text x="465" y="420" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#ffffff" text-anchor="middle">自己</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">“活”与“死”只是两个状态的名字。</text></svg>