<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 960 750" role="img"><title>控制点不是必须经过的路标</title><rect width="960" height="750" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">控制点不是必须经过的路标</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">t=½ 时，四个权重是 ⅛、⅜、⅜、⅛</text>
<rect x="145" y="430" width="125" height="90" rx="0" fill="#5276bf" stroke="#5276bf" stroke-width="2"/>
<text x="207" y="575" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="middle">P0</text>
<text x="207" y="400" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#5276bf" text-anchor="middle">1/8</text>
<rect x="350" y="250" width="125" height="270" rx="0" fill="#087f8c" stroke="#087f8c" stroke-width="2"/>
<text x="412" y="575" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="middle">P1</text>
<text x="412" y="220" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#087f8c" text-anchor="middle">3/8</text>
<rect x="555" y="250" width="125" height="270" rx="0" fill="#e57735" stroke="#e57735" stroke-width="2"/>
<text x="617" y="575" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="middle">P2</text>
<text x="617" y="220" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#e57735" text-anchor="middle">3/8</text>
<rect x="760" y="430" width="125" height="90" rx="0" fill="#c54c53" stroke="#c54c53" stroke-width="2"/>
<text x="822" y="575" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="middle">P3</text>
<text x="822" y="400" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#c54c53" text-anchor="middle">1/8</text>
<text x="90" y="670" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#183747" text-anchor="start">权重非负、总和为 1 → 曲线留在控制点凸包内</text></svg>