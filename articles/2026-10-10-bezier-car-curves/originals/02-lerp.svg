<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1233" viewBox="0 0 960 740" role="img"><title>从直线开始：走到两点之间</title><rect width="960" height="740" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">从直线开始：走到两点之间</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">L(A,B,t) = (1−t)A + tB</text>
<line x1="140" y1="330" x2="820" y2="330" stroke="#183747" stroke-width="6"/>
<circle cx="140" cy="330" r="12" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="140" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#183747" text-anchor="middle">0</text>
<circle cx="310.0" cy="330" r="12" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="310.0" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#183747" text-anchor="middle">0.25</text>
<circle cx="480.0" cy="330" r="12" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="480.0" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#183747" text-anchor="middle">0.5</text>
<circle cx="650.0" cy="330" r="12" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="650.0" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#183747" text-anchor="middle">0.75</text>
<circle cx="820" cy="330" r="12" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="820" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#183747" text-anchor="middle">1</text>
<text x="105" y="390" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#183747" text-anchor="start">A=(0,0)</text>
<text x="700" y="390" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#183747" text-anchor="start">B=(4,0)</text>
<text x="135" y="530" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#e57735" text-anchor="start">t=¼：¼×4 = 1</text>
<text x="135" y="610" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#e57735" text-anchor="start">点的位置是 (1,0)</text></svg>