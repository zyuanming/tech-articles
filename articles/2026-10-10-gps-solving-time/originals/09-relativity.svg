<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">原子钟很准，也不能让每个地方的时间走得一样快</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">GPS典型轨道相对地面参考钟的近似日累计差；条长不作为精确比例尺</text><rect x="85" y="240" width="1430" height="560" rx="15" fill="#fff" stroke="none" stroke-width="3"/><line x1="810" y1="285" x2="810" y2="720" stroke="#506979" stroke-width="3" stroke-dasharray="8 10"/><rect x="810" y="315" width="505" height="95" rx="15" fill="#bce3dc" stroke="none" stroke-width="3"/><text x="110" y="375" font-size="32" fill="#18354a" text-anchor="start" font-weight="normal">高处的引力条件影响</text><text x="1050" y="378" font-size="38" fill="#008576" text-anchor="middle" font-weight="normal">约 +45 μs/天</text><rect x="660" y="465" width="150" height="95" rx="15" fill="#efc8b9" stroke="none" stroke-width="3"/><text x="110" y="525" font-size="32" fill="#18354a" text-anchor="start" font-weight="normal">运动速度的影响</text><text x="1050" y="528" font-size="38" fill="#d95d39" text-anchor="middle" font-weight="normal">约 −7 μs/天</text><line x1="810" y1="670" x2="1240" y2="670" stroke="#167aaf" stroke-width="11"/><polygon points="1240,670 1223.1470964671937,678.7738043352882 1223.1470964671937,661.2261956647118" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="110" y="685" font-size="35" fill="#18354a" text-anchor="start" font-weight="normal">两者合起来</text><text x="1050" y="755" font-size="39" fill="#167aaf" text-anchor="middle" font-weight="normal">约 +38 μs/天</text><text x="100" y="870" font-size="28" fill="#18354a" text-anchor="start" font-weight="normal">相对论改正是系统设计与计算的一部分；不是今天仍在累积的未修正误差。</text></g></svg>