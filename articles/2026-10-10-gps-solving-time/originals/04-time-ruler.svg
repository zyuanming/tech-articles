<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">这把尺子的刻度，小到十亿分之一秒</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">先忽略大气与钟差；用真空光速近似做数量级计算</text><rect x="90" y="235" width="1420" height="255" rx="15" fill="#e1eef1" stroke="none" stroke-width="3"/><text x="135" y="320" font-size="38" fill="#18354a" text-anchor="start" font-weight="normal">一次传播：卫星 → 接收机</text><text x="135" y="405" font-size="40" fill="#167aaf" text-anchor="start" font-weight="normal">距离 ≈ 光速 × 传播时间</text><text x="135" y="465" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">例：约300,000 km/s × 0.070 s ≈ 21,000 km</text><rect x="100" y="550" width="390" height="230" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="295" y="625" font-size="38" fill="#167aaf" text-anchor="middle" font-weight="normal">1 微秒</text><text x="295" y="710" font-size="39" fill="#18354a" text-anchor="middle" font-weight="normal">约 300 米</text><rect x="600" y="550" width="390" height="230" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="795" y="625" font-size="38" fill="#008576" text-anchor="middle" font-weight="normal">100 纳秒</text><text x="795" y="710" font-size="39" fill="#18354a" text-anchor="middle" font-weight="normal">约 30 米</text><rect x="1100" y="550" width="390" height="230" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="1295" y="625" font-size="38" fill="#d95d39" text-anchor="middle" font-weight="normal">1 纳秒</text><text x="1295" y="710" font-size="39" fill="#18354a" text-anchor="middle" font-weight="normal">约 0.30 米</text><text x="120" y="850" font-size="30" fill="#18354a" text-anchor="start" font-weight="normal">这是时间误差对应的测距量级，不是手机最终位置误差的保证值。</text></g></svg>