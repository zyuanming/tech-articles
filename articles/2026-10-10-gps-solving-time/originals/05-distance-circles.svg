<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">只知道离一个点多远，你仍有一整圈选择</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">纯二维、准确距离、各点静止的模型；暂不加入接收机钟差</text><circle cx="520" cy="480" r="256.3201123595259" fill="none" stroke="#167aaf" stroke-width="5"/><circle cx="520" cy="480" r="10" fill="#167aaf" stroke="none" stroke-width="3"/><text x="540" y="462" font-size="39" fill="#167aaf" text-anchor="start" font-weight="normal">A</text><circle cx="1000" cy="480" r="256.3201123595259" fill="none" stroke="#d95d39" stroke-width="5"/><circle cx="1000" cy="480" r="10" fill="#d95d39" stroke="none" stroke-width="3"/><text x="1020" y="462" font-size="39" fill="#d95d39" text-anchor="start" font-weight="normal">B</text><circle cx="760" cy="750" r="180" fill="none" stroke="#008576" stroke-width="5"/><circle cx="760" cy="750" r="10" fill="#008576" stroke="none" stroke-width="3"/><text x="780" y="732" font-size="39" fill="#008576" text-anchor="start" font-weight="normal">C</text><circle cx="760" cy="570" r="15" fill="#18354a" stroke="none" stroke-width="3"/><text x="790" y="535" font-size="30" fill="#18354a" text-anchor="start" font-weight="normal">共同位置P</text><circle cx="760" cy="390" r="10" fill="#506979" stroke="none" stroke-width="3"/><text x="790" y="355" font-size="29" fill="#506979" text-anchor="start" font-weight="normal">A、B的另一个交点</text><line x1="950" y1="366" x2="777" y2="390" stroke="#506979" stroke-width="3"/><polygon points="777,390 792.4874067827752,378.9936277027874 794.898664705814,396.3747785646915" fill="#506979" stroke="#506979" stroke-width="4"/><text x="90" y="860" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">平面练习：已知到A、B、C的真实距离</text><text x="90" y="905" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">三维空间中，对应关系变为球面。</text></g></svg>