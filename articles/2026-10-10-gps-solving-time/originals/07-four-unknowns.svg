<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">第四颗卫星为什么重要？因为还藏着一个未知数</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">示意坐标不是经纬度定义；需有效信号与足够独立的几何约束</text><text x="100" y="260" font-size="39" fill="#167aaf" text-anchor="start" font-weight="normal">每颗卫星贡献一个测距约束</text><text x="830" y="260" font-size="36" fill="#008576" text-anchor="start" font-weight="normal">普通三维定位需要求4个未知量</text><rect x="165" y="320" width="70" height="70" rx="4" fill="#d6a038" stroke="#18354a" stroke-width="3"/><rect x="60" y="330" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><rect x="250" y="330" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><line x1="345" y1="355" x2="640" y2="355" stroke="#167aaf" stroke-width="4"/><polygon points="640,355 623.1470964671936,363.77380433528816 623.1470964671936,346.22619566471184" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="440" y="332" font-size="26" fill="#18354a" text-anchor="start" font-weight="normal">观测 1</text><rect x="680" y="315" width="210" height="80" rx="15" fill="#fff" stroke="#18354a" stroke-width="3"/><text x="785" y="366" font-size="32" fill="#18354a" text-anchor="middle" font-weight="normal">方程 1</text><rect x="165" y="450" width="70" height="70" rx="4" fill="#d6a038" stroke="#18354a" stroke-width="3"/><rect x="60" y="460" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><rect x="250" y="460" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><line x1="345" y1="485" x2="640" y2="485" stroke="#167aaf" stroke-width="4"/><polygon points="640,485 623.1470964671936,493.77380433528816 623.1470964671936,476.22619566471184" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="440" y="462" font-size="26" fill="#18354a" text-anchor="start" font-weight="normal">观测 2</text><rect x="680" y="445" width="210" height="80" rx="15" fill="#fff" stroke="#18354a" stroke-width="3"/><text x="785" y="496" font-size="32" fill="#18354a" text-anchor="middle" font-weight="normal">方程 2</text><rect x="165" y="580" width="70" height="70" rx="4" fill="#d6a038" stroke="#18354a" stroke-width="3"/><rect x="60" y="590" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><rect x="250" y="590" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><line x1="345" y1="615" x2="640" y2="615" stroke="#167aaf" stroke-width="4"/><polygon points="640,615 623.1470964671936,623.7738043352882 623.1470964671936,606.2261956647118" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="440" y="592" font-size="26" fill="#18354a" text-anchor="start" font-weight="normal">观测 3</text><rect x="680" y="575" width="210" height="80" rx="15" fill="#fff" stroke="#18354a" stroke-width="3"/><text x="785" y="626" font-size="32" fill="#18354a" text-anchor="middle" font-weight="normal">方程 3</text><rect x="165" y="710" width="70" height="70" rx="4" fill="#d6a038" stroke="#18354a" stroke-width="3"/><rect x="60" y="720" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><rect x="250" y="720" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><line x1="345" y1="745" x2="640" y2="745" stroke="#167aaf" stroke-width="4"/><polygon points="640,745 623.1470964671936,753.7738043352882 623.1470964671936,736.2261956647118" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="440" y="722" font-size="26" fill="#18354a" text-anchor="start" font-weight="normal">观测 4</text><rect x="680" y="705" width="210" height="80" rx="15" fill="#fff" stroke="#18354a" stroke-width="3"/><text x="785" y="756" font-size="32" fill="#18354a" text-anchor="middle" font-weight="normal">方程 4</text><text x="960" y="365" font-size="32" fill="#18354a" text-anchor="start" font-weight="normal">x：第一个空间坐标</text><text x="960" y="495" font-size="32" fill="#18354a" text-anchor="start" font-weight="normal">y：第二个空间坐标</text><text x="960" y="625" font-size="32" fill="#18354a" text-anchor="start" font-weight="normal">z：第三个空间坐标</text><text x="960" y="755" font-size="32" fill="#18354a" text-anchor="start" font-weight="normal">b：共同接收机钟差</text><text x="90" y="905" font-size="29" fill="#18354a" text-anchor="start" font-weight="normal">这些卫星共同约束全部未知量；不是“前三颗定位置，第四颗只管钟”。</text></g></svg>