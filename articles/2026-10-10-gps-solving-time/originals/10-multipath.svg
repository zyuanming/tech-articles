<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">时间没有算错，路却可能走绕了</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">仅示意反射多路径；实际反射点和误差取决于环境与接收机</text><rect x="1020" y="320" width="360" height="475" rx="3" fill="#bdc8cd" stroke="#18354a" stroke-width="3"/><rect x="470" y="595" width="100" height="190" rx="12" fill="#dcebef" stroke="#18354a" stroke-width="3"/><circle cx="520" cy="760" r="7" fill="#18354a" stroke="none" stroke-width="3"/><rect x="235" y="235" width="70" height="70" rx="4" fill="#d6a038" stroke="#18354a" stroke-width="3"/><rect x="130" y="245" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><rect x="320" y="245" width="90" height="50" rx="2" fill="#167aaf" stroke="#18354a" stroke-width="3"/><line x1="120" y1="800" x2="1490" y2="800" stroke="#18354a" stroke-width="5"/><line x1="300" y1="315" x2="495" y2="585" stroke="#008576" stroke-width="7"/><polygon points="495,585 478.0200432480287,576.4746807273168 492.2455251053546,566.200721608137" fill="#008576" stroke="#008576" stroke-width="4"/><text x="180" y="505" font-size="32" fill="#008576" text-anchor="start" font-weight="normal">直接路径</text><line x1="405" y1="290" x2="1020" y2="510" stroke="#d95d39" stroke-width="7"/><polygon points="1020,510 1001.1766312188093,512.5847219825924 1007.0870393442328,496.06244472288597" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="1020" y1="510" x2="575" y2="630" stroke="#d95d39" stroke-width="7"/><polygon points="575,630 588.9872930454535,617.140931866554 593.556032303747,634.083339949392" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="620" y="370" font-size="32" fill="#d95d39" text-anchor="start" font-weight="normal">反射绕路</text><text x="1060" y="640" font-size="37" fill="#18354a" text-anchor="start" font-weight="normal">建筑物</text><text x="185" y="890" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">额外路程混进计时，可能让接收机把某颗卫星“量得更远”。</text></g></svg>