<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">不准的钟，会让所有“尺子”一起偏移</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">一维纸上游戏，长度单位任意；b是接收机钟差换算出的长度，非大气误差</text><line x1="160" y1="410" x2="1440" y2="410" stroke="#18354a" stroke-width="5"/><polygon points="1440,410 1423.1470964671937,418.77380433528816 1423.1470964671937,401.22619566471184" fill="#18354a" stroke="#18354a" stroke-width="4"/><circle cx="250" cy="410" r="13" fill="#167aaf" stroke="none" stroke-width="3"/><text x="250" y="350" font-size="35" fill="#167aaf" text-anchor="middle" font-weight="normal">A站：0</text><circle cx="690" cy="410" r="13" fill="#008576" stroke="none" stroke-width="3"/><text x="690" y="350" font-size="35" fill="#008576" text-anchor="middle" font-weight="normal">你：4</text><circle cx="1350" cy="410" r="13" fill="#d95d39" stroke="none" stroke-width="3"/><text x="1350" y="350" font-size="35" fill="#d95d39" text-anchor="middle" font-weight="normal">B站：10</text><line x1="250" y1="480" x2="690" y2="480" stroke="#167aaf" stroke-width="5"/><text x="470" y="535" font-size="32" fill="#167aaf" text-anchor="middle" font-weight="normal">真实距离 4</text><line x1="690" y1="480" x2="1350" y2="480" stroke="#d95d39" stroke-width="5"/><text x="1020" y="535" font-size="32" fill="#d95d39" text-anchor="middle" font-weight="normal">真实距离 6</text><rect x="130" y="615" width="620" height="230" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="165" y="685" font-size="30" fill="#18354a" text-anchor="start" font-weight="normal">如果两项都多了同一个偏差b</text><text x="165" y="755" font-size="35" fill="#167aaf" text-anchor="start" font-weight="normal">测得：6 = x + b</text><text x="165" y="805" font-size="35" fill="#d95d39" text-anchor="start" font-weight="normal">测得：8 = (10 − x) + b</text><text x="875" y="695" font-size="32" fill="#18354a" text-anchor="start" font-weight="normal">两式相加：14 = 10 + 2b</text><text x="875" y="765" font-size="35" fill="#008576" text-anchor="start" font-weight="normal">求得 b = 2，再求 x = 4</text><text x="900" y="835" font-size="30" fill="#18354a" text-anchor="start" font-weight="normal">位置和共同偏差，一起解。</text></g></svg>