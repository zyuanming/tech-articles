<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sturm 精确计数教学报告</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:40px;background:#f8fafc;color:#142d42;font:42px/1.5 "Noto Sans CJK SC",sans-serif}h1{font-size:48px;line-height:1.35;margin:0 0 22px}h2{font-size:42px;margin:24px 0 12px}p{margin:12px 0}table{width:100%;border-collapse:collapse;font-size:40px}th,td{padding:18px 12px;border-bottom:2px solid #8195a5;text-align:left}th{font-weight:500}small{font-size:40px}.good{color:#166c57}.sub{color:#176297}#report{max-width:1100px;margin:auto}code{font:inherit}.columns{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{border:2px solid #8195a5;border-radius:12px;padding:22px} @media(max-width:600px){body{font-size:18px;padding:18px}h1{font-size:25px}h2{font-size:21px}table,small{font-size:17px}th,td{padding:12px 5px}.columns{grid-template-columns:1fr}.panel{padding:14px}}
</style><main id="report"><h1>Sturm 精确计数：本地运行报告</h1><p class="sub">读取 run_examples.py 的实际输出</p><p id="version"></p><h2>三组输入，核对不同实根数量</h2><table><thead><tr><th>输入及闭区间</th><th>本文</th><th>SymPy</th></tr></thead><tbody id="cases"></tbody></table><h2>主算例 (−2,2] 的隔离区间</h2><p id="isolation" class="good"></p><div class="columns"><section class="panel"><p>已知因式对照</p><p id="checks" class="good"></p></section><section class="panel"><p>独立 CAS 对照</p><p id="cas" class="good"></p></section></div><p>计数使用 Fraction 精确有理数。</p><p><small>这是可复算教学报告，不是生产求根器，也不是 SymPy 官方界面。</small></p></main>
<script>
fetch('results.json').then(r=>r.json()).then(d=>{document.querySelector('#version').textContent=`Python ${d.versions.python} · SymPy ${d.versions.sympy}`;const labels=['x³−x；[−2,2]','x³−3x+2；[−3,2]','x²+1；[−2,2]'];document.querySelector('#cases').innerHTML=d.verification.cas_cases.slice(0,3).map((c,i)=>`<tr><td>${labels[i]}</td><td>${c.ours}</td><td>${c.sympy}</td></tr>`).join('');document.querySelector('#isolation').textContent=d.main.isolation.map(([a,b])=>`(${a}, ${b}]`).join('、');document.querySelector('#checks').textContent=`${d.verification.endpoint_comparisons} 次一致`;document.querySelector('#cas').textContent=`${d.verification.cas_cases.length} 组一致`;document.body.dataset.ready='true';});
</script></html>
