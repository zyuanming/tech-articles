<line x1="160" y1="670" x2="400" y2="670" stroke="#5276bf" stroke-width="4"/>
<polygon points="400,670 384.6923992600045,677.3944140798909 384.6923992600045,662.6055859201091" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
<line x1="415" y1="280" x2="805" y2="280" stroke="#087f8c" stroke-width="7"/>
<polygon points="805,280 789.6923992600045,287.3944140798909 789.6923992600045,272.6055859201091" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="480" y="255" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#087f8c" text-anchor="start">继续，权重×2</text>
<line x1="415" y1="540" x2="805" y2="540" stroke="#087f8c" stroke-width="7"/>
<polygon points="805,540 789.6923992600045,547.3944140798909 789.6923992600045,532.6055859201091" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="480" y="515" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#087f8c" text-anchor="start">继续，权重×2</text>
<line x1="455" y1="385" x2="505" y2="435" stroke="#c54c53" stroke-width="6"/>
<line x1="505" y1="385" x2="455" y2="435" stroke="#c54c53" stroke-width="6"/>
<text x="550" y="422" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#c54c53" text-anchor="start">停止</text>
<line x1="455" y1="645" x2="505" y2="695" stroke="#c54c53" stroke-width="6"/>
<line x1="505" y1="645" x2="455" y2="695" stroke="#c54c53" stroke-width="6"/>
<text x="550" y="682" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#c54c53" text-anchor="start">停止</text>
<text x="100" y="195" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#57727c" text-anchor="start">示意四次随机结果，不代表必须恰好活两次</text></svg>