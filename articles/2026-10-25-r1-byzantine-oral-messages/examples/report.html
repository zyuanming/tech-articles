<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>口信算法 · 执行结果</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#142d42;font:40px/1.6 'Noto Sans CJK SC',sans-serif;padding:44px}h1{font-size:50px;margin:0 0 16px}h2{font-size:44px;margin:36px 0 14px}p{margin:14px 0}section{border-top:3px solid #8ba7bb;padding-top:14px}table{border-collapse:collapse;width:100%;font-size:40px}td,th{text-align:left;padding:14px 8px;border-bottom:2px solid #ced9e0}strong{color:#166c57}small{font-size:40px;display:block} @media(max-width:700px){body{font-size:18px;padding:18px}h1{font-size:25px}h2{font-size:22px}table,small{font-size:18px}td,th{padding:12px 4px}}</style>
<h1>口信算法 · 执行结果</h1><p>同步模型 / 单次指挥官广播</p><p id="runtime"></p>
<section><h2>四人、最多一人恶意</h2><table><thead><tr><th>故障</th><th>忠诚者输出</th><th>槽数</th></tr></thead><tbody id="runs"></tbody></table></section>
<section><h2>七人、最多两人恶意</h2><p id="deep"></p><p id="counts"></p><p id="decision"></p></section>
<section><h2>实际执行的有限检验</h2><p id="exhaust"></p><p id="random"></p><p><strong>适用保证全部通过</strong></p><small>有限检验不是一般正确性证明</small></section>
<section><h2>越过人数边界会怎样？</h2><p id="under"></p><small>本页读数来自 results.json。<br>没有网络节点或真实延迟测量。</small></section>
<script>fetch('results.json').then(r=>r.json()).then(d=>{document.querySelector('#runtime').textContent='Python '+d.python+' · 默认缺报/平票：退';document.querySelector('#runs').innerHTML=[['坏C',d.bad_c],['坏D',d.good_c],['C缺报',d.missing]].map(([s,r])=>`<tr><td>${s}</td><td>${Object.entries(r.loyal).map(([k,v])=>k+v).join(' ')}</td><td>${r.slots}</td></tr>`).join('');document.querySelector('#deep').textContent='恶意节点：'+d.higher.faulty.join('、');document.querySelector('#counts').textContent='各轮槽数：'+Object.values(d.higher.round_counts).join(' + ')+' = '+d.higher.slots;document.querySelector('#decision').textContent='忠诚者输出：'+Object.entries(d.higher.loyal).map(([k,v])=>k+v).join(' ');document.querySelector('#exhaust').textContent='四人三值穷举：'+d.tests.n4_ternary_cases+' 组';document.querySelector('#random').textContent='七人独立种子检验：'+d.tests.n7_seeded_cases+' 组';document.querySelector('#under').textContent='三人OM(1)：忠诚C发进，忠诚A却输出'+d.under.loyal.A+'；有效性失败。';document.body.dataset.ready='true';});</script></html>
