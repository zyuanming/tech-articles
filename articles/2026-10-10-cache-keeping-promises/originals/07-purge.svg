<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">要让浏览器取新版，还需新请求、新URL或重新验证等机制。</text></svg>