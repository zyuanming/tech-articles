<text x="475" y="389" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="56" font-weight="400" fill="#5276bf" text-anchor="middle">V1</text>
<text x="780" y="235" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#e57735" text-anchor="middle">源站</text>
<rect x="670" y="285" width="220" height="170" rx="15" fill="#ffffff" stroke="#e57735" stroke-width="4"/>
<text x="780" y="389" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="56" font-weight="400" fill="#e57735" text-anchor="middle">V2</text>
<line x1="390" y1="303" x2="560" y2="432" stroke="#c54c53" stroke-width="9"/>
<line x1="560" y1="303" x2="390" y2="432" stroke="#c54c53" stroke-width="9"/>
<text x="170" y="535" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#087f8c" text-anchor="middle">仍可能保留</text>
<text x="475" y="535" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#c54c53" text-anchor="middle">已被清理</text>
