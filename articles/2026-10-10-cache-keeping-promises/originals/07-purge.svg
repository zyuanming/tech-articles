<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>清掉 CDN 副本，不会遥控擦掉浏览器</title><rect width="960" height="780" fill="#f7f4ed"/>
