<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>两层缓存可以拥有不同的新鲜期</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">两层缓存可以拥有不同的新鲜期</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">响应指令：max-age=60, s-maxage=300</text>
<text x="50" y="290" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#087f8c" text-anchor="start">浏览器</text>
<line x1="240" y1="280" x2="850" y2="280" stroke="#d2dbd8" stroke-width="16"/>
<line x1="240" y1="280" x2="360" y2="280" stroke="#087f8c" stroke-width="16"/>
<circle cx="360" cy="280" r="12" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="360" y="345" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#087f8c" text-anchor="middle">60 秒</text>
<text x="50" y="470" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#5276bf" text-anchor="start">共享缓存</text>
<line x1="240" y1="460" x2="850" y2="460" stroke="#d2dbd8" stroke-width="16"/>
<line x1="240" y1="460" x2="840" y2="460" stroke="#5276bf" stroke-width="16"/>
<circle cx="840" cy="460" r="12" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
<text x="840" y="525" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#5276bf" text-anchor="middle">300 秒</text>
<line x1="480" y1="180" x2="480" y2="570" stroke="#e57735" stroke-width="4" stroke-dasharray="8 7"/>
<text x="480" y="631" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#e57735" text-anchor="middle">同一响应年龄 120 秒</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">年龄不会在副本每经过一个缓存时，都自动重新从零计时。</text></svg>