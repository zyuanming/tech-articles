<polygon points="345,345 329.6923992600045,352.3944140798909 329.6923992600045,337.6055859201091" fill="#183747" stroke="#183747" stroke-width="3"/>
<rect x="365" y="260" width="220" height="170" rx="15" fill="#ffffff" stroke="#5276bf" stroke-width="4"/>
<rect x="383" y="278" width="184" height="24" rx="0" fill="#5276bf" stroke="#5276bf" stroke-width="2"/>
<text x="475" y="362" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#5276bf" text-anchor="middle">CDN</text>
<text x="475" y="479" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#57727c" text-anchor="middle">附近节点</text>
<line x1="602" y1="345" x2="650" y2="345" stroke="#183747" stroke-width="4"/>
<polygon points="650,345 634.6923992600045,352.3944140798909 634.6923992600045,337.6055859201091" fill="#183747" stroke="#183747" stroke-width="3"/>
