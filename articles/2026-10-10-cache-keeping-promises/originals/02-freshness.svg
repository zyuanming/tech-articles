<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>服务器更新了，旧副本仍可能“新鲜”</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">服务器更新了，旧副本仍可能“新鲜”</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">示例：0 秒存入 V1，max-age=60；10 秒源站改成 V2</text>
<line x1="80" y1="350" x2="895" y2="350" stroke="#183747" stroke-width="4"/>
<polygon points="895,350 879.6923992600045,357.3944140798909 879.6923992600045,342.6055859201091" fill="#183747" stroke="#183747" stroke-width="3"/>
<circle cx="110" cy="350" r="12" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="110" y="235" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#087f8c" text-anchor="middle">存入 V1</text>
<text x="110" y="295" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#087f8c" text-anchor="middle">0 秒</text>
<circle cx="230" cy="350" r="12" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="230" y="460" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#e57735" text-anchor="middle">源站 V2</text>
<text x="230" y="510" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#e57735" text-anchor="middle">10 秒</text>
<circle cx="350" cy="350" r="12" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
<text x="350" y="235" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#5276bf" text-anchor="middle">仍可用 V1</text>
<text x="350" y="295" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#5276bf" text-anchor="middle">20 秒</text>
<circle cx="830" cy="350" r="12" fill="#c54c53" stroke="#c54c53" stroke-width="3"/>
<text x="830" y="460" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#c54c53" text-anchor="middle">开始过期</text>
<text x="830" y="510" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#c54c53" text-anchor="middle">60 秒</text>
<line x1="110" y1="570" x2="830" y2="570" stroke="#087f8c" stroke-width="12"/>
<text x="470" y="645" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#087f8c" text-anchor="middle">60 秒的新鲜期：允许直接复用</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">假设无其他强制再验证条件，忽略传输和时钟误差。</text></svg>