<text x="83" y="635" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#183747" text-anchor="start">实例各有位置、比例等信息；内部形状由定义决定。</text>
<text x="42" y="672" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">原创教学示意；现代组件与预制体可以借此理解，但不完全等同。</text></svg>