<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1267" viewBox="0 0 960 760" role="img"><title>拆成偶数位置与奇数位置</title><rect width="960" height="760" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">拆成偶数位置与奇数位置</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">新的算例 x = [1, 2, 3, 4]；下标仍从 0 开始</text>
<rect x="135" y="190" width="100" height="85" rx="12" fill="#087f8c" stroke="None" stroke-width="2"/>
<text x="185" y="249" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="43" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="185" y="320" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#57727c" text-anchor="middle">n=0</text>
<rect x="325" y="190" width="100" height="85" rx="12" fill="#e57735" stroke="None" stroke-width="2"/>
<text x="375" y="249" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="43" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="375" y="320" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#57727c" text-anchor="middle">n=1</text>
<rect x="515" y="190" width="100" height="85" rx="12" fill="#087f8c" stroke="None" stroke-width="2"/>
<text x="565" y="249" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="43" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="565" y="320" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#57727c" text-anchor="middle">n=2</text>
<rect x="705" y="190" width="100" height="85" rx="12" fill="#e57735" stroke="None" stroke-width="2"/>
<text x="755" y="249" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="43" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="755" y="320" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#57727c" text-anchor="middle">n=3</text>
<line x1="185" y1="345" x2="280" y2="440" stroke="#087f8c" stroke-width="4"/>
<polygon points="280,440 263.9472513742608,434.40453205184514 274.40453205184514,423.9472513742608" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<line x1="375" y1="345" x2="695" y2="440" stroke="#e57735" stroke-width="4"/>
<polygon points="695,440 678.2209789293147,442.73211491513405 682.4298541114194,428.5548511438339" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<line x1="565" y1="345" x2="280" y2="440" stroke="#087f8c" stroke-width="4"/>
<polygon points="280,440 292.1837461097721,428.1443544784515 296.8603842007468,442.1742687513756" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<line x1="755" y1="345" x2="695" y2="440" stroke="#e57735" stroke-width="4"/>
<polygon points="695,440 696.9222564611593,423.10902814822276 709.4260465590868,431.0061587363875" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<rect x="105" y="450" width="350" height="170" rx="18" fill="#ffffff" stroke="#087f8c" stroke-width="2"/>
<text x="280" y="505" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#087f8c" text-anchor="middle">偶数位置 [1, 3]</text>
<text x="280" y="570" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#183747" text-anchor="middle">2 点 DFT：[4, −2]</text>
<rect x="520" y="450" width="350" height="170" rx="18" fill="#ffffff" stroke="#e57735" stroke-width="2"/>
<text x="695" y="505" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="400" fill="#e57735" text-anchor="middle">奇数位置 [2, 4]</text>
<text x="695" y="570" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#183747" text-anchor="middle">2 点 DFT：[6, −2]</text>
<text x="42" y="722" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">2 点 DFT 很简单：[a, b] → [a+b, a−b]。</text></svg>