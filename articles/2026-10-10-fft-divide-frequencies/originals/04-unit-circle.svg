<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>乘以 −i，就是顺时针转四分之一圈</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">乘以 −i，就是顺时针转四分之一圈</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">复数平面：横轴是实部，纵轴是虚部</text>
<circle cx="480" cy="415" r="170" fill="none" stroke="#d2dbd8" stroke-width="3"/>
<line x1="220" y1="415" x2="750" y2="415" stroke="#57727c" stroke-width="3"/>
<polygon points="750,415 734.6923992600045,422.3944140798909 734.6923992600045,407.6055859201091" fill="#57727c" stroke="#57727c" stroke-width="3"/>
<line x1="480" y1="675" x2="480" y2="165" stroke="#57727c" stroke-width="3"/>
<polygon points="480,165 487.3944140798909,180.3076007399955 472.6055859201091,180.3076007399955" fill="#57727c" stroke="#57727c" stroke-width="3"/>
<circle cx="650" cy="415" r="13" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="690" y="393" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#183747" text-anchor="middle">1</text>
<circle cx="480" cy="585" r="13" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="528" y="635" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#183747" text-anchor="middle">−i</text>
<circle cx="310" cy="415" r="13" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="265" y="393" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#183747" text-anchor="middle">−1</text>
<circle cx="480" cy="245" r="13" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="528" y="217" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#183747" text-anchor="middle">i</text>
<line x1="480" y1="415" x2="640" y2="415" stroke="#e57735" stroke-width="6"/>
<polygon points="640,415 624.6923992600045,422.3944140798909 624.6923992600045,407.6055859201091" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<path d="M 636 450 A 160 160 0 0 1 521 570" fill="none" stroke="#e57735" stroke-width="5" stroke-linejoin="round"/>
<line x1="532" y1="567" x2="517" y2="572" stroke="#e57735" stroke-width="5"/>
<polygon points="517,572 529.1837461097721,560.1443544784514 533.8603842007468,574.1742687513756" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="795" y="425" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#57727c" text-anchor="middle">实部</text>
<text x="532" y="180" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#57727c" text-anchor="middle">虚部</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">四次相乘绕回 1：1 → −i → −1 → i → 1。</text></svg>