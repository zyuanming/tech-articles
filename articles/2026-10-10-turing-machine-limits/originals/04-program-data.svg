<text x="235" y="278" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="middle">有限字符串</text>
<rect x="540" y="180" width="350" height="120" rx="10" fill="#ffffff" stroke="#087f8c" stroke-width="2"/>
<text x="715" y="235" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#183747" text-anchor="middle">初始纸带</text>
<text x="715" y="278" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="middle">输入内容</text>
<line x1="240" y1="320" x2="400" y2="440" stroke="#183747" stroke-width="4"/>
<polygon points="400,440 383.31727096006904,436.7309708199154 392.1905678559381,424.89990829208995" fill="#183747" stroke="#183747" stroke-width="3"/>
<line x1="720" y1="320" x2="560" y2="440" stroke="#183747" stroke-width="4"/>
<polygon points="560,440 567.8094321440618,424.89990829208995 576.6827290399309,436.73097081991546" fill="#183747" stroke="#183747" stroke-width="3"/>
<rect x="260" y="450" width="440" height="130" rx="14" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<text x="480" y="530" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#ffffff" text-anchor="middle">通用模拟器</text>
<line x1="480" y1="600" x2="480" y2="665" stroke="#183747" stroke-width="4"/>
<polygon points="480,665 472.6055859201091,649.6923992600045 487.3944140798909,649.6923992600045" fill="#183747" stroke="#183747" stroke-width="3"/>
