<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>程序也能变成输入数据</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">程序也能变成输入数据</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">通用机器读取“规则描述 + 初始纸带”</text>
<rect x="60" y="180" width="350" height="120" rx="10" fill="#ffffff" stroke="#087f8c" stroke-width="2"/>
