<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>等了很久，不等于永远不结束</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">等了很久，不等于永远不结束</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">有限观察只能说明“目前还没有停”</text>
<line x1="80" y1="350" x2="880" y2="350" stroke="#183747" stroke-width="4"/>
<polygon points="880,350 864.6923992600045,357.3944140798909 864.6923992600045,342.6055859201091" fill="#183747" stroke="#183747" stroke-width="3"/>
<line x1="140" y1="330" x2="140" y2="370" stroke="#183747" stroke-width="4"/>
<text x="140" y="430" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#183747" text-anchor="middle">1秒</text>
<line x1="370" y1="330" x2="370" y2="370" stroke="#183747" stroke-width="4"/>
<text x="370" y="430" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#183747" text-anchor="middle">1小时</text>
<line x1="600" y1="330" x2="600" y2="370" stroke="#183747" stroke-width="4"/>
<text x="600" y="430" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#183747" text-anchor="middle">1年</text>
<line x1="815" y1="330" x2="815" y2="370" stroke="#183747" stroke-width="4"/>
<text x="815" y="430" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#183747" text-anchor="middle">更久</text>
<rect x="170" y="550" width="620" height="110" rx="12" fill="#ffffff" stroke="#e57735" stroke-width="2"/>
<text x="480" y="620" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#e57735" text-anchor="middle">超时 ≠ 已证明不停机</text></svg>