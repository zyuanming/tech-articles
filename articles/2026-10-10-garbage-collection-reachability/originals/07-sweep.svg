<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1067" viewBox="0 0 960 640" role="img"><title>先标记，再扫过全部受管理对象</title><rect width="960" height="640" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">先标记，再扫过全部受管理对象</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">本例只回收 D、E、F，不搬动 A、B、C</text>
<rect x="120" y="230" width="110" height="95" rx="10" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
