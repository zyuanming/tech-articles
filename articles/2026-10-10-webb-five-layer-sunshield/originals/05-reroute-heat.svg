<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">遮阳板还会变热，所以要给热量安排出口</text><rect x="90" y="240" width="660" height="545" rx="15" fill="#fff" stroke="none" stroke-width="3"/><rect x="850" y="240" width="660" height="545" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="130" y="310" font-size="36" fill="#d95d39" text-anchor="start" font-weight="bold">只挡住直射，还不够</text><rect x="335" y="395" width="30" height="265" rx="15" fill="#c1bec2" stroke="none" stroke-width="3"/><line x1="155" y1="500" x2="310" y2="500" stroke="#d6a038" stroke-width="10"/><polygon points="310,500 293.1470964671936,508.77380433528816 293.1470964671936,491.22619566471184" fill="#d6a038" stroke="#d6a038" stroke-width="4"/><line x1="380" y1="460" x2="660" y2="420" stroke="#d95d39" stroke-width="5"/><polygon points="660,420 644.5572799894351,431.0689836333467 642.0756733725206,413.69773731494536" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="380" y1="570" x2="660" y2="610" stroke="#d95d39" stroke-width="5"/><polygon points="660,610 642.0756733725206,616.3022626850546 644.5572799894351,598.9310163666534" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="125" y="730" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">薄膜吸收一部分能量后，也会辐射</text><text x="890" y="310" font-size="36" fill="#167aaf" text-anchor="start" font-weight="bold">让剩余热量一层层离开</text><path d="M 945,670 Q 1170,625 1415,580" stroke="#d95d39" stroke-width="11" fill="none"/><path d="M 945,610 Q 1170,565 1415,520" stroke="#da8c63" stroke-width="11" fill="none"/><path d="M 945,550 Q 1170,505 1415,460" stroke="#b5a08e" stroke-width="11" fill="none"/><path d="M 945,490 Q 1170,445 1415,400" stroke="#89a4b8" stroke-width="11" fill="none"/><path d="M 945,430 Q 1170,385 1415,340" stroke="#167aaf" stroke-width="11" fill="none"/><line x1="970" y1="590" x2="875" y2="490" stroke="#d95d39" stroke-width="5"/><polygon points="875,490 892.9684314134728,496.1753925008314 880.2464250663685,508.26129853058046" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="1360" y1="475" x2="1470" y2="390" stroke="#d95d39" stroke-width="5"/><polygon points="1470,390 1462.0292709403209,407.2472455266685 1451.2998294688416,393.3620859753423" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="890" y="745" font-size="29" fill="#18354a" text-anchor="start" font-weight="normal">层间留空；边缘向深空敞开</text></g></svg>