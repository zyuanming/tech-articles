<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">冷，并不意味着见不到太阳</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">日地距离、轨道及望远镜尺寸均不按比例</text><circle cx="175" cy="520" r="93" fill="#d6a038" stroke="none" stroke-width="3"/><text x="110" y="660" font-size="34" fill="#18354a" text-anchor="start" font-weight="normal">太阳</text><circle cx="560" cy="520" r="45" fill="#167aaf" stroke="none" stroke-width="3"/><text x="515" y="660" font-size="34" fill="#18354a" text-anchor="start" font-weight="normal">地球</text><line x1="275" y1="520" x2="1430" y2="520" stroke="#bbc9cf" stroke-width="3" stroke-dasharray="12 14"/><path d="M 1170,320 C 1340,250 1500,560 1320,680 C 1170,750 1110,450 1170,320" stroke="#008576" stroke-width="4" fill="none" stroke-dasharray="10 10"/><polygon points="1205,310 1245,285 1325,365 1285,395" fill="#c5b0d1" stroke="#18354a" stroke-width="4"/><polygon points="1280,250 1375,260 1340,330" fill="#d9b34f" stroke="#18354a" stroke-width="4"/><line x1="1320" y1="320" x2="1450" y2="225" stroke="#167aaf" stroke-width="5"/><polygon points="1450,225 1441.5698054128068,242.02738439168093 1431.2164251938798,227.85960093420186" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="920" y="765" font-size="30" fill="#18354a" text-anchor="start" font-weight="normal">在 L2 附近的轨道上运行，并非躲进地球影子</text><text x="1000" y="820" font-size="31" fill="#167aaf" text-anchor="start" font-weight="normal">把热源留在遮阳板同一侧</text><line x1="315" y1="360" x2="1120" y2="360" stroke="#d95d39" stroke-width="4"/><polygon points="1120,360 1103.1470964671937,368.77380433528816 1103.1470964671937,351.22619566471184" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="475" y="300" font-size="32" fill="#d95d39" text-anchor="start" font-weight="normal">阳光照常到达</text></g></svg>