<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">真空里，哪种传热还在继续？</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">真空没有流体对流；支撑结构的热传导仍需工程控制</text><rect x="65" y="240" width="475" height="535" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="95" y="310" font-size="38" fill="#18354a" text-anchor="start" font-weight="bold">接触传热</text><text x="95" y="705" font-size="26" fill="#18354a" text-anchor="start" font-weight="normal">固体连接仍能传导热</text><rect x="560" y="240" width="475" height="535" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="590" y="310" font-size="38" fill="#18354a" text-anchor="start" font-weight="bold">流体搬运</text><text x="590" y="705" font-size="26" fill="#18354a" text-anchor="start" font-weight="normal">没有空气，就没有空气对流</text><rect x="1055" y="240" width="475" height="535" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="1085" y="310" font-size="38" fill="#18354a" text-anchor="start" font-weight="bold">电磁辐射</text><text x="1085" y="705" font-size="26" fill="#18354a" text-anchor="start" font-weight="normal">真空挡不住太阳光</text><rect x="125" y="420" width="140" height="100" rx="15" fill="#e9ad91" stroke="none" stroke-width="3"/><rect x="265" y="450" width="180" height="40" rx="15" fill="#9eb2c2" stroke="none" stroke-width="3"/><line x1="190" y1="510" x2="410" y2="510" stroke="#d95d39" stroke-width="5"/><polygon points="410,510 393.1470964671936,518.7738043352882 393.1470964671936,501.22619566471184" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="140" y="620" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">结构件要减少热桥</text><circle cx="800" cy="460" r="100" fill="#e6f2f0" stroke="#008576" stroke-width="3"/><path d="M 740,510 Q 700,380 800,380 Q 890,380 860,505" stroke="#008576" stroke-width="6" fill="none"/><line x1="720" y1="365" x2="875" y2="550" stroke="#d95d39" stroke-width="9"/><text x="635" y="620" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">太空不是吹冷风的冰箱</text><circle cx="1150" cy="460" r="65" fill="#d6a038" stroke="none" stroke-width="3"/><line x1="1240" y1="435" x2="1450" y2="435" stroke="#d95d39" stroke-width="5"/><polygon points="1450,435 1433.1470964671937,443.77380433528816 1433.1470964671937,426.22619566471184" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="1240" y1="485" x2="1450" y2="485" stroke="#d95d39" stroke-width="5"/><polygon points="1450,485 1433.1470964671937,493.77380433528816 1433.1470964671937,476.22619566471184" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="1120" y="620" font-size="27" fill="#18354a" text-anchor="start" font-weight="normal">靠向深空辐射散热</text></g></svg>