<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">把“很薄”拆成材料问题</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">各涂层厚度被大幅放大；数字为薄膜层的工程量级</text><rect x="80" y="240" width="1440" height="540" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="125" y="315" font-size="39" fill="#18354a" text-anchor="start" font-weight="bold">不是厨房铝箔，也不是五块金属板</text><rect x="155" y="435" width="920" height="110" rx="15" fill="#c8aad0" stroke="none" stroke-width="3"/><rect x="155" y="425" width="920" height="10" rx="15" fill="#94a7b7" stroke="none" stroke-width="3"/><rect x="155" y="545" width="920" height="10" rx="15" fill="#94a7b7" stroke="none" stroke-width="3"/><line x1="1140" y1="480" x2="1310" y2="480" stroke="#18354a" stroke-width="5"/><polygon points="1310,480 1293.1470964671937,488.77380433528816 1293.1470964671937,471.22619566471184" fill="#18354a" stroke="#18354a" stroke-width="4"/><text x="160" y="635" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">聚酰亚胺薄膜（Kapton）承担薄而韧的骨架</text><text x="160" y="692" font-size="29" fill="#18354a" text-anchor="start" font-weight="normal">金属 / 特殊涂层调节反射、辐射与静电表现</text><text x="1120" y="380" font-size="28" fill="#d95d39" text-anchor="start" font-weight="normal">第 1 层：约 0.05 mm</text><text x="1120" y="620" font-size="28" fill="#167aaf" text-anchor="start" font-weight="normal">其余各层：约 0.025 mm</text></g></svg>