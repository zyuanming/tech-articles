<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">五层遮阳板很厉害，但没有包办所有制冷</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">各部件温度不同，不把整架望远镜当成一个温度计读数</text><rect x="80" y="240" width="700" height="520" rx="15" fill="#fff" stroke="none" stroke-width="3"/><rect x="840" y="240" width="680" height="520" rx="15" fill="#fff" stroke="none" stroke-width="3"/><text x="120" y="320" font-size="39" fill="#167aaf" text-anchor="start" font-weight="bold">遮阳 + 向深空散热</text><text x="120" y="430" font-size="34" fill="#18354a" text-anchor="start" font-weight="normal">望远镜与近红外仪器</text><text x="120" y="500" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">工作在几十开尔文的低温环境</text><text x="120" y="635" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">少吸收热量，也要能排出热量</text><text x="880" y="320" font-size="39" fill="#008576" text-anchor="start" font-weight="bold">MIRI 还需要主动冷却</text><text x="885" y="430" font-size="34" fill="#18354a" text-anchor="start" font-weight="normal">中红外仪器的探测器</text><text x="885" y="500" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">需要低于 7 K 的工作温度</text><text x="885" y="635" font-size="29" fill="#18354a" text-anchor="start" font-weight="normal">电力驱动的低温制冷机继续搬热</text><text x="90" y="825" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">开尔文 K = 摄氏温度 + 273.15；0 K 是绝对零度。</text></g></svg>