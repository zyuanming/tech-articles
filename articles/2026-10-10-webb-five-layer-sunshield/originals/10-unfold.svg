<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">最难的“折纸”：展开后还要保持立体形状</text><rect x="80" y="235" width="450" height="555" rx="15" fill="#fff" stroke="none" stroke-width="3"/><circle cx="140" cy="300" r="33" fill="#008576" stroke="none" stroke-width="3"/><text x="140" y="312" font-size="35" fill="white" text-anchor="middle" font-weight="normal">1</text><text x="110" y="725" font-size="27" fill="#18354a" text-anchor="start" font-weight="bold">收拢装入火箭</text><rect x="580" y="235" width="450" height="555" rx="15" fill="#fff" stroke="none" stroke-width="3"/><circle cx="640" cy="300" r="33" fill="#008576" stroke="none" stroke-width="3"/><text x="640" y="312" font-size="35" fill="white" text-anchor="middle" font-weight="normal">2</text><text x="610" y="725" font-size="27" fill="#18354a" text-anchor="start" font-weight="bold">把薄膜向两边展开</text><rect x="1080" y="235" width="450" height="555" rx="15" fill="#fff" stroke="none" stroke-width="3"/><circle cx="1140" cy="300" r="33" fill="#008576" stroke="none" stroke-width="3"/><text x="1140" y="312" font-size="35" fill="white" text-anchor="middle" font-weight="normal">3</text><text x="1110" y="725" font-size="27" fill="#18354a" text-anchor="start" font-weight="bold">分层、张紧、留出空隙</text><path d="M 185,630 L 185,390 Q 305,250 425,390 L 425,630 Z" stroke="#9cb0bc" stroke-width="5" fill="#e4ecef"/><rect x="270" y="420" width="60" height="180" rx="15" fill="#b4a2c9" stroke="none" stroke-width="3"/><polygon points="615,550 800,475 1000,550 800,625" fill="#ccbddd" stroke="#008576" stroke-width="4"/><line x1="770" y1="400" x2="640" y2="400" stroke="#167aaf" stroke-width="5"/><polygon points="640,400 656.8529035328064,391.22619566471184 656.8529035328064,408.77380433528816" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><line