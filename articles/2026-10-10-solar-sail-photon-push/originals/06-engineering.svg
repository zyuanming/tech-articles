<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">大帆的难题：带到太空、顺利展开、保持形状</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">推力随受光面积增加；质量、收纳、支撑和控制也必须一起算。</text><rect x="65" y="210" width="380" height="510" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="255" y="270" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">收起来</text><rect x="525" y="210" width="380" height="510" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="715" y="270" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">展开来</text><rect x="985" y="210" width="380" height="510" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="1175" y="270" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">稳得住</text><rect x="175" y="385" width="145" height="185" rx="12" fill="#516d7d" stroke="none" stroke-width="3"/><line x1="190" y1="410" x2="305" y2="410" stroke="white" stroke-width="4"/><line x1="190" y1="438" x2="305" y2="438" stroke="white" stroke-width="4"/><line x1="190" y1="466" x2="305" y2="466" stroke="white" stroke-width="4"/><line x1="190" y1="494" x2="305" y2="494" stroke="white" stroke-width="4"/><line x1="190" y1="522" x2="305" y2="522" stroke="white" stroke-width="4"/><polygon points="735,330 860,465 735,605 595,465" fill="#bbdbe9" stroke="#b6c9ce" stroke-width="3"/><line x1="595" y1="465" x2="860" y2="465" stroke="#173449" stroke-width="6"/><line x1="735" y1="330" x2="735" y2="605" stroke="#173449" stroke-width="6"/><rect x="717" y="447" width="35" height="35" rx="0" fill="#ef9754" stroke="none" stroke-width="3"/><line x1="1080" y1="540" x2="1290" y2="360" stroke="#516d7d" stroke-width="10"/><line x1="1060" y1="360" x2="1260" y2="450" stroke="#ef9754" stroke-width="4" marker-end="url(#arr)"/><line x1="1060" y1="415" x2="1260" y2="505" stroke="#ef9754" stroke-width="4" marker-end="url(#arr)"/><line x1="1060" y1="470" x2="1260" y2="560" stroke="#ef9754" stroke-width="4" marker-end="url(#arr)"/><text x="255" y="660" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" font-weight="normal" fill="#173449">少占火箭舱体空间</text><text x="715" y="660" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" font-weight="normal" fill="#173449">薄膜不能缠住、撕裂</text><text x="1175" y="660" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" font-weight="normal" fill="#173449">轻，但不能软得失控</text><text x="100" y="805" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">只把帆做大，不保证加速度就变大。</text><text x="100" y="849" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">该比较的是“能获得多少推力”与“要带动多少总质量”，还要能控制方向。</text></svg>