<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">明明被太阳向外推，怎么还可能靠近太阳？</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">关键是改变绕太阳运动的速度，而非直接把帆“向内拉”。</text><circle cx="480" cy="470" r="240" fill="none" stroke="#b6c9ce" stroke-width="4"/><circle cx="480" cy="470" r="70" fill="#ef9754" stroke="none" stroke-width="3"/><text x="480" y="480" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="white">太阳</text><circle cx="720" cy="470" r="16" fill="#277fc5" stroke="none" stroke-width="3"/><line x1="720" y1="470" x2="720" y2="230" stroke="#173449" stroke-width="6" marker-end="url(#arr)"/><text x="745" y="230" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">原有绕行速度</text><line x1="720" y1="470" x2="1020" y2="640" stroke="#277fc5" stroke-width="7" marker-end="url(#arr)"/><text x="1040" y="660" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">帆的推力</text><line x1="720" y1="470" x2="720" y2="640" stroke="#c4565a" stroke-width="5" marker-end="url(#arr)"/><text x="565" y="685" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">这一分量给绕行“减速”</text><text x="75" y="800" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">适当安排帆的朝向，让推力含有逆着绕行的分量，可逐渐降低轨道能量。</text><text x="75" y="844" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">这是方向关系图；实际轨迹需要连续积分，不能把瞬间箭头当成完整航线。</text></svg>