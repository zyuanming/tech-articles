<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">光没有静止质量，为什么还能推东西？</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">动量可以被传递；吸收与反射，都能改变光的动量。</text><rect x="70" y="190" width="580" height="570" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="360" y="255" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" fill="#173449">吸收：光被接住</text><rect x="420" y="310" width="22" height="270" rx="0" fill="#516d7d" stroke="none" stroke-width="3"/><line x1="105" y1="390" x2="400" y2="390" stroke="#ef9754" stroke-width="8" marker-end="url(#arr)"/><text x="185" y="350" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">入射光</text><line x1="460" y1="420" x2="610" y2="420" stroke="#277fc5" stroke-width="8" marker-end="url(#arr)"/><text x="120" y="650" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">帆获得动量</text><text x="120" y="694" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">“向前推”取决于动量收支</text><rect x="765" y="190" width="580" height="570" rx="22" fill="white" stroke="#b6c9ce" stroke-width="3"/><text x="1055" y="255" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" fill="#173449">反射：光改变方向</text><rect x="1115" y="310" width="22" height="270" rx="0" fill="#516d7d" stroke="none" stroke-width="3"/><line x1="800" y1="390" x2="1095" y2="390" stroke="#ef9754" stroke-width="8" marker-end="url(#arr)"/><text x="880" y="350" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">入射光</text><line x1="1095" y1="490" x2="795" y2="490" stroke="#ef9754" stroke-width="8" marker-end="url(#arr)"/><text x="880" y="535" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">反射光</text><line x1="1155" y1="420" x2="1305" y2="420" stroke="#277fc5" stroke-width="8" marker-end="url(#arr)"/><text x="815" y="650" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">理想正面反射时，动量变化更大</text><text x="815" y="694" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">“向前推”取决于动量收支</text><text x="720" y="830" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">这是光动量的示意，不能把光子当成有静止质量的小钢球。</text></svg>