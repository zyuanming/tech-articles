<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">推力小到什么程度？先算一个透明的例子</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">教学条件：接近地球公转轨道、阳光正面照射、理想反射。</text><rect x="75" y="200" width="530" height="470" rx="22" fill="#e9f1f5" stroke="none" stroke-width="3"/><line x1="135" y1="260" x2="135" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="260" x2="495" y2="260" stroke="#b6c9ce" stroke-width="2"/><line x1="171" y1="260" x2="171" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="296" x2="495" y2="296" stroke="#b6c9ce" stroke-width="2"/><line x1="207" y1="260" x2="207" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="332" x2="495" y2="332" stroke="#b6c9ce" stroke-width="2"/><line x1="243" y1="260" x2="243" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="368" x2="495" y2="368" stroke="#b6c9ce" stroke-width="2"/><line x1="279" y1="260" x2="279" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="404" x2="495" y2="404" stroke="#b6c9ce" stroke-width="2"/><line x1="315" y1="260" x2="315" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="440" x2="495" y2="440" stroke="#b6c9ce" stroke-width="2"/><line x1="351" y1="260" x2="351" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="476" x2="495" y2="476" stroke="#b6c9ce" stroke-width="2"/><line x1="387" y1="260" x2="387" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="512" x2="495" y2="512" stroke="#b6c9ce" stroke-width="2"/><line x1="423" y1="260" x2="423" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="548" x2="495" y2="548" stroke="#b6c9ce" stroke-width="2"/><line x1="459" y1="260" x2="459" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="584" x2="495" y2="584" stroke="#b6c9ce" stroke-width="2"/><line x1="495" y1="260" x2="495" y2="620" stroke="#b6c9ce" stroke-width="2"/><line x1="135" y1="620" x2="495" y2="620" stroke="#b6c9ce" stroke-width="2"/><text x="315" y="725" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">10米 × 10米 = 100平方米</text><text x="730" y="260" text-anchor="start" font-family="Noto Sans CJK SC" font-size="34" font-weight="normal" fill="#173449">每平方米约 0.000009 牛顿</text><text x="730" y="330" text-anchor="start" font-family="Noto Sans CJK SC" font-size="34" font-weight="normal" fill="#173449">× 100 平方米</text><text x="730" y="400" text-anchor="start" font-family="Noto Sans CJK SC" font-size="34" font-weight="normal" fill="#173449">≈ 0.0009 牛顿</text><line x1="750" y1="465" x2="1220" y2="465" stroke="#b6c9ce" stroke-width="3"/><text x="730" y="535" text-anchor="start" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">相当于地球上约 0.09克</text><text x="730" y="590" text-anchor="start" font-family="Noto Sans CJK SC" font-size="33" font-weight="normal" fill="#173449">物体受到的重力大小</text><text x="100" y="810" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">只有“十分之一克左右的重量感”，却可以持续作用很久。</text><text x="100" y="854" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">这不是ACS3实测推力；倾角、反射率和日距会改变结果。</text></svg>