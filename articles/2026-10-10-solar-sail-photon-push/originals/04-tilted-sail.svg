<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">帆转一个角度，推力也会转向</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">理想镜面模型：光的反射方向改变，帆受到的推力沿帆面的法线方向。</text><line x1="710" y1="250" x2="430" y2="650" stroke="#516d7d" stroke-width="22"/><text x="450" y="745" text-anchor="start" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" fill="#173449">倾斜的帆</text><line x1="150" y1="450" x2="550" y2="450" stroke="#ef9754" stroke-width="8" marker-end="url(#arr)"/><text x="175" y="390" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">阳光从左侧来</text><line x1="570" y1="450" x2="470" y2="175" stroke="#ef9754" stroke-width="8" marker-end="url(#arr)"/><text x="75" y="215" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">反射光</text><line x1="570" y1="450" x2="970" y2="730" stroke="#277fc5" stroke-width="9" marker-end="url(#arr)"/><text x="980" y="770" text-anchor="start" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">帆受到的推力</text><line x1="570" y1="450" x2="970" y2="450" stroke="#b6c9ce" stroke-width="4" marker-end="url(#arr)"/><text x="930" y="420" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">背离太阳的分量</text><line x1="970" y1="450" x2="970" y2="730" stroke="#579677" stroke-width="5" marker-end="url(#arr)"/><text x="1000" y="610" text-anchor="start" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">侧向分量</text><text x="75" y="810" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">不是把阳光当作一根可以向任何方向拉的绳子。</text><text x="75" y="854" text-anchor="start" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">改变帆角能改变动量交换的方向，但仍受光学与轨道条件约束。</text></svg>