<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>四个小工具，组成一个统计任务</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">四个小工具，组成一个统计任务</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">每一段的输出，都要符合下一段的输入契约</text>
<rect x="45" y="300" width="190" height="155" rx="16" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="140.0" y="349" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#087f8c" text-anchor="middle">printf</text>
<text x="140.0" y="394" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">生成六行</text>
<line x1="240" y1="377" x2="266" y2="377" stroke="#183747" stroke-width="4"/>
<polygon points="266,377 250.6923992600045,384.3944140798909 250.6923992600045,369.6055859201091" fill="#183747" stroke="#183747" stroke-width="3"/>
<rect x="277" y="300" width="190" height="155" rx="16" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="372.0" y="349" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#5276bf" text-anchor="middle">sort</text>
<text x="372.0" y="394" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">相同相邻</text>
<line x1="472" y1="377" x2="498" y2="377" stroke="#183747" stroke-width="4"/>
<polygon points="498,377 482.6923992600045,384.3944140798909 482.6923992600045,369.6055859201091" fill="#183747" stroke="#183747" stroke-width="3"/>
<rect x="509" y="300" width="190" height="155" rx="16" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="604.0" y="349" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#e57735" text-anchor="middle">uniq -c</text>
<text x="604.0" y="394" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">相邻计数</text>
<line x1="704" y1="377" x2="730" y2="377" stroke="#183747" stroke-width="4"/>
<polygon points="730,377 714.6923992600045,384.3944140798909 714.6923992600045,369.6055859201091" fill="#183747" stroke="#183747" stroke-width="3"/>
<rect x="741" y="300" width="190" height="155" rx="16" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="836.0" y="349" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#087f8c" text-anchor="middle">sort -nr</text>
<text x="836.0" y="394" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="middle">按数逆序</text>
<text x="480" y="590" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#183747" text-anchor="middle">竖线 | ：把前段 stdout 接到后段 stdin</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">这些程序不必预先知道彼此的名字。</text></svg>