<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1267" viewBox="0 0 960 760" role="img"><title>判断站在哪边，只需一个带符号的量</title><rect width="960" height="760" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">判断站在哪边，只需一个带符号的量</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">s(P) = (Bx−Ax)(Py−Ay) − (By−Ay)(Px−Ax)</text>
<line x1="100" y1="180" x2="100" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="180" y1="180" x2="180" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="260" y1="180" x2="260" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="340" y1="180" x2="340" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="420" y1="180" x2="420" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="500" y1="180" x2="500" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="580" y1="180" x2="580" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="660" y1="180" x2="660" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="740" y1="180" x2="740" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="820" y1="180" x2="820" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="100" y1="180" x2="860" y2="180" stroke="#d2dbd8" stroke-width="1"/>
<line x1="100" y1="260" x2="860" y2="260" stroke="#d2dbd8" stroke-width="1"/>
<line x1="100" y1="340" x2="860" y2="340" stroke="#d2dbd8" stroke-width="1"/>
<line x1="100" y1="420" x2="860" y2="420" stroke="#d2dbd8" stroke-width="1"/>
<line x1="100" y1="500" x2="860" y2="500" stroke="#d2dbd8" stroke-width="1"/>
<line x1="100" y1="580" x2="860" y2="580" stroke="#d2dbd8" stroke-width="1"/>
<line x1="440" y1="600" x2="440" y2="175" stroke="#e57735" stroke-width="6"/>
<polygon points="440,175 447.3944140798909,190.3076007399955 432.6055859201091,190.3076007399955" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<circle cx="440" cy="540" r="8" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="454" y="527" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#e57735" text-anchor="start">A=(4,1)</text>
<circle cx="440" cy="260" r="8" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="454" y="247" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#e57735" text-anchor="start">B=(4,5)</text>
<circle cx="240" cy="400" r="8" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="95" y="375" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#087f8c" text-anchor="start">P=(2,3)</text>
<circle cx="640" cy="400" r="8" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
<text x="654" y="387" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#5276bf" text-anchor="start">Q=(6,3)</text>
<text x="115" y="640" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#087f8c" text-anchor="start">P：s = +8</text>
<text x="600" y="640" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#5276bf" text-anchor="start">Q：s = −8</text>
<text x="42" y="722" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">正负号对应哪一边取决于分割线方向；零表示在线上。</text></svg>