<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1383" viewBox="0 0 960 830" role="img"><title>一张空间地图，两种遍历次序</title><rect width="960" height="830" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">一张空间地图，两种遍历次序</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">视点移动后，树不变，先访问的孩子改变</text>
<rect x="75" y="170" width="390" height="230" rx="0" fill="#ffffff" stroke="#183747" stroke-width="4"/>
<line x1="270" y1="170" x2="270" y2="400" stroke="#e57735" stroke-width="5"/>
<line x1="75" y1="285" x2="270" y2="285" stroke="#5276bf" stroke-width="5"/>
<text x="145" y="235" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#183747" text-anchor="start">A</text>
<text x="145" y="355" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#183747" text-anchor="start">B</text>
<text x="350" y="295" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#183747" text-anchor="start">C</text>
<circle cx="145" cy="345" r="12" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<circle cx="375" cy="235" r="12" fill="#c54c53" stroke="#c54c53" stroke-width="3"/>
<text x="520" y="245" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#087f8c" text-anchor="start">绿点：B → A → C</text>
<text x="520" y="320" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#c54c53" text-anchor="start">红点：C → A → B</text>
<line x1="480" y1="480" x2="275" y2="600" stroke="#183747" stroke-width="4"/>
<line x1="480" y1="480" x2="720" y2="600" stroke="#183747" stroke-width="4"/>
<line x1="275" y1="600" x2="145" y2="730" stroke="#183747" stroke-width="4"/>
<line x1="275" y1="600" x2="390" y2="730" stroke="#183747" stroke-width="4"/>
<rect x="400" y="445" width="160" height="65" rx="20" fill="#ffffff" stroke="#e57735" stroke-width="4"/>
<text x="480" y="492" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#e57735" text-anchor="middle">x=4</text>
<rect x="195" y="565" width="160" height="65" rx="20" fill="#ffffff" stroke="#5276bf" stroke-width="4"/>
<text x="275" y="612" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#5276bf" text-anchor="middle">y=3</text>
<rect x="640" y="565" width="160" height="65" rx="20" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
<text x="720" y="612" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#087f8c" text-anchor="middle">C</text>
<rect x="65" y="695" width="160" height="65" rx="20" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
<text x="145" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#087f8c" text-anchor="middle">A</text>
<rect x="310" y="695" width="160" height="65" rx="20" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
<text x="390" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#087f8c" text-anchor="middle">B</text>
<text x="42" y="792" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">先近后远说的是分割面的同侧优先，不是按中心距离排序。</text></svg>