<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">先拿两条带子，做一个“为什么会弯”的模型</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">只有“伸长不同”还不够；两层必须粘在一起，才会互相约束。</text><text x="80" y="210" text-anchor="start" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">① 两层自由伸长</text><rect x="100" y="260" width="400" height="65" rx="0" fill="#ef9754" stroke="none" stroke-width="3"/><rect x="100" y="350" width="300" height="65" rx="0" fill="#277fc5" stroke="none" stroke-width="3"/><text x="110" y="475" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">橙层想变得更长</text><text x="110" y="519" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">蓝层变化较小</text><text x="750" y="210" text-anchor="start" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">② 粘在一起，只好弯曲</text><path d="M 820 430 Q 1000 180 1230 430" fill="none" stroke="#ef9754" stroke-width="65" stroke-linecap="round" stroke-linejoin="round"/><path d="M 845 455 Q 1010 245 1205 455" fill="none" stroke="#277fc5" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/><line x1="1020" y1="320" x2="1020" y2="550" stroke="#516d7d" stroke-width="3" marker-end="url(#arr)"/><text x="800" y="630" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">更长的一层走外侧弧线</text><text x="800" y="674" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">更短的一层走内侧弧线</text><text x="800" y="718" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">整体向伸长较少的一侧弯</text><rect x="65" y="775" width="1310" height="75" rx="18" fill="#eaf0e9" stroke="none" stroke-width="3"/><text x="100" y="825" text-anchor="start" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">两层的共同选择：不分家，用曲率容纳长度差。</text></svg>