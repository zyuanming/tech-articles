<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">水让细胞壁膨胀，纤维方向决定怎么膨胀</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">真实鳞片的结构更复杂；这里先看“有方向的伸缩”。</text><rect x="110" y="260" width="320" height="350" rx="18" fill="#e9d8b7" stroke="#a38460" stroke-width="3"/><line x1="155.0" y1="290" x2="155.0" y2="580" stroke="#926645" stroke-width="10"/><line x1="212.5" y1="290" x2="212.5" y2="580" stroke="#926645" stroke-width="10"/><line x1="270.0" y1="290" x2="270.0" y2="580" stroke="#926645" stroke-width="10"/><line x1="327.5" y1="290" x2="327.5" y2="580" stroke="#926645" stroke-width="10"/><line x1="385.0" y1="290" x2="385.0" y2="580" stroke="#926645" stroke-width="10"/><text x="270.0" y="690" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">较干时</text><rect x="790" y="260" width="430" height="350" rx="18" fill="#e9d8b7" stroke="#a38460" stroke-width="3"/><line x1="835.0" y1="290" x2="835.0" y2="580" stroke="#926645" stroke-width="10"/><line x1="920.0" y1="290" x2="920.0" y2="580" stroke="#926645" stroke-width="10"/><line x1="1005.0" y1="290" x2="1005.0" y2="580" stroke="#926645" stroke-width="10"/><line x1="1090.0" y1="290" x2="1090.0" y2="580" stroke="#926645" stroke-width="10"/><line x1="1175.0" y1="290" x2="1175.0" y2="580" stroke="#926645" stroke-width="10"/><text x="1005.0" y="690" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">吸水后</text><line x1="510" y1="420" x2="710" y2="420" stroke="#277fc5" stroke-width="7" marker-end="url(#arr)"/><text x="610" y="375" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">吸水</text><line x1="800" y1="205" x2="1210" y2="205" stroke="#ef9754" stroke-width="5" marker-end="url(#arr)"/><line x1="1210" y1="215" x2="800" y2="215" stroke="#ef9754" stroke-width="5" marker-end="url(#arr)"/><text x="95" y="770" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">平行“加强筋”的方向较难伸长；垂直方向可以膨胀得更多。</text><text x="95" y="814" text-anchor="start" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">不同组织的纤维排列不同，整片鳞片的伸缩就不一致。</text></svg>