<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">把微小伸缩，累积成肉眼看见的运动</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">不是每个细胞都走很远，而是整片薄层一起改变形状。</text><rect x="75" y="210" width="380" height="530" rx="22" fill="#ffffff" stroke="#b6c9ce" stroke-width="3"/><text x="265" y="685" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">水进入细胞壁</text><circle cx="140" cy="340" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="215" cy="340" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="290" cy="340" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="365" cy="340" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="140" cy="400" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="215" cy="400" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="290" cy="400" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="365" cy="400" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="140" cy="460" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="215" cy="460" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="290" cy="460" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><circle cx="365" cy="460" r="19" fill="#45bac6" stroke="none" stroke-width="3"/><line x1="260" y1="245" x2="260" y2="305" stroke="#277fc5" stroke-width="5" marker-end="url(#arr)"/><line x1="465" y1="475" x2="525" y2="475" stroke="#173449" stroke-width="4" marker-end="url(#arr)"/><rect x="515" y="210" width="380" height="530" rx="22" fill="#ffffff" stroke="#b6c9ce" stroke-width="3"/><text x="705" y="685" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">各层伸缩不同</text><rect x="570" y="310" width="260" height="28" rx="0" fill="#ef9754" stroke="none" stroke-width="3"/><rect x="570" y="355" width="250" height="28" rx="0" fill="#ef9754" stroke="none" stroke-width="3"/><rect x="570" y="400" width="240" height="28" rx="0" fill="#ef9754" stroke="none" stroke-width="3"/><rect x="570" y="445" width="230" height="28" rx="0" fill="#277fc5" stroke="none" stroke-width="3"/><rect x="570" y="490" width="220" height="28" rx="0" fill="#277fc5" stroke="none" stroke-width="3"/><line x1="905" y1="475" x2="965" y2="475" stroke="#173449" stroke-width="4" marker-end="url(#arr)"/><rect x="955" y="210" width="380" height="530" rx="22" fill="#ffffff" stroke="#b6c9ce" stroke-width="3"/><text x="1145" y="685" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">鳞片尖端移动</text><circle cx="1015" cy="510" r="15" fill="#173449" stroke="none" stroke-width="3"/><path d="M1015 510 Q1165 470 1255 380" fill="none" stroke="#ef9754" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><path d="M1015 510 Q1090 390 1085 280" fill="none" stroke="#277fc5" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><path d="M1240 340 Q1210 275 1130 255" fill="none" stroke="#516d7d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="720" y="820" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">能量来自与环境交换水分的过程，并不是“无中生有”。</text></svg>