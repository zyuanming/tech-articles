<text x="42" y="672" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">只有 MUL 完成后，栈顶才是 12；最后 ADD 得 14。</text></svg>