<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>不是每个字母都变短</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">不是每个字母都变短</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">平均长度 = 各码长 × 各自概率，再相加</text>
<text x="60" y="220" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#183747" text-anchor="start">A</text>
<text x="140" y="220" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#183747" text-anchor="start">4/8 × 1</text>
<rect x="380" y="180" width="240" height="55" rx="0" fill="#087f8c" stroke="#d2dbd8" stroke-width="2"/>
<text x="790" y="220" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">4/8</text>
<text x="60" y="325" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#183747" text-anchor="start">B</text>
<text x="140" y="325" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#183747" text-anchor="start">2/8 × 2</text>
<rect x="380" y="285" width="240" height="55" rx="0" fill="#5276bf" stroke="#d2dbd8" stroke-width="2"/>
<text x="790" y="325" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">4/8</text>
<text x="60" y="430" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#183747" text-anchor="start">C</text>
<text x="140" y="430" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#183747" text-anchor="start">1/8 × 3</text>
<rect x="380" y="390" width="180" height="55" rx="0" fill="#e57735" stroke="#d2dbd8" stroke-width="2"/>
<text x="790" y="430" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">3/8</text>
<text x="60" y="535" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="38" font-weight="400" fill="#183747" text-anchor="start">D</text>
<text x="140" y="535" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#183747" text-anchor="start">1/8 × 3</text>
<rect x="380" y="495" width="180" height="55" rx="0" fill="#c54c53" stroke="#d2dbd8" stroke-width="2"/>
<text x="790" y="535" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">3/8</text>
<text x="70" y="690" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="40" font-weight="400" fill="#087f8c" text-anchor="start">总和 14/8 = 1.75 bit/符号</text></svg>