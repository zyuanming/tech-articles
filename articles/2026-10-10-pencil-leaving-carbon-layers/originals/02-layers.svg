" stroke-width="3"/><circle cx="472.0" cy="529.3486742963366" r="5" fill="#173449" stroke="none" stroke-width="3"/><circle cx="449.0" cy="569.1858428704209" r="5" fill="#173449" stroke="none" stroke-width="3"/><text x="330" y="260" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">层内：蜂窝状的原子网络</text><polygon points="820,400 1170,400 1290,330 940,330" fill="#b4d4d8" stroke="#277fc5" stroke-width="3"/><polygon points="834,465 1184,465 1304,395 954,395" fill="#b4d4d8" stroke="#277fc5" stroke-width="3"/><polygon points="848,530 1198,530 1318,460 968,460" fill="#b4d4d8" stroke="#277fc5" stroke-width="3"/><polygon points="862,595 1212,595 1332,525 982,525" fill="#b4d4d8" stroke="#277fc5" stroke-width="3"/><text x="1060" y="260" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">层间：较弱的相互作用</text><text x="130" y="815" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">撕破一张纸，与把一叠纸中的几张滑开，是不同的任务。</text><text x="130" y="859" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">类比只说明“不同方向的连接不同”；石墨不是由真正的纸张组成。</text></svg>