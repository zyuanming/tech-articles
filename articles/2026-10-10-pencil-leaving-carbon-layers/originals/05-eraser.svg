<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">橡皮不是把碳原子“擦没了”，而是在搬走它们</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">摩擦、黏附与橡皮表面的更新共同参与；不同橡皮的材料配方不同。</text><line x1="90" y1="675" x2="1350" y2="675" stroke="#bca98b" stroke-width="9"/><rect x="1100" y="641" width="35" height="10" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="1145" y="651" width="35" height="10" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="1190" y="641" width="35" height="10" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="1235" y="651" width="35" height="10" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="1280" y="641" width="35" height="10" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="690" y="375" width="400" height="265" rx="4" fill="#d9a7ac" stroke="#516d7d" stroke-width="3"/><text x="890" y="490" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="35" font-weight="normal" fill="#173449">橡皮</text><line x1="720" y1="310" x2="1080" y2="310" stroke="#277fc5" stroke-width="5" marker-end="url(#arr)"/><text x="900" y="265" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">向前摩擦</text><ellipse cx="500" cy="590" rx="28" ry="16" fill="#bd9597" stroke="none" stroke-width="3"/><circle cx="500" cy="590" r="7" fill="#173449" stroke="none" stroke-width="3"/><ellipse cx="550" cy="550" rx="28" ry="16" fill="#bd9597" stroke="none" stroke-width="3"/><circle cx="550" cy="550" r="7" fill="#173449" stroke="none" stroke-width="3"/><ellipse cx="610" cy="600" rx="28" ry="16" fill="#bd9597" stroke="none" stroke-width="3"/><circle cx="610" cy="600" r="7" fill="#173449" stroke="none" stroke-width="3"/><text x="370" y="440" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">含石墨的橡皮碎屑</text><line x1="440" y1="465" x2="520" y2="545" stroke="#516d7d" stroke-width="3" marker-end="url(#arr)"/><text x="130" y="795" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">颗粒被带离纸面，痕迹变浅；纸纤维也可能受损。</text><text x="130" y="839" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">反复用力并不等于更有效，深划痕和进入纤维的材料未必能完全清除。</text></svg>