<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">一条铅笔线，是材料从笔尖搬到了纸上</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">下面放大了笔芯、纸面和颗粒，帮助区分“留下材料”与“纸自己变黑”。</text><polygon points="180,230 310,160 625,570 555,620" fill="#e1b376" stroke="#516d7d" stroke-width="3"/><polygon points="555,620 625,570 660,730" fill="#dac6a1" stroke="#516d7d" stroke-width="3"/><polygon points="632,660 649,694 660,730 640,708" fill="#173449" stroke="#173449" stroke-width="4"/><path d="M110 750 L180 730 L245 748 L310 726 L370 745 L440 738 L510 758 L580 727 L650 750 L725 730 L790 749 L880 736 L950 757 L1040 733 L1100 750 L1310 739" fill="none" stroke="#c2ab86" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="130" y="722" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="170" y="730" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="210" y="738" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="250" y="722" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="290" y="730" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="330" y="738" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="370" y="722" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="410" y="730" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="450" y="738" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="490" y="722" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="530" y="730" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><rect x="570" y="738" width="35" height="8" rx="2" fill="#173449" stroke="none" stroke-width="3"/><line x1="700" y1="420" x2="1030" y2="420" stroke="#277fc5" stroke-width="5" marker-end="url(#arr)"/><text x="870" y="375" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">笔尖向前移动</text><text x="360" y="650" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">含石墨的细小颗粒</text><text x="1030" y="825" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="27" font-weight="normal" fill="#173449">被放大的纸面起伏</text></svg>