<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">纸看似平滑，放大后却有纤维与起伏</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">颗粒能否留下，还取决于纸、压力、笔芯配方和接触过程。</text><text x="340" y="260" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">有起伏的纸面</text><path d="M95 508 L142 540 L189 572 L236 508 L283 540 L330 572 L377 508 L424 540 L471 572 L518 508 L565 540 L612 572" fill="none" stroke="#bfac8c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><rect x="135" y="485" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><rect x="188" y="502" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><rect x="241" y="519" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><rect x="294" y="485" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><rect x="347" y="502" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><rect x="400" y="519" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><rect x="453" y="485" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><rect x="506" y="502" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><text x="340" y="680" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">接触、摩擦与吸附共同作用</text><text x="1050" y="260" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="32" font-weight="normal" fill="#173449">很光滑的表面</text><line x1="805" y1="540" x2="1315" y2="540" stroke="#516d7d" stroke-width="8"/><rect x="845" y="485" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><rect x="898" y="502" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><rect x="951" y="519" width="34" height="10" rx="3" fill="#173449" stroke="none" stroke-width="3"/><text x="1050" y="680" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="26" font-weight="normal" fill="#173449">不保证留下同样的痕迹</text><text x="720" y="840" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" fill="#173449">“更粗糙一定更黑”也不是无条件规律，要控制变量再比较。</text></svg>