<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">H、HB、B：调整的不只是一个颜色名字</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">传统石墨—黏土笔芯的一般趋势；不同品牌与配方并非精确同一标尺。</text><rect x="140" y="325" width="320" height="175" rx="8" fill="#b4b4b4" stroke="none" stroke-width="3"/><text x="300" y="595" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">偏硬：H</text><rect x="555" y="325" width="320" height="175" rx="8" fill="#858585" stroke="none" stroke-width="3"/><text x="715" y="595" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">中间：HB</text><rect x="970" y="325" width="320" height="175" rx="8" fill="#424242" stroke="none" stroke-width="3"/><text x="1130" y="595" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">偏软、深：B</text><line x1="250" y1="745" x2="1220" y2="745" stroke="#277fc5" stroke-width="4" marker-end="url(#arr)"/><text x="720" y="810" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" fill="#173449">一般从较硬、较浅 → 较软、较深</text><text x="720" y="875" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" font-weight="normal" fill="#173449">以上色块是趋势示意，不是这些铅笔在某张纸上的实测色卡。</text></svg>