<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke"/></marker></defs><rect x="0" y="0" width="1440" height="940" rx="0" fill="#f7faf7" stroke="none" stroke-width="3"/><text x="65" y="75" text-anchor="start" font-family="Noto Sans CJK SC" font-size="42" font-weight="normal" fill="#173449">石墨能导电，不表示一条笔迹就是理想导线</text><text x="65" y="120" text-anchor="start" font-family="Noto Sans CJK SC" font-size="24" font-weight="normal" fill="#516d7d">一条真实笔迹里有颗粒、接触缝隙、黏土与纸，不能直接当成纯石墨烯。</text><polygon points="140,440 280,420 275,520 135,535" fill="#688792" stroke="#173449" stroke-width="3"/><polygon points="308,470 448,450 443,550 303,565" fill="#688792" stroke="#173449" stroke-width="3"/><polygon points="476,440 616,420 611,520 471,535" fill="#688792" stroke="#173449" stroke-width="3"/><polygon points="644,470 784,450 779,550 639,565" fill="#688792" stroke="#173449" stroke-width="3"/><polygon points="812,440 952,420 947,520 807,535" fill="#688792" stroke="#173449" stroke-width="3"/><polygon points="980,470 1120,450 1115,550 975,565" fill="#688792" stroke="#173449" stroke-width="3"/><polygon points="1148,440 1288,420 1283,520 1143,535" fill="#688792" stroke="#173449" stroke-width="3"/><line x1="135" y1="380" x2="1310" y2="380" stroke="#277fc5" stroke-width="5" marker-end="url(#arr)"/><text x="730" y="315" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" fill="#173449">电流要经过一连串颗粒与接触</text><circle cx="370" cy="575" r="22" fill="#d7c8ac" stroke="none" stroke-width="3"/><text x="370" y="660" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" font-weight="normal" fill="#173449">缝隙 / 其他组分</text><circle cx="865" cy="575" r="22" fill="#d7c8ac" stroke="none" stroke-width="3"/><text x="865" y="660" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" font-weight="normal" fill="#173449">缝隙 / 其他组分</text><text x="130" y="790" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">线宽、长度、涂画次数、接触方式，都可能改变测得的电阻。</text><text x="130" y="834" text-anchor="start" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" fill="#173449">若在老师指导下测量，只用独立电池式万用表；不接插座或外部电源。</text></svg>