<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1133" viewBox="0 0 960 680" role="img"><title>空转边：不吃字符的捷径</title><rect width="960" height="680" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">空转边：不吃字符的捷径</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">a?b 的意思：a 可以出现一次，也可以不出现</text>
<circle cx="170" cy="320" r="38" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
<text x="170" y="331" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#087f8c" text-anchor="middle">0</text>
<circle cx="480" cy="320" r="38" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
<text x="480" y="331" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#087f8c" text-anchor="middle">1</text>
<circle cx="790" cy="320" r="38" fill="#ffffff" stroke="#087f8c" stroke-width="4"/>
<text x="790" y="331" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" fill="#087f8c" text-anchor="middle">2</text>
<line x1="214" y1="320" x2="435" y2="320" stroke="#183747" stroke-width="4"/>
<polygon points="435,320 419.6923992600045,327.3944140798909 419.6923992600045,312.6055859201091" fill="#183747" stroke="#183747" stroke-width="3"/>
<text x="324.5" y="304.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#183747" text-anchor="middle">a</text>
<line x1="525" y1="320" x2="744" y2="320" stroke="#183747" stroke-width="4"/>
<polygon points="744,320 728.6923992600045,327.3944140798909 728.6923992600045,312.6055859201091" fill="#183747" stroke="#183747" stroke-width="3"/>
<text x="634.5" y="304.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#183747" text-anchor="middle">b</text>
<circle cx="790" cy="320" r="46" fill="none" stroke="#087f8c" stroke-width="3"/>
<path d="M 170 274 C 230 130,420 130,480 274" fill="none" stroke="#e57735" stroke-width="4" stroke-linejoin="round"/>
<line x1="472" y1="252" x2="480" y2="274" stroke="#e57735" stroke-width="4"/>
<polygon points="480,274 467.8195119117739,262.14100721255886 481.7179553574374,257.0870277777721" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="320" y="190" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#e57735" text-anchor="middle">ε：不读字符</text>
<rect x="65" y="425" width="825" height="140" rx="15" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<text x="87" y="468" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#183747" text-anchor="start">闭包的含义</text>
<text x="87" y="511" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="start">开始集合 = {0, 1}；输入只有 b，也能到达状态 2。</text>
<text x="42" y="642" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">沿所有 ε 边扩展，并用“已访问”避免环造成无限遍历。</text></svg>