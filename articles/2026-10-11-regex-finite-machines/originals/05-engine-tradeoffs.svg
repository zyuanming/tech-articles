<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1267" viewBox="0 0 960 760" role="img"><title>快慢取决于执行策略，不只是模式长相</title><rect width="960" height="760" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">快慢取决于执行策略，不只是模式长相</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">m = 模式长度；n = 输入长度；只讨论可支持的正则子集</text>
<rect x="48" y="170" width="860" height="148" rx="15" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<text x="70" y="213" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#183747" text-anchor="start">逐路回溯</text>
<text x="70" y="256" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="start">沿一条路试，失败再回头；某些模式有指数数量候选路径。</text>
<text x="70" y="296" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="start">现代引擎可能有优化、限制或混合策略，不能只凭名字断言。</text>
<rect x="48" y="345" width="860" height="148" rx="15" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<text x="70" y="388" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#183747" text-anchor="start">Thompson NFA 状态集合</text>
<text x="70" y="431" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="start">每个字符更新一组去重状态；常用构造下时间 O(mn)。</text>
<text x="70" y="471" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="start">固定模式时随输入长度线性增长；活跃集合空间 O(m)。</text>
<rect x="48" y="520" width="860" height="148" rx="15" fill="#ffffff" stroke="#d2dbd8" stroke-width="2"/>
<text x="70" y="563" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700" fill="#183747" text-anchor="start">DFA：把集合缓存为一个大状态</text>
<text x="70" y="606" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="start">匹配时转移简单；但最坏情况可有 2^m 量级的集合。</text>
<text x="70" y="646" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="400" fill="#183747" text-anchor="start">它把一部分时间成本变成了编译成本或缓存空间。</text>
<text x="42" y="722" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">这不是跑分图；它比较的是理论工作量与资源取舍。</text></svg>