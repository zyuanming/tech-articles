<text x="810" y="352" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#183747" text-anchor="middle">T</text>
<text x="480" y="143" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#c54c53" text-anchor="middle">A：h=100，f=102</text>
<text x="480" y="591" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#e57735" text-anchor="middle">B：h=0，f=1</text>
<text x="42" y="662" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">最佳路线代价 4，却可能先取出代价 9 的目标。</text></svg>