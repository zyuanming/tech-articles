<text x="315.0" y="406.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#183747" text-anchor="middle">1</text>
<line x1="480" y1="505" x2="810" y2="340" stroke="#e57735" stroke-width="7"/>
<text x="645.0" y="406.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="33" font-weight="400" fill="#183747" text-anchor="middle">8</text>
