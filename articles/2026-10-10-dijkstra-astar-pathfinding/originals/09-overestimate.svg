<text x="150" y="352" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#183747" text-anchor="middle">S</text>
<circle cx="480" cy="205" r="37" fill="#ffffff" stroke="#183747" stroke-width="3"/>
<text x="480" y="217" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#183747" text-anchor="middle">A</text>
<circle cx="480" cy="505" r="37" fill="#ffffff" stroke="#183747" stroke-width="3"/>
<text x="480" y="517" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#183747" text-anchor="middle">B</text>
