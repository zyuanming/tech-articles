<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>有前后两张快照，就能补出中间位置</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">有前后两张快照，就能补出中间位置</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">快照 A：1000 ms，x=10；快照 B：1100 ms，x=12</text>
<line x1="130" y1="350" x2="830" y2="350" stroke="#d2dbd8" stroke-width="6"/>
<circle cx="130" cy="350" r="16" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="130" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#087f8c" text-anchor="middle">A</text>
<text x="130" y="414" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#087f8c" text-anchor="middle">1000 ms</text>
<text x="130" y="472" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#087f8c" text-anchor="middle">x = 10</text>
<circle cx="410" cy="350" r="16" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="410" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#e57735" text-anchor="middle">显示</text>
<text x="410" y="414" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#e57735" text-anchor="middle">1040 ms</text>
<text x="410" y="472" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#e57735" text-anchor="middle">x = 10.8</text>
<circle cx="830" cy="350" r="16" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
<text x="830" y="265" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#5276bf" text-anchor="middle">B</text>
<text x="830" y="414" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#5276bf" text-anchor="middle">1100 ms</text>
<text x="830" y="472" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#5276bf" text-anchor="middle">x = 12</text>
<text x="100" y="600" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="36" font-weight="400" fill="#183747" text-anchor="start">α = (1040−1000) ÷ 100 = 0.4</text>
<text x="100" y="670" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#183747" text-anchor="start">x = 10 + 0.4 × (12−10) = 10.8</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">这是已知两点之间的插值；直线匀速只是一种近似。</text></svg>