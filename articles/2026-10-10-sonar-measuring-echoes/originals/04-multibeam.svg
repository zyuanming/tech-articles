<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">从测一个点，到给海底“扫一条带”</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">扇形波束为教学图解，不是拍到了海中的可见光线</text><rect x="80" y="290" width="1440" height="460" rx="15" fill="#deeff4" stroke="none" stroke-width="3"/><polygon points="710,270 910,270 875,325 745,325" fill="#18354a" stroke="#18354a" stroke-width="4"/><rect x="770" y="190" width="80" height="80" rx="15" fill="#a8c4cf" stroke="#18354a" stroke-width="3"/><polygon points="810,340 235,750 1400,750" fill="#b9dedf" stroke="#008576" stroke-width="2"/><line x1="810" y1="340" x2="235" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="318" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="401" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="484" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="567" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="650" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="733" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="816" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="899" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="982" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="1065" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="1148" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="1231" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="1314" y2="750" stroke="#008576" stroke-width="3"/><line x1="810" y1="340" x2="1397" y2="750" stroke="#008576" stroke-width="3"/><text x="100" y="255" font-size="33" fill="#18354a" text-anchor="start" font-weight="normal">船前进，每次发射获得一条横向测带</text><line x1="1320" y1="320" x2="1470" y2="240" stroke="#18354a" stroke-width="6"/><polygon points="1470,240 1459.2586400994242,255.67237019363375 1451.0009419015057,240.18918607253698" fill="#18354a" stroke="#18354a" stroke-width="4"/><text x="150" y="830" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">阵列结合发射与接收的方向性，把来自不同方向的回声区分开。</text></g></svg>