<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">“离我多远”与“在我下面多深”不是同一个量</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">平直声路、平坦参考面的几何模型；实际还需声速剖面与姿态等修正</text><rect x="90" y="230" width="1420" height="550" rx="15" fill="#dfedf1" stroke="none" stroke-width="3"/><polygon points="280,270 480,270 445,325 315,325" fill="#18354a" stroke="#18354a" stroke-width="4"/><rect x="340" y="190" width="80" height="80" rx="15" fill="#a8c4cf" stroke="#18354a" stroke-width="3"/><line x1="380" y1="340" x2="380" y2="730" stroke="#167aaf" stroke-width="6"/><line x1="380" y1="730" x2="1200" y2="730" stroke="#506979" stroke-width="4" stroke-dasharray="12 12"/><line x1="380" y1="340" x2="1200" y2="730" stroke="#d95d39" stroke-width="7"/><polygon points="1200,730 1181.0123478143496,730.6848828197333 1188.5491517517373,714.8382694129178" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><path d="M 380,690 L 420,690 L 420,730" stroke="#167aaf" stroke-width="4" fill="none"/><text x="470" y="380" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">方向偏离竖直 θ</text><text x="160" y="600" font-size="31" fill="#167aaf" text-anchor="start" font-weight="normal">垂直深度 h</text><text x="840" y="520" font-size="38" fill="#d95d39" text-anchor="start" font-weight="normal">斜距 R</text><text x="1100" y="610" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">目标在侧方</text><text x="135" y="845" font-size="32" fill="#18354a" text-anchor="start" font-weight="normal">测到距离 R，再结合方向求深度；平直声路模型中 h = R cos θ。</text></g></svg>