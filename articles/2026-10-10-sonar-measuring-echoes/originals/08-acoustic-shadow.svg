<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">声呐图也有影子，但不是太阳晒出来的</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">亮暗显示方案可以反转；这里只画声路遮挡关系，不对应某一真实沉船</text><rect x="75" y="270" width="1450" height="465" rx="15" fill="#e2edf0" stroke="none" stroke-width="3"/><circle cx="210" cy="355" r="40" fill="#167aaf" stroke="none" stroke-width="3"/><text x="95" y="235" font-size="31" fill="#167aaf" text-anchor="start" font-weight="normal">侧扫声呐</text><line x1="80" y1="735" x2="1520" y2="735" stroke="#786c60" stroke-width="6"/><rect x="645" y="560" width="140" height="175" rx="5" fill="#aeb6b7" stroke="#18354a" stroke-width="3"/><polygon points="645,560 1016,735 785,735 785,560" fill="#c4cbd1" stroke="none" stroke-width="4"/><line x1="250" y1="375" x2="650" y2="580" stroke="#167aaf" stroke-width="6"/><polygon points="650,580 631.0003894191535,580.1216461104386 639.0036921363028,564.5054456867326" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><line x1="210" y1="355" x2="1016" y2="735" stroke="#167aaf" stroke-width="2" stroke-dasharray="8 10"/><text x="650" y="515" font-size="35" fill="#18354a" text-anchor="start" font-weight="normal">凸起物</text><text x="995" y="675" font-size="35" fill="#506979" text-anchor="start" font-weight="normal">声学阴影</text><line x1="1015" y1="690" x2="900" y2="712" stroke="#506979" stroke-width="3"/><polygon points="900,712 914.9041608200309,700.2158585272132 918.2013034400989,717.4509222230229" fill="#506979" stroke="#506979" stroke-width="4"/><line x1="750" y1="570" x2="365" y2="390" stroke="#d95d39" stroke-width="4"/><polygon points="365,390 383.98271209525257,389.1896658042805 376.5507837171261,405.0857348352732" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="300" y="505" font-size="29" fill="#d95d39" text-anchor="start" font-weight="normal">强回声</text><text x="120" y="820" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">没有收到强回声，不一定是“什么也没有”；目标背后可能被挡住。</text></g></svg>