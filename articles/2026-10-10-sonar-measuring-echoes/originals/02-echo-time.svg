<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">听到回声之前，声音已经跑了一个来回</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">假设声速恒定、声路竖直，时间从发射到接收；数字是教学算例</text><rect x="70" y="275" width="1460" height="470" rx="15" fill="#deeff4" stroke="none" stroke-width="3"/><polygon points="320,260 520,260 485,315 355,315" fill="#18354a" stroke="#18354a" stroke-width="4"/><rect x="380" y="180" width="80" height="80" rx="15" fill="#a8c4cf" stroke="#18354a" stroke-width="3"/><line x1="70" y1="745" x2="1530" y2="745" stroke="#837a6a" stroke-width="9"/><line x1="380" y1="335" x2="380" y2="715" stroke="#d95d39" stroke-width="8"/><polygon points="380,715 371.22619566471184,698.1470964671936 388.77380433528816,698.1470964671936" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="470" y1="715" x2="470" y2="335" stroke="#167aaf" stroke-width="8"/><polygon points="470,335 478.77380433528816,351.8529035328064 461.22619566471184,351.8529035328064" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="185" y="540" font-size="35" fill="#d95d39" text-anchor="start" font-weight="normal">去程</text><text x="505" y="540" font-size="35" fill="#167aaf" text-anchor="start" font-weight="normal">回程</text><text x="810" y="395" font-size="39" fill="#18354a" text-anchor="start" font-weight="normal">记录的是往返时间 t</text><text x="810" y="495" font-size="29" fill="#18354a" text-anchor="start" font-weight="normal">声速 c × 时间 t = 两程总长度</text><text x="810" y="605" font-size="37" fill="#008576" text-anchor="start" font-weight="normal">垂直距离 = c × t ÷ 2</text><text x="110" y="835" font-size="38" fill="#18354a" text-anchor="start" font-weight="bold">示例：1500 m/s × 0.20 s ÷ 2 = 150 m</text></g></svg>