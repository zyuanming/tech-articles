<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">尺子会不会“变长”？声速不能随便填一个数</text><text x="70" y="150" font-size="23" fill="#506979" text-anchor="start" font-weight="normal">声路弯曲方向取决于声速剖面；右图只展示“可能偏离直线”，非实际海况</text><rect x="80" y="245" width="690" height="510" rx="15" fill="#dfedf1" stroke="none" stroke-width="3"/><rect x="840" y="245" width="690" height="510" rx="15" fill="#dfedf1" stroke="none" stroke-width="3"/><polygon points="135,270 335,270 300,325 170,325" fill="#18354a" stroke="#18354a" stroke-width="4"/><rect x="195" y="190" width="80" height="80" rx="15" fill="#a8c4cf" stroke="#18354a" stroke-width="3"/><polygon points="895,270 1095,270 1060,325 930,325" fill="#18354a" stroke="#18354a" stroke-width="4"/><rect x="955" y="190" width="80" height="80" rx="15" fill="#a8c4cf" stroke="#18354a" stroke-width="3"/><line x1="90" y1="430" x2="760" y2="430" stroke="#9dbac7" stroke-width="3" stroke-dasharray="10 10"/><line x1="850" y1="430" x2="1520" y2="430" stroke="#9dbac7" stroke-width="3" stroke-dasharray="10 10"/><line x1="90" y1="565" x2="760" y2="565" stroke="#9dbac7" stroke-width="3" stroke-dasharray="10 10"/><line x1="850" y1="565" x2="1520" y2="565" stroke="#9dbac7" stroke-width="3" stroke-dasharray="10 10"/><line x1="235" y1="340" x2="650" y2="700" stroke="#d95d39" stroke-width="6"/><polygon points="650,700 631.5202350625531,695.5843134331445 643.0187786742812,682.3290478807357" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><text x="140" y="820" font-size="29" fill="#d95d39" text-anchor="start" font-weight="normal">假设一路都以同样声速直行</text><path d="M 995,340 C 1030,460 1220,490 1400,670" stroke="#167aaf" stroke-width="6" fill="none"/><text x="890" y="820" font-size="29" fill="#167aaf" text-anchor="start" font-weight="normal">实际：声速变化，声路可能弯曲</text><text x="400" y="360" font-size="27" fill="#506979" text-anchor="start" font-weight="normal">水层1</text><text x="470" y="520" font-size="27" fill="#506979" text-anchor="start" font-weight="normal">水层2</text><text x="485" y="680" font-size="27" fill="#506979" text-anchor="start" font-weight="normal">水层3</text><text x="1120" y="350" font-size="28" fill="#18354a" text-anchor="start" font-weight="normal">温度、盐度、压力</text><text x="1110" y="725" font-size="28" fill="#008576" text-anchor="start" font-weight="normal">先了解水，再校正声路</text></g></svg>