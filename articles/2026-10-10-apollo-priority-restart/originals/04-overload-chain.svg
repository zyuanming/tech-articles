<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1667" viewBox="0 0 960 1000" role="img"><title>时间被打断，工作就会积压</title><rect width="960" height="1000" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">时间被打断，工作就会积压</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">雷达接口 → 中断开销 → 周期作业 → 资源报警</text>
<circle cx="90" cy="200" r="29" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
<text x="90" y="211" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#ffffff" text-anchor="middle">1</text>
<text x="155" y="196" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#5276bf" text-anchor="start">接口的参考信号有差异</text>
<text x="155" y="243" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">频率同步，不代表相位同步</text>
<line x1="90" y1="240" x2="90" y2="320" stroke="#57727c" stroke-width="4"/>
<polygon points="90,320 82.60558592010909,304.6923992600045 97.39441407989091,304.6923992600045" fill="#57727c" stroke="#57727c" stroke-width="3"/>
<circle cx="90" cy="365" r="29" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="90" y="376" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#ffffff" text-anchor="middle">2</text>
<text x="155" y="361" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#e57735" text-anchor="start">送来额外角度增量脉冲</text>
<text x="155" y="408" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">计算机按计数器中断处理</text>
<line x1="90" y1="405" x2="90" y2="485" stroke="#57727c" stroke-width="4"/>
<polygon points="90,485 82.60558592010909,469.6923992600045 97.39441407989091,469.6923992600045" fill="#57727c" stroke="#57727c" stroke-width="3"/>
<circle cx="90" cy="530" r="29" fill="#c54c53" stroke="#c54c53" stroke-width="3"/>
<text x="90" y="541" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#ffffff" text-anchor="middle">3</text>
<text x="155" y="526" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#c54c53" text-anchor="start">处理器时间被占用</text>
<text x="155" y="573" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">本轮作业可能赶不上下一轮</text>
<line x1="90" y1="570" x2="90" y2="650" stroke="#57727c" stroke-width="4"/>
<polygon points="90,650 82.60558592010909,634.6923992600045 97.39441407989091,634.6923992600045" fill="#57727c" stroke="#57727c" stroke-width="3"/>
<circle cx="90" cy="695" r="29" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="90" y="706" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#ffffff" text-anchor="middle">4</text>
<text x="155" y="691" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#087f8c" text-anchor="start">同类作业再次被安排</text>
<text x="155" y="738" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">仍未释放的临时工作区越占越多</text>
<line x1="90" y1="735" x2="90" y2="815" stroke="#57727c" stroke-width="4"/>
<polygon points="90,815 82.60558592010909,799.6923992600045 97.39441407989091,799.6923992600045" fill="#57727c" stroke="#57727c" stroke-width="3"/>
<circle cx="90" cy="860" r="29" fill="#5276bf" stroke="#5276bf" stroke-width="3"/>
<text x="90" y="871" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="400" fill="#ffffff" text-anchor="middle">5</text>
<text x="155" y="856" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#5276bf" text-anchor="start">没有足够可用工作区</text>
<text x="155" y="903" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">触发报警与软件恢复</text></svg>