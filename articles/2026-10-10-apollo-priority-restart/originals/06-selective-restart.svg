<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 960 1020" role="img"><title>恢复重要工作，而不是一切归零</title><rect width="960" height="1020" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">恢复重要工作，而不是一切归零</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">恢复点与保留状态，必须在事前一起设计</text>
<rect x="65" y="157" width="825" height="117" rx="15" fill="#ffffff" stroke="#c54c53" stroke-width="3"/>
<text x="477" y="205" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#c54c53" text-anchor="middle">识别过载</text>
<text x="477" y="249" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="middle">正常调度无法继续分配所需资源</text>
<line x1="477" y1="291" x2="477" y2="343" stroke="#57727c" stroke-width="5"/>
<polygon points="477,343 469.6055859201091,327.6923992600045 484.3944140798909,327.6923992600045" fill="#57727c" stroke="#57727c" stroke-width="3"/>
<rect x="65" y="357" width="825" height="117" rx="15" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="477" y="405" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#e57735" text-anchor="middle">保存必要状态，清理积压</text>
<text x="477" y="449" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="middle">区分持久进度和可重新建立的临时数据</text>
<line x1="477" y1="491" x2="477" y2="543" stroke="#57727c" stroke-width="5"/>
<polygon points="477,543 469.6055859201091,527.6923992600045 484.3944140798909,527.6923992600045" fill="#57727c" stroke="#57727c" stroke-width="3"/>
<rect x="65" y="557" width="825" height="117" rx="15" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
<text x="477" y="605" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#087f8c" text-anchor="middle">从预设恢复点启动</text>
<text x="477" y="649" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="middle">重新安排关键流程，而非任意回放指令</text>
<line x1="477" y1="691" x2="477" y2="743" stroke="#57727c" stroke-width="5"/>
<polygon points="477,743 469.6055859201091,727.6923992600045 484.3944140798909,727.6923992600045" fill="#57727c" stroke="#57727c" stroke-width="3"/>
<rect x="65" y="757" width="825" height="117" rx="15" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="477" y="805" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#5276bf" text-anchor="middle">核对关键功能是否正常</text>
<text x="477" y="849" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="middle">恢复不等于故障根因已经消失</text></svg>