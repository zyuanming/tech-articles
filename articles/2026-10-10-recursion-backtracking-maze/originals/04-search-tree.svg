<text x="475" y="610" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#183747" text-anchor="middle">首次到访：S A B C（退回）D E T</text>
<text x="42" y="752" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">返回 A 时，不重走 B，而是继续 A 尚未尝试的下一支。</text></svg>