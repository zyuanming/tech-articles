<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1117" viewBox="0 0 960 670" role="img"><title>断网时，承诺的代价</title><rect width="960" height="670" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">断网时，承诺的代价</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">三台这一侧可以形成多数；两台这一侧不行</text>
<line x1="475" y1="180" x2="475" y2="558" stroke="#c54c53" stroke-width="5" stroke-dasharray="15 12"/>
<line x1="170" y1="275" x2="320" y2="425" stroke="#e57735" stroke-width="4"/>
<line x1="660" y1="235" x2="790" y2="370" stroke="#087f8c" stroke-width="4"/>
<line x1="790" y1="370" x2="660" y2="505" stroke="#087f8c" stroke-width="4"/>
<line x1="660" y1="505" x2="660" y2="235" stroke="#087f8c" stroke-width="4"/>
<circle cx="170" cy="275" r="46" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="170" y="285" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
<circle cx="320" cy="425" r="46" fill="#e57735" stroke="#e57735" stroke-width="3"/>
<text x="320" y="435" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
<circle cx="660" cy="235" r="46" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="660" y="245" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
<circle cx="790" cy="370" r="46" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="790" y="380" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>
<circle cx="660" cy="505" r="46" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<text x="660" y="515" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
<text x="235" y="583" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#e57735" text-anchor="middle">不能提交新写入</text>
<text x="714" y="583" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="400" fill="#087f8c" text-anchor="middle">可选主、继续提交</text>
<text x="42" y="632" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">图示假设右侧网络及时、持久化正常，节点不作恶。</text></svg>