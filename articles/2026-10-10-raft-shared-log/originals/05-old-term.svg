<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 960 750" role="img"><title>旧任期：三份也未必能宣布提交</title><rect width="960" height="750" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">旧任期：三份也未必能宣布提交</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">下面格内是任期；共同第 1 项省略</text>
<text x="62" y="233" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#183747" text-anchor="start">A</text>
<rect x="210" y="195" width="130" height="56" rx="10" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="275.0" y="234.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#e57735" text-anchor="middle">2</text>
<text x="62" y="310" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#183747" text-anchor="start">B</text>
<rect x="210" y="272" width="130" height="56" rx="10" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="275.0" y="311.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#e57735" text-anchor="middle">2</text>
<text x="62" y="387" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#183747" text-anchor="start">C</text>
<rect x="210" y="349" width="130" height="56" rx="10" fill="#ffffff" stroke="#e57735" stroke-width="3"/>
<text x="275.0" y="388.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#e57735" text-anchor="middle">2</text>
<text x="62" y="464" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#183747" text-anchor="start">D</text>
<text x="62" y="541" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#183747" text-anchor="start">E</text>
<rect x="210" y="503" width="130" height="56" rx="10" fill="#ffffff" stroke="#5276bf" stroke-width="3"/>
<text x="275.0" y="542.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="700" fill="#5276bf" text-anchor="middle">3</text>
<text x="485" y="245" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="31" font-weight="700" fill="#183747" text-anchor="start">当前主 A 处在任期 4</text>
<text x="485" y="315" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#183747" text-anchor="start">它复制的是任期 2 的旧项。</text>
<text x="485" y="405" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#5276bf" text-anchor="start">E 的末项来自任期 3；</text>
<text x="485" y="453" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#5276bf" text-anchor="start">新选举时可能显得更新。</text>
<text x="485" y="548" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#087f8c" text-anchor="start">A 要先提交任期 4 的新项，</text>
<text x="485" y="596" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#087f8c" text-anchor="start">才由前缀带着旧项一起提交。</text>
<text x="42" y="712" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">不能把“多数复制”脱离任期规则，单独当成安全证明。</text></svg>