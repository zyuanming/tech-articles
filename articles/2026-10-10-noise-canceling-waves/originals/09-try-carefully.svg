<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">做一个小对照：谁被压低了，谁仍听得见？</text><rect x="80" y="250" width="450" height="490" rx="15" fill="#fff" stroke="none" stroke-width="3"/><circle cx="140" cy="315" r="35" fill="#008576" stroke="none" stroke-width="3"/><text x="140" y="328" font-size="35" fill="white" text-anchor="middle" font-weight="normal">1</text><text x="110" y="440" font-size="34" fill="#18354a" text-anchor="start" font-weight="bold">先固定条件</text><text x="110" y="555" font-size="28" fill="#18354a" text-anchor="start" font-weight="normal">同一座位、相同佩戴</text><rect x="580" y="250" width="450" height="490" rx="15" fill="#fff" stroke="none" stroke-width="3"/><circle cx="640" cy="315" r="35" fill="#008576" stroke="none" stroke-width="3"/><text x="640" y="328" font-size="35" fill="white" text-anchor="middle" font-weight="normal">2</text><text x="610" y="440" font-size="34" fill="#18354a" text-anchor="start" font-weight="bold">只改一个开关</text><text x="610" y="555" font-size="28" fill="#18354a" text-anchor="start" font-weight="normal">不放音乐，切换ANC</text><rect x="1080" y="250" width="450" height="490" rx="15" fill="#fff" stroke="none" stroke-width="3"/><circle cx="1140" cy="315" r="35" fill="#008576" stroke="none" stroke-width="3"/><text x="1140" y="328" font-size="35" fill="white" text-anchor="middle" font-weight="normal">3</text><text x="1110" y="440" font-size="34" fill="#18354a" text-anchor="start" font-weight="bold">分开记录声音</text><text x="1110" y="555" font-size="28" fill="#18354a" text-anchor="start" font-weight="normal">风扇低鸣 / 轻声讲话</text><text x="100" y="810" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">只用日常安全声源；不靠加大音量制造效果，不捂麦克风。</text><text x="100" y="858" font-size="28" fill="#506979" text-anchor="start" font-weight="normal">这是主观对照观察，不是产品实验室测试，也不能推导防护等级。</text></g></svg>