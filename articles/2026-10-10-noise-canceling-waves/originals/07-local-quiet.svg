<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><rect width="1600" height="960" fill="#f6f8f7"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="70" y="95" font-size="47" fill="#18354a" text-anchor="start" font-weight="bold">为什么一个降噪耳机不能让全教室安静？</text><rect x="80" y="245" width="1440" height="520" rx="15" fill="white" stroke="#18354a" stroke-width="3"/><circle cx="800" cy="485" r="125" fill="#cfe8e4" stroke="#008576" stroke-width="3"/><circle cx="800" cy="485" r="20" fill="#008576" stroke="none" stroke-width="3"/><text x="645" y="690" font-size="31" fill="#008576" text-anchor="start" font-weight="normal">设计要安静的区域</text><circle cx="260" cy="420" r="45" fill="#d95d39" stroke="none" stroke-width="3"/><circle cx="1250" cy="550" r="45" fill="#167aaf" stroke="none" stroke-width="3"/><text x="160" y="325" font-size="33" fill="#d95d39" text-anchor="start" font-weight="normal">外界声源</text><text x="1180" y="710" font-size="33" fill="#167aaf" text-anchor="start" font-weight="normal">抵消声源</text><line x1="300" y1="425" x2="780" y2="485" stroke="#d95d39" stroke-width="5"/><polygon points="780,485 762.1889801739414,491.6157065197717 764.3654931580717,474.2036026467299" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="1200" y1="550" x2="820" y2="485" stroke="#167aaf" stroke-width="5"/><polygon points="820,485 838.0909326465331,479.19326632446433 835.1323387058458,496.4896616700216" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><circle cx="950" cy="300" r="14" fill="#d6a038" stroke="none" stroke-width="3"/><line x1="310" y1="410" x2="940" y2="310" stroke="#d95d39" stroke-width="3"/><polygon points="940,310 924.7309214721568,321.30730918081565 921.9800259542754,303.97666741816334" fill="#d95d39" stroke="#d95d39" stroke-width="4"/><line x1="1220" y1="520" x2="960" y2="310" stroke="#167aaf" stroke-width="3"/><polygon points="960,310 978.6234744983586,313.7638009523597 967.597660829983,327.41480835130096" fill="#167aaf" stroke="#167aaf" stroke-width="4"/><text x="965" y="270" font-size="27" fill="#d6a038" text-anchor="start" font-weight="normal">换个位置，路程差变了</text><text x="95" y="825" font-size="31" fill="#18354a" text-anchor="start" font-weight="normal">局部声压变小 ≠ 全房间所有声能消失。耳机把目标区限制在耳旁。</text></g></svg>