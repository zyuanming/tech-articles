<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lisp 教学求值器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#142d42;font-family:"Noto Sans CJK SC",sans-serif;font-size:clamp(16px,4vw,42px)}main{padding:4vw;max-width:1100px;margin:auto}h1{font-size:1.15em;margin:.2em 0}p{margin:.6em 0}textarea{width:100%;height:10.5em;font:inherit;line-height:1.35;border:2px solid #587080;padding:.5em;color:inherit;background:white;resize:vertical}button{font:inherit;padding:.25em 1em;color:white;background:#176297;border:0;border-radius:8px;margin:.4em 0}#output{background:#e1f3eb;padding:.6em;overflow-wrap:anywhere}ul{margin:.3em 0;padding-left:1.3em}small{font-size:1em}.tag{color:#166c57}code{font:inherit}
</style>
<main>
<h1>Lisp 教学求值器</h1>
<p>Python 模型 · 调用时关联表</p>
<textarea aria-label="Lisp表达式" spellcheck="false">((label first
 (lambda (x)
  (cond ((atom x) x)
        (t (first (car x))))))
 '((a b) c))</textarea>
<button id="run">运行表达式</button>
<div id="output" aria-live="polite">等待运行</div>
<p>只实现本文小语言；不是历史机器。</p>
</main>
<script>
const button=document.querySelector('#run');
button.onclick=async()=>{
 const output=document.querySelector('#output');
 output.textContent='计算中';
 delete output.dataset.done;
 try {
 const response=await fetch('/eval',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:document.querySelector('textarea').value})});
 if(!response.ok){
  throw new Error(response.status===413
   ? '输入过长，请缩短表达式后重试。'
   : '请求失败（HTTP '+response.status+'），请重试。');
 }
 const data=await response.json();output.replaceChildren();
 if(data.error){output.textContent='错误：'+data.error;return;}
 const p=document.createElement('p');p.textContent='结果：'+data.result;output.append(p);
 const title=document.createElement('p');title.textContent='实际参数绑定（按发生顺序）';output.append(title);
 const ul=document.createElement('ul');
 for(const event of data.bindings){const li=document.createElement('li');li.textContent=event.params.map((name,i)=>name+' = '+event.values[i]).join('；');ul.append(li);}
 output.append(ul);output.dataset.done='true';
 } catch(error) {
  output.textContent='错误：'+(error instanceof SyntaxError
   ? '响应格式异常，请重试。'
   : error instanceof TypeError
    ? '请求失败，请检查本地服务后重试。'
    : error.message || '请求失败，请重试。');
 }
};
</script>
</html>
