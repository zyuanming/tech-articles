<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>递归下降 · Python 教学解析器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7ef;color:#192d3b;font:42px/1.6 system-ui,sans-serif}main{max-width:1062px;margin:auto;padding:38px}h1{font-size:50px;margin:0 0 12px}p{margin:14px 0}.small{font-size:40px}input,button{font:inherit;border:2px solid #165b70;border-radius:8px;padding:10px;width:100%;background:white;color:#192d3b}button{background:#e1efeb;margin-top:12px;cursor:pointer}section{border-top:3px solid #165b70;margin-top:25px;padding-top:16px}#status{font-weight:bold}code,#value,#ops li{overflow-wrap:anywhere}#tokens{display:flex;flex-wrap:wrap;gap:12px}#tokens span{border:2px solid #165b70;padding:3px 12px;background:#e1efeb}ol{padding-left:1.7em;margin:10px 0}#events{white-space:pre-wrap;font:inherit;overflow-wrap:anywhere}#marked{font-family:monospace;white-space:pre-wrap;overflow-wrap:anywhere}mark{background:#f5c7bf;color:#701a22}select{font:inherit;width:100%}[hidden]{display:none!important}@media(max-width:600px){body{font-size:17px}main{padding:18px}h1{font-size:25px}.small{font-size:15px}input,button{font-size:18px}}
</style><main><h1>递归下降 · 表达式实验</h1><p class="small">本次原创 Python 教学程序 v1</p><form id="form"><label for="source">输入整数、+ − * 与括号</label><input id="source" value="12-3*2-1" autocomplete="off"><button>解析并求值</button></form><p id="status" aria-live="polite">等待运行</p><div id="output" hidden><p id="version" class="small"></p><section><p>分词结果</p><div id="tokens"></div></section><section id="good"><p id="value"></p><p>按创建顺序构建运算节点：</p><ol id="ops"></ol><p class="small">左、右节点号只指向已经构建的节点。</p></section><section id="bad" hidden><p id="message"></p><div id="marked"></div></section><section><label for="step">查看一次实际解析事件</label><select id="step"></select><div id="events"></div></section></div></main>
<script>
let run;const $=s=>document.querySelector(s);
function eventView(){const e=run.events[Number($('#step').value)];$('#events').textContent=e?`事件 ${e.step}：${e.action} ${e.detail}\ntoken游标 ${e.index}；当前 ${e.look}\n调用栈：${e.stack.join(' → ')||'已退出'}`:'无解析事件';}
$('#step').onchange=eventView;
$('#form').onsubmit=async e=>{e.preventDefault();$('#status').textContent='运行中…';$('#output').hidden=true;
try{const response=await fetch('/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:$('#source').value})});if(!response.ok)throw new Error(`HTTP ${response.status}`);run=await response.json();if(!Array.isArray(run.events))throw new Error('返回数据不完整');$('#status').textContent=run.ok?'解析成功':'输入未通过';$('#version').textContent=`后端 Python ${run.python} · 结果由服务端计算`;
$('#tokens').replaceChildren(...run.tokens.map(t=>{const n=document.createElement('span');n.textContent=t.kind==='NUM'?t.text:t.kind;return n;}));$('#good').hidden=!run.ok;$('#bad').hidden=run.ok;
if(run.ok){$('#value').textContent=`求值结果：${run.value}`;$('#ops').replaceChildren(...run.nodes.filter(n=>n.op!=='NUM').map(n=>{const li=document.createElement('li');li.textContent=`节点 ${n.id}：${n.op}（左 ${n.left}，右 ${n.right}）= ${run.values[n.id]}`;return li;}));}else{const x=run.error;$('#message').textContent=`${x.stage}：位置 ${x.pos}，期待 ${x.expected}，遇到 ${x.found}`;const mark=document.createElement('mark');mark.textContent=run.source[x.pos]||'EOF';$('#marked').replaceChildren(document.createTextNode(run.source.slice(0,x.pos)),mark,document.createTextNode(run.source.slice(x.pos+1)));}
$('#step').replaceChildren(...run.events.map(e=>{const o=document.createElement('option');o.value=e.step;o.textContent=`${e.step} · ${e.action} ${e.detail}`;return o;}));eventView();$('#output').hidden=false;
}catch(error){$('#status').textContent=`运行失败：${error.message}。缩短输入或恢复服务后重试。`;}};
</script></html>
