<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>让圆变成点，把墙向两边加厚</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">让圆变成点，把墙向两边加厚</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">一维截面；圆半径 r = 0.05 m</text>
<rect x="465" y="200" width="70" height="360" rx="0" fill="#aab5bb" stroke="#183747" stroke-width="2"/>
<rect x="430" y="200" width="35" height="360" rx="0" fill="#f4c49e" stroke="#e57735" stroke-width="2"/>
<rect x="535" y="200" width="35" height="360" rx="0" fill="#f4c49e" stroke="#e57735" stroke-width="2"/>
<circle cx="220" cy="380" r="35" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<line x1="265" y1="380" x2="425" y2="380" stroke="#087f8c" stroke-width="6"/>
<polygon points="425,380 409.6923992600045,387.3944140798909 409.6923992600045,372.6055859201091" fill="#087f8c" stroke="#087f8c" stroke-width="3"/>
<line x1="430" y1="570" x2="430" y2="620" stroke="#e57735" stroke-width="4"/>
<line x1="570" y1="570" x2="570" y2="620" stroke="#e57735" stroke-width="4"/>
<text x="355" y="660" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#e57735" text-anchor="start">0.95</text>
<text x="545" y="660" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="400" fill="#e57735" text-anchor="start">1.15</text>
<text x="64" y="230" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">圆心进入</text>
<text x="64" y="280" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="400" fill="#183747" text-anchor="start">加厚区就接触</text>
<text x="42" y="742" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">原墙 [1, 1.1] → 圆心不能进入的区间 [0.95, 1.15]。</text></svg>