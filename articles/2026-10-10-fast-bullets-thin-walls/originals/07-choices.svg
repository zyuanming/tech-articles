<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 960 780" role="img"><title>修复穿墙前，先问这四件事</title><rect width="960" height="780" fill="#f7f4ed"/>
<text x="42" y="68" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" fill="#183747" text-anchor="start">修复穿墙前，先问这四件事</text>
<text x="42" y="114" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#57727c" text-anchor="start">按问题选择方法，不把所有对象都升级成最贵模式</text>
<text x="50" y="190" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#087f8c" text-anchor="start">速度 × 步长有多大？</text>
<text x="50" y="238" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#57727c" text-anchor="start">与物体、障碍的最薄尺寸比较</text>
<text x="50" y="325" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#5276bf" text-anchor="start">碰撞体是否真的参与检测？</text>
<text x="50" y="373" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#57727c" text-anchor="start">检查层、过滤、启用状态</text>
<text x="50" y="460" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#e57735" text-anchor="start">在查端点，还是查整段运动？</text>
<text x="50" y="508" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#57727c" text-anchor="start">射线适合点；形状扫掠考虑体积</text>
<text x="50" y="595" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#c54c53" text-anchor="start">主要是平移，还是快速旋转？</text>
<text x="50" y="643" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="400" fill="#57727c" text-anchor="start">选择匹配的 CCD，并实测边界</text></svg>