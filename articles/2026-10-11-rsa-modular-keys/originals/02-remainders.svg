<text x="705.0" y="342" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#183747" text-anchor="middle">玩具消息范围：0—54</text>
<text x="42" y="632" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="400" fill="#57727c" text-anchor="start">模运算本身会合并许多整数；RSA先限定消息代表数范围。</text></svg>