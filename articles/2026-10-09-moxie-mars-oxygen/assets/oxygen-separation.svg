<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1800" height="1000" fill="#f7f3ea"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#23333b"><text x="80" y="90" font-size="49" font-weight="700">氧原子换了搭档，原子总数没有变</text><text x="83" y="145" font-size="29" fill="#6a7779">2 CO₂ → 2 CO + O₂ · 反应示意，能量由外部电源与加热提供</text><circle cx="180" cy="270" r="34" fill="#2f7899"/><text x="180" y="281" font-size="31" fill="white" font-weight="700" text-anchor="middle">O</text><path d="M216,270L245,270" stroke="#23333b" stroke-width="3" fill="none"/><circle cx="280" cy="270" r="34" fill="#ba5d42"/><text x="280" y="281" font-size="31" fill="white" font-weight="700" text-anchor="middle">C</text><path d="M315,270L347,270" stroke="#23333b" stroke-width="3" fill="none"/><circle cx="383" cy="270" r="34" fill="#2f7899"/><text x="383" y="281" font-size="31" fill="white" font-weight="700" text-anchor="middle">O</text><circle cx="965" cy="270" r="34" fill="#ba5d42"/><text x="965" y="281" font-size="31" fill="white" font-weight="700" text-anchor="middle">C</text><path d="M1000,270L1032,270" stroke="#23333b" stroke-width="3" fill="none"/><circle cx="1068" cy="270" r="34" fill="#2f7899"/><text x="1068" y="281" font-size="31" fill="white" font-weight="700" text-anchor="middle">O</text><circle cx="180" cy="400" r="34" fill="#2f7899"/><text x="180" y="411" font-size="31" fill="white" font-weight="700" text-anchor="middle">O</text><path d="M216,400L245,400" stroke="#23333b" stroke-width="3" fill="none"/><circle cx="280" cy="400" r="34" fill="#ba5d42"/><text x="280" y="411" font-size="31" fill="white" font-weight="700" text-anchor="middle">C</text><path d="M315,400L347,400" stroke="#23333b" stroke-width="3" fill="none"/><circle cx="383" cy="400" r="34" fill="#2f7899"/><text x="383" y="411" font-size="31" fill="white" font-weight="700" text-anchor="middle">O</text><circle cx="965" cy="400" r="34" fill="#ba5d42"/><text x="965" y="411" font-size="31" fill="white" font-weight="700" text-anchor="middle">C</text><path d="M1000,400L1032,400" stroke="#23333b" stroke-width="3" fill="none"/><circle cx="1068" cy="400" r="34" fill="#2f7899"/><text x="1068" y="411" font-size="31" fill="white" font-weight="700" text-anchor="middle">O</text><path d="M555,335L830,335" stroke="#23333b" stroke-width="8" fill="none" marker-end="url(#arrow)"/><text x="690" y="287" font-size="30" fill="#23333b" font-weight="400" text-anchor="middle">电化学拆分</text><text x="1220" y="350" font-size="55" fill="#23333b" font-weight="700" text-anchor="middle">+</text><circle cx="1400" cy="335" r="34" fill="#2f7899"/><text x="1400" y="346" font-size="31" fill="white" font-weight="700" text-anchor="middle">O</text><path d="M1434,335L1468,335" stroke="#23333b" stroke-width="3" fill="none"/><circle cx="1502" cy="335" r="34" fill="#2f7899"/><text x="1502" y="346" font-size="31" fill="white" font-weight="700" text-anchor="middle">O</text><text x="290" y="495" font-size="34" fill="#23333b" font-weight="700" text-anchor="middle">二氧化碳</text><text x="1015" y="495" font-size="34" fill="#23333b" font-weight="700" text-anchor="middle">一氧化碳</text><text x="1460" y="495" font-size="34" fill="#23333b" font-weight="700" text-anchor="middle">氧气</text><rect x="80" y="565" width="1640" height="360" rx="20" fill="#e7eeec"/><text x="120" y="620" font-size="36" fill="#23333b" font-weight="700" text-anchor="start">关键部件：固体氧化物电解单元</text><rect x="790" y="650" width="180" height="200" rx="20" fill="#bfcdc7"/><text x="880" y="700" font-size="30" fill="#23333b" font-weight="700" text-anchor="middle">陶瓷</text><text x="880" y="746" font-size="30" fill="#23333b" font-weight="700" text-anchor="middle">电解质</text><text x="880" y="822" font-size="27" fill="#23333b" font-weight="400" text-anchor="middle">约800°C</text><text x="145" y="700" font-size="32" fill="#ba5d42" font-weight="400" text-anchor="start">CO₂从这一侧进入</text><text x="145" y="755" font-size="32" fill="#ba5d42" font-weight="400" text-anchor="start">留下CO等尾气</text><path d="M550,795L765,795" stroke="#2f7899" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M995,795L1225,795" stroke="#2f7899" stroke-width="7" fill="none" marker-end="url(#arrow)"/><text x="670" y="760" font-size="28" fill="#2f7899" font-weight="400" text-anchor="middle">氧离子</text><text x="1100" y="760" font-size="28" fill="#2f7899" font-weight="400" text-anchor="middle">穿过固体</text><text x="1290" y="705" font-size="32" fill="#2f7899" font-weight="400" text-anchor="start">另一侧重新</text><text x="1290" y="760" font-size="32" fill="#2f7899" font-weight="400" text-anchor="start">组合成O₂</text><text x="1290" y="825" font-size="27" fill="#2f7899" font-weight="400" text-anchor="start">测量后排出</text><text x="85" y="975" font-size="29" fill="#23333b" font-weight="400" text-anchor="start">不是把整团CO₂“筛”成氧气：发生了化学反应，并将氧与含碳尾气分开。</text></g></svg>