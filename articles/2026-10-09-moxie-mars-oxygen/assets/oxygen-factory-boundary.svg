<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><rect width="1800" height="1000" fill="#f7f3ea"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#23333b"><text x="80" y="90" font-size="49" font-weight="700">制出氧气，只完成了返航供应链的一段</text><text x="83" y="145" font-size="29" fill="#6a7779">MOXIE验证了在火星当地制氧；整套工业系统还要继续验证</text><rect x="80" y="245" width="270" height="210" rx="20" fill="#e6d5c8"/><text x="215" y="302" font-size="36" fill="#ba5d42" font-weight="700" text-anchor="middle">火星空气</text><text x="215" y="360" font-size="30" fill="#ba5d42" font-weight="400" text-anchor="middle">过滤尘埃</text><text x="215" y="410" font-size="30" fill="#ba5d42" font-weight="400" text-anchor="middle">压缩进气</text><rect x="480" y="245" width="350" height="210" rx="20" fill="#eadba9"/><text x="655" y="302" font-size="36" fill="#23333b" font-weight="700" text-anchor="middle">制氧装置</text><text x="655" y="360" font-size="30" fill="#23333b" font-weight="400" text-anchor="middle">加热与电解</text><text x="655" y="410" font-size="29" fill="#23333b" font-weight="400" text-anchor="middle">测量产量、纯度</text><rect x="965" y="245" width="350" height="210" rx="20" fill="#dce9ef" stroke="#82918d" stroke-width="3" stroke-dasharray="12 9"/><text x="1140" y="302" font-size="36" fill="#2f7899" font-weight="700" text-anchor="middle">液化与储存</text><text x="1140" y="360" font-size="30" fill="#2f7899" font-weight="400" text-anchor="middle">冷却成液体</text><text x="1140" y="410" font-size="29" fill="#2f7899" font-weight="400" text-anchor="middle">长期保管、防损耗</text><rect x="1440" y="245" width="280" height="210" rx="20" fill="#dce9ef" stroke="#82918d" stroke-width="3" stroke-dasharray="12 9"/><text x="1580" y="302" font-size="36" fill="#2f7899" font-weight="700" text-anchor="middle">上升火箭</text><text x="1580" y="360" font-size="30" fill="#2f7899" font-weight="400" text-anchor="middle">氧化剂</text><text x="1580" y="410" font-size="30" fill="#2f7899" font-weight="400" text-anchor="middle">另需燃料</text><path d="M365,350L455,350" stroke="#ba5d42" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M845,350L940,350" stroke="#2f7899" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M1330,350L1415,350" stroke="#2f7899" stroke-width="6" fill="none" marker-end="url(#arrow)"/><rect x="485" y="645" width="800" height="175" rx="20" fill="#d4e2dd"/><text x="885" y="710" font-size="40" fill="#488475" font-weight="700" text-anchor="middle">足够、可靠的电源</text><text x="885" y="766" font-size="29" fill="#488475" font-weight="400" text-anchor="middle">压缩、加热、电解、液化都要纳入能量账</text><path d="M635,625L635,485" stroke="#488475" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M1150,625L1150,485" stroke="#488475" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M530,470L440,545" stroke="#ba5d42" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="90" y="590" font-size="28" fill="#ba5d42" font-weight="400" text-anchor="start">MOXIE：测完排回大气</text><text x="90" y="910" font-size="30" fill="#23333b" font-weight="400" text-anchor="start">虚线框：此次车载试验没有提供的液氧库存与火箭加注环节。</text><text x="90" y="964" font-size="28" fill="#23333b" font-weight="400" text-anchor="start">图示是功能关系，不是某个已获批载人火星任务的工程设计。</text></g></svg>